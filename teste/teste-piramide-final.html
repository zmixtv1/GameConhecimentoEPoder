<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz TV - Corrida da Pirâmide</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-main: #0f172a;
            /* Degraus maiores que os emojis; limitados pela altura da tela para caber */
            --block-size: clamp(48px, min(7vw, 8vh), 90px);
            --block-z: clamp(16px, min(3vw, 3.6vh), 34px);
            --glass-top: rgba(245, 240, 230, 0.95);
            --glass-side-right: #d4c4a8;
            --glass-side-bottom: #e2d5bd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            user-select: none;
        }

        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: center;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .title-banner {
            position: absolute;
            top: 5vh;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: clamp(16px, 3vw, 24px);
            font-weight: 900;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(24px);
            border: 2px solid rgba(241, 196, 15, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            z-index: 100;
            max-width: 94vw;
        }

        .isometric-wrapper {
            perspective: 2500px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding-top: 65px;
        }

        .pyramid-stage {
            position: relative;
            transform: rotateX(60deg) rotateZ(45deg);
            transform-style: preserve-3d;
            flex-shrink: 0;
        }

        .pyramid-block {
            position: absolute;
            width: var(--block-size);
            height: var(--block-size);
            background: var(--glass-top);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transform-style: preserve-3d;
        }

        .pyramid-block::before {
            content: '';
            position: absolute;
            width: var(--block-z);
            height: 100%;
            top: 0;
            right: calc(var(--block-z) * -1);
            background: var(--glass-side-right);
            transform-origin: left;
            transform: rotateY(90deg);
        }

        .pyramid-block::after {
            content: '';
            position: absolute;
            width: 100%;
            height: var(--block-z);
            bottom: calc(var(--block-z) * -1);
            left: 0;
            background: var(--glass-side-bottom);
            transform-origin: top;
            transform: rotateX(-90deg);
        }

        .pyramid-block.winner { background: rgba(241, 196, 15, 0.95); }
        .pyramid-block.winner::before { background: #d4ac0d; }
        .pyramid-block.winner::after { background: #f4d03f; }

        /* Âncoras invisíveis no espaço 3D: só servem para calcular onde o animal está na tela */
        .anchors-layer {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .anchor {
            position: absolute;
            width: var(--block-size);
            height: var(--block-size);
            visibility: hidden;
        }

        /* Camada 2D por cima de tudo: os animais nunca ficam atrás dos blocos */
        .players-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
        }

        .player {
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform;
        }

        /* Sombra no chão: marca o bloco onde o animal está pisando */
        .player-shadow {
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform;
        }

        .player-shadow span {
            display: block;
            width: calc(var(--block-size) * 0.6);
            height: calc(var(--block-size) * 0.24);
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(40, 30, 15, 0.45) 0%, rgba(40, 30, 15, 0.25) 45%, rgba(40, 30, 15, 0) 72%);
            transform: translate(-50%, -50%) scale(var(--s, 1));
            opacity: var(--o, 1);
        }

        .player-icon {
            position: relative;
            font-size: clamp(28px, 4vw, 45px);
            line-height: 1;
            transform: translate(-50%, -85%);
            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.35));
        }

        .player.active .player-icon {
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9)) drop-shadow(0 5px 5px rgba(0, 0, 0, 0.35));
        }

        .player.reached .player-icon {
            filter: drop-shadow(0 0 8px #f1c40f) drop-shadow(0 5px 5px rgba(0, 0, 0, 0.3));
        }

        .trophy-icon {
            position: absolute;
            left: 55%;
            top: -60%;
            font-size: clamp(30px, 4vw, 48px);
            filter: drop-shadow(0 5px 10px rgba(241, 196, 15, 0.8));
            display: none;
        }

        .player.reached .trophy-icon { display: block; }

        .race-status {
            position: absolute;
            bottom: 4vh;
            padding: 10px 20px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--text-main);
            font-size: clamp(13px, 2vw, 18px);
            font-weight: 800;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            z-index: 100;
        }

        .race-status button {
            margin-left: 10px;
            padding: 7px 12px;
            border: 0;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-weight: 800;
            cursor: pointer;
        }

        @media (max-height: 600px) {
            .title-banner { top: 2vh; padding: 8px 16px; }
            .isometric-wrapper { padding-top: 25px; }
            .race-status { bottom: 1vh; }
        }
    </style>
</head>

<body>
    <div class="title-banner">Pirâmide do Conhecimento!</div>

    <div class="isometric-wrapper">
        <div class="pyramid-stage" id="pyramid-stage">
            <div class="anchors-layer" id="anchors-layer"></div>
        </div>
    </div>

    <div class="players-overlay" id="players-overlay"></div>

    <div class="race-status" role="status" aria-live="polite">
        <span id="status-text">Preparando a corrida…</span>
        <button id="restart-button" type="button">Reiniciar</button>
    </div>

    <script>
    (() => {
        'use strict';

        const TOTAL_ANDARES = 8;
        const TOPO = TOTAL_ANDARES - 1;
        const ALTURA_PULO = 1.1; // fração da altura do bloco no arco do passo (0 = subida reta)
        // Quanto o animal fica para fora, em blocos: 0 = encostado no andar de cima, 0.25 = meio do degrau, 0.5 = beirada.
        const AVANCO_BORDA = 0.25;

        const jogadores = [
            // side: face visível ('esquerda' = borda +Y, 'direita' = borda +X)
            // lane: posição ao longo da borda (0 = fundo, 1 = quina da frente)
            { emoji: '🐼', nome: 'Rodrigo',   velocidade: 1.06, side: 'esquerda', lane: 0.18 },
            { emoji: '🦊', nome: 'Vitória',   velocidade: 1.13, side: 'esquerda', lane: 0.40 },
            { emoji: '🐸', nome: 'Cecília',   velocidade: 1.02, side: 'esquerda', lane: 0.62 },
            { emoji: '🦁', nome: 'Adamor',    velocidade: 1.16, side: 'esquerda', lane: 0.83 },
            { emoji: '🦄', nome: 'Catarina',  velocidade: 1.15, side: 'direita',  lane: 0.18 },
            { emoji: '🐧', nome: 'Guilherme', velocidade: 0.98, side: 'direita',  lane: 0.40 },
            { emoji: '🐙', nome: 'Mônica',    velocidade: 1.08, side: 'direita',  lane: 0.62 },
            { emoji: '🐯', nome: 'Luciana',   velocidade: 1.20, side: 'direita',  lane: 0.83 }
        ];

        const stage = document.getElementById('pyramid-stage');
        const anchorsLayer = document.getElementById('anchors-layer');
        const overlay = document.getElementById('players-overlay');
        const statusText = document.getElementById('status-text');

        let blocoSize = 50;
        let alturaBloco = 20;
        let raceToken = 0;

        // Mede o valor real das variáveis CSS (clamp/min não são lidos com parseFloat).
        function medirVariavel(nome, padrao) {
            const sonda = document.createElement('div');
            sonda.style.cssText = `position:absolute;visibility:hidden;width:var(${nome});height:0`;
            document.body.appendChild(sonda);
            const valor = sonda.getBoundingClientRect().width;
            sonda.remove();
            return valor || padrao;
        }

        function lerMedidas() {
            blocoSize = medirVariavel('--block-size', 60);
            alturaBloco = medirVariavel('--block-z', 24);
            stage.style.width = `${blocoSize}px`;
            stage.style.height = `${blocoSize}px`;
        }

        function criarPiramide() {
            stage.querySelectorAll('.pyramid-block').forEach(el => el.remove());

            for (let andar = TOTAL_ANDARES; andar >= 1; andar--) {
                for (let x = 0; x < andar; x++) {
                    for (let y = 0; y < andar; y++) {
                        const block = document.createElement('div');
                        block.className = 'pyramid-block';
                        if (andar === 1) block.classList.add('winner');
                        block.style.left = `${(x - (andar - 1) / 2) * blocoSize}px`;
                        block.style.top = `${(y - (andar - 1) / 2) * blocoSize}px`;
                        block.style.transform = `translateZ(${(TOTAL_ANDARES - andar) * alturaBloco}px)`;
                        stage.insertBefore(block, anchorsLayer);
                    }
                }
            }
        }

        // Posição na borda frontal (visível) do nível informado (0 = base, 7 = quadrado dourado do topo).
        function posicaoNoNivel(jogador, nivel) {
            const metade = (TOTAL_ANDARES - 1 - nivel) / 2;
            const aoLongo = (jogador.lane * 2 - 1) * metade;
            // Empurra para fora, até o meio da parte visível do degrau (no topo fica centralizado).
            const borda = nivel < TOPO ? metade + AVANCO_BORDA : 0;
            const naBorda = jogador.side === 'direita'
                ? { x: borda, y: aoLongo }
                : { x: aoLongo, y: borda };
            return {
                x: naBorda.x * blocoSize,
                y: naBorda.y * blocoSize,
                // Face de cima do bloco desse andar (antes somava +1 andar e o animal flutuava).
                z: nivel * alturaBloco + 2
            };
        }

        // Move as âncoras 3D (animal e chão) e projeta os elementos 2D na tela.
        // chao = ponto na superfície embaixo do animal; altura = quanto ele está acima dela (no salto).
        function aplicarPosicao(jogador, pos, chao = pos, altura = 0) {
            jogador.ancora.style.transform = `translate3d(${pos.x}px, ${pos.y}px, ${pos.z}px)`;
            jogador.ancoraSombra.style.transform = `translate3d(${chao.x}px, ${chao.y}px, ${chao.z}px)`;

            // No ar a sombra encolhe e clareia.
            const fator = Math.min(1, altura / (alturaBloco * 2));
            jogador.sombra.style.setProperty('--s', (1 - fator * 0.45).toFixed(3));
            jogador.sombra.style.setProperty('--o', (1 - fator * 0.5).toFixed(3));

            sincronizar(jogador);
        }

        function centroNaTela(el) {
            const r = el.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }

        function sincronizar(jogador) {
            const p = centroNaTela(jogador.ancora);
            const s = centroNaTela(jogador.ancoraSombra);
            jogador.elemento.style.transform = `translate(${p.x}px, ${p.y}px)`;
            jogador.sombra.style.transform = `translate(${s.x}px, ${s.y}px)`;
            // Quem está mais embaixo na tela fica na frente; a sombra fica logo atrás do próprio animal.
            const z = Math.round(Math.max(p.y, s.y)) * 2;
            jogador.elemento.style.zIndex = z + 1;
            jogador.sombra.style.zIndex = z;
        }

        function criarJogadores() {
            anchorsLayer.replaceChildren();
            overlay.replaceChildren();

            for (const jogador of jogadores) {
                const ancora = document.createElement('div');
                ancora.className = 'anchor';
                anchorsLayer.appendChild(ancora);

                const ancoraSombra = document.createElement('div');
                ancoraSombra.className = 'anchor';
                anchorsLayer.appendChild(ancoraSombra);

                const sombra = document.createElement('div');
                sombra.className = 'player-shadow';
                sombra.appendChild(document.createElement('span'));
                overlay.appendChild(sombra);

                jogador.ancoraSombra = ancoraSombra;
                jogador.sombra = sombra;

                const el = document.createElement('div');
                el.className = 'player';

                const icone = document.createElement('div');
                icone.className = 'player-icon';
                icone.textContent = jogador.emoji;

                const trofeu = document.createElement('div');
                trofeu.className = 'trophy-icon';
                trofeu.textContent = '🏆';

                icone.appendChild(trofeu);
                el.appendChild(icone);
                overlay.appendChild(el);

                jogador.ancora = ancora;
                jogador.elemento = el;
                jogador.nivel = 0;
                aplicarPosicao(jogador, posicaoNoNivel(jogador, 0));
            }
        }

        function setStatus(msg) { statusText.textContent = msg; }

        function esperar(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        // Efeito de subida: ease-in-out cúbico + pequeno arco no eixo Z.
        function animarSubida(jogador, destinoNivel, duracao, token) {
            const inicio = posicaoNoNivel(jogador, jogador.nivel);
            const fim = posicaoNoNivel(jogador, destinoNivel);
            const t0 = performance.now();

            return new Promise(resolve => {
                function frame(agora) {
                    if (token !== raceToken) { resolve(false); return; }
                    const t = Math.min(1, (agora - t0) / duracao);
                    const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                    const arco = Math.sin(Math.PI * t) * alturaBloco * ALTURA_PULO;

                    const x = inicio.x + (fim.x - inicio.x) * e;
                    const y = inicio.y + (fim.y - inicio.y) * e;
                    const z = inicio.z + (fim.z - inicio.z) * e + arco;

                    // A sombra fica no degrau de baixo até a metade do salto, depois no de cima.
                    const chaoZ = e < 0.5 ? inicio.z : fim.z;

                    aplicarPosicao(jogador, { x, y, z }, { x, y, z: chaoZ }, z - chaoZ);

                    if (t < 1) requestAnimationFrame(frame);
                    else resolve(true);
                }
                requestAnimationFrame(frame);
            });
        }

        // Sorteio ponderado pela velocidade, evitando repetir o último.
        function escolherProximo(anterior) {
            let disponiveis = jogadores.filter(j => j.nivel < TOPO);
            if (disponiveis.length > 1 && anterior) {
                const outros = disponiveis.filter(j => j !== anterior);
                if (outros.length) disponiveis = outros;
            }
            const total = disponiveis.reduce((s, j) => s + j.velocidade ** 2, 0);
            let roll = Math.random() * total;
            for (const j of disponiveis) {
                roll -= j.velocidade ** 2;
                if (roll <= 0) return j;
            }
            return disponiveis[disponiveis.length - 1];
        }

        async function iniciarCorrida() {
            const token = ++raceToken;
            lerMedidas();
            criarPiramide();
            criarJogadores();

            setStatus('Preparando a corrida…');
            await esperar(650);
            if (token !== raceToken) return;
            setStatus('🏁 Valendo! Os animais estão subindo…');

            let anterior = null;
            while (token === raceToken) {
                const jogador = escolherProximo(anterior);
                if (!jogador) break;

                const proximo = jogador.nivel + 1;
                setStatus(`${jogador.emoji} ${jogador.nome} subindo para o nível ${proximo + 1}…`);
                jogador.elemento.classList.add('active');

                const ok = await animarSubida(jogador, proximo, Math.round(300 / jogador.velocidade), token);
                jogador.elemento.classList.remove('active');
                if (!ok || token !== raceToken) return;

                jogador.nivel = proximo;
                anterior = jogador;

                await esperar(75);
                if (token !== raceToken) return;

                if (jogador.nivel === TOPO) {
                    jogador.elemento.classList.add('reached');
                    setStatus(`🏆 ${jogador.emoji} ${jogador.nome} chegou ao topo!`);
                    return;
                }
            }
        }

        // No resize, reconstrói a pirâmide e reprojeta os animais; a corrida continua.
        window.addEventListener('resize', () => {
            lerMedidas();
            criarPiramide();
            jogadores.forEach(j => {
                if (j.ancora) aplicarPosicao(j, posicaoNoNivel(j, j.nivel));
            });
        });

        // Reprojeta quando a fonte carregar (pode mudar o layout).
        if (document.fonts) document.fonts.ready.then(() => jogadores.forEach(j => j.ancora && sincronizar(j)));

        document.getElementById('restart-button').addEventListener('click', () => { void iniciarCorrida(); });
        void iniciarCorrida();
    })();
    </script>
</body>

</html>
