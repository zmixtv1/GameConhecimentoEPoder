<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Controle Mobile - Ligação (como está hoje)</title>

    <!--
      RETRATO DO QUE EXISTE HOJE, não uma proposta. Dá para jogar.

      As duas telas do celular no desafio de Ligação (no código, "linking"):

      1. Durante (`tela-linking`, 30 s): a lista da esquerda ocupa a tela
         (Brasil, França, Japão...). Tocar num item troca a lista pelas opções
         da direita (Brasília, Paris...), com um botão "← Voltar".
         - Par certo: volta para a lista, com o par inteiro em verde
           ("✓ Brasil → Brasília"), e a opção usada some das próximas escolhas.
         - Par errado: a opção pisca vermelho e dá para tentar outra. Errar não
           tira ponto, só custa tempo.
         - Ligou tudo: "Tudo ligado! 🎉" e espera os outros.
         A coluna da direita vem embaralhada de um jeito em cada celular.
      2. Resultado (`tela-resultado-linking`): "Você ligou 3 de 5", os pontos,
         o gabarito com os pares QUE VOCÊ LIGOU marcados em verde, e a SUA
         posição (o celular não mostra o placar inteiro: isso fica na TV).
         Botão "Continuar": a partida só segue quando todo mundo aperta.

      PONTOS: 40 por par certo, e até +100 para quem liga tudo (proporcional
      ao tempo que sobrou).

      O QUE O CELULAR RECEBE DO SERVIDOR:
        iniciarLinking        { tema, esquerda: [texto], direita: [texto já embaralhado], tempoLimiteMs }
        resultadoTentativaPar { esquerdaIndex, direitaIndex, correto, completou }
        resultadoLinking      { pontosGanhos, paresCorretos, corretos: [índices da esquerda que ele ligou],
                                totalPares, pares: [{ esquerda, direita }],
                                placar: [{ id, nome, pontos, avatar }] }
        progressoContinuar    { confirmados, total }
      E manda: tentarPar { esquerdaIndex, direitaIndex } e continuar.

      A marcação sai de public/controlador/index.html; o estilo é
      controlador.css + telas/desafios.css, copiados inteiros; o tratarMensagem()
      reproduz o trecho de public/controlador/controlador.js, e um "servidor de
      mentira" responde como o server/sala.js, com mais 5 jogadores.

      O controle é pensado para o celular DEITADO (~336px de altura sem rolar).
      Barra no rodapé: Jogar de novo · Resultado. ?limpo esconde.
    -->

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
/* ===================================================================
   cópia integral de public/controlador/controlador.css
   =================================================================== */
/* Controle do celular - mesmo visual do teste2.html (tema claro, vidro, Outfit),
   mas ocupando a tela inteira e pensado pro celular DEITADO: o layout é
   dimensionado em vh pra caber em ~336px de altura sem rolar. Em pé, o mesmo
   layout vira uma coluna (ver @media portrait no fim). */

:root {
  color-scheme: light;
  --text-main: #0f172a;
  --text-muted: #475569;
  --bg: #f8fafc;
  --surface: #ffffff;
  --verde: #2ed573;
  --vermelho: #ff4757;
  --violet: #9b59b6;
  --glass-bg: rgba(255, 255, 255, 0.65);
  --glass-border: rgba(255, 255, 255, 0.9);
  --glass-shadow: 0 6px 14px rgba(0, 0, 0, 0.07);

  /* cor do animal do jogador - o controlador.js troca o valor assim que o
     jogador escolhe o animal; azul é só o padrão antes disso */
  --cor-jogador: #1e90ff;
  --player-glass: color-mix(in srgb, var(--cor-jogador) 15%, transparent);
  --player-glow: color-mix(in srgb, var(--cor-jogador) 30%, transparent);

  /* respiro até a borda física da tela (soma a área segura de notch/cantos) */
  --pad-t: max(8px, env(safe-area-inset-top));
  --pad-r: max(12px, env(safe-area-inset-right));
  --pad-b: max(8px, env(safe-area-inset-bottom));
  --pad-l: max(12px, env(safe-area-inset-left));
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Outfit", system-ui, sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html { height: 100%; }

body {
  height: 100vh;
  height: 100dvh; /* acompanha a barra do navegador aparecendo/sumindo */
  display: flex;
  flex-direction: column;
  padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l);
  background-color: var(--bg);
  background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
  background-size: 40px 40px;
  background-position: center;
  color: var(--text-main);
  overflow: hidden;
  position: relative;
}

.oculto { display: none !important; }

/* ---------- Fundo e vidro ---------- */
.ambient-light {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  z-index: 0;
  pointer-events: none;
  animation: fluidMotion 20s infinite alternate ease-in-out;
}
.light-1 { top: -10%; left: -10%; width: 60vmax; height: 60vmax; background: rgba(226, 232, 240, 0.8); }
.light-2 { bottom: -20%; right: -10%; width: 50vmax; height: 50vmax; background: rgba(186, 230, 253, 0.5); animation-delay: -5s; }
.light-3 { top: 30%; left: 30%; width: 35vmax; height: 35vmax; background: rgba(255, 255, 255, 0.9); animation-delay: -10s; }
@keyframes fluidMotion {
  0% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(15px, 20px) scale(1.05); }
  66% { transform: translate(-15px, 10px) scale(0.95); }
  100% { transform: translate(25px, -15px) scale(1.02); }
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 2px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
}

/* ---------- Estrutura de cada tela: cabeçalho / corpo / rodapé ---------- */
.tela {
  position: relative;
  z-index: 1;
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: clamp(6px, 2vh, 12px);
}

.cabecalho {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 56px;
}
.cabecalho-texto {
  flex: 1;
  min-width: 0;
  text-align: center;
}
.cabecalho-vazio { flex: none; width: 56px; } /* equilibra o cabeçalho quando não há timer */

.corpo {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  overflow-x: hidden;
  /* folga pras sombras dos botões não serem cortadas pelo scroll; a margem
     negativa devolve o espaço, então o layout fica igual */
  padding: 2px 6px 8px;
  margin: -2px -6px -8px;
}
.corpo-centro { align-items: center; justify-content: center; text-align: center; }
.corpo-duas-colunas { display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px; align-content: start; }

.rodape {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
}
.rodape .ajuda { flex: none; max-width: 40%; text-align: left; }
.rodape-duplo > button { flex: 1; }

/* ---------- Texto ---------- */
h1 { font-size: clamp(26px, 9vh, 42px); font-weight: 900; color: var(--cor-jogador); line-height: 1.05; }
h2 { font-size: clamp(15px, 4.6vh, 22px); font-weight: 800; line-height: 1.2; }
h3 { font-size: clamp(12px, 3.4vh, 15px); font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.pergunta-texto { font-size: clamp(14px, 4.2vh, 20px); font-weight: 800; text-shadow: 0 4px 15px rgba(255, 255, 255, 0.8); }
.ajuda { color: var(--text-muted); font-size: clamp(11px, 3vh, 14px); }
.ajuda-mini { font-size: clamp(10px, 2.6vh, 12px); margin-bottom: 2px; }
.categoria { text-transform: uppercase; letter-spacing: 0.1em; color: var(--violet); font-weight: 800; }
.cabecalho .categoria { font-size: clamp(10px, 2.8vh, 13px); letter-spacing: 0.05em; }
.ajuda-mini .categoria { margin-left: 0.3em; }
.pontos { font-size: clamp(14px, 4vh, 20px); font-weight: 800; color: var(--cor-jogador); }
.erro { color: var(--vermelho); min-height: 1.2em; font-size: 14px; }

/* ---------- Botões e campos ---------- */
button { font: inherit; border: none; cursor: pointer; }
button:disabled { cursor: default; }

.btn-primario,
.btn-vidro {
  width: 100%;
  padding: clamp(10px, 3.4vh, 16px) 18px;
  border-radius: 18px;
  font-size: clamp(15px, 4vh, 20px);
  font-weight: 900;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
}
.btn-primario { background: var(--cor-jogador); color: #fff; box-shadow: 0 10px 25px var(--player-glow); }
.btn-vidro {
  background: var(--glass-bg);
  border: 2px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  color: var(--text-main);
}
.btn-primario:active:not(:disabled),
.btn-vidro:active:not(:disabled) { transform: scale(0.96); }
.btn-primario:disabled { opacity: 0.5; box-shadow: none; }

label { display: block; text-align: left; color: var(--text-muted); font-size: 13px; font-weight: 600; margin-bottom: 8px; }
input[type="text"] {
  display: block;
  width: 100%;
  margin-top: 4px;
  padding: 10px 14px;
  font-size: 18px;
  font-weight: 700;
  border-radius: 14px;
  border: 2px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.85);
  color: var(--text-main);
  text-transform: uppercase;
  user-select: text;
}
input#campo-nome { text-transform: none; }
input:focus { outline: 2px solid var(--cor-jogador); }

/* ---------- Identidade do jogador (animal + nome) ---------- */
.player-identity {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px 6px 10px;
  border-radius: 100px;
  max-width: 40%;
  transition: all 0.3s ease;
}
.player-identity:empty { visibility: hidden; }
.player-avatar { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.15)); }
.player-name {
  font-size: 15px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 110px;
}
/* a pílula acende quando o jogador trava a resposta */
.player-identity.voted {
  background: var(--player-glass);
  border-color: var(--cor-jogador);
  box-shadow: 0 10px 25px var(--player-glow);
}
.player-identity.voted .player-name { color: var(--cor-jogador); }

/* ---------- Timer circular (igual ao da TV, menor) ---------- */
.timer-redondo-mini {
  position: relative;
  flex: none;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s ease;
}
.timer-anel-mini {
  position: absolute;
  inset: -5px;
  width: calc(100% + 10px);
  height: calc(100% + 10px);
  transform: rotate(-90deg);
}
.anel-fundo-mini { fill: none; stroke: rgba(255, 255, 255, 0.8); stroke-width: 9; }
.anel-progresso-mini {
  fill: none;
  stroke: var(--text-main);
  stroke-width: 9;
  stroke-linecap: round;
  stroke-dasharray: 326.7;
  transition: stroke 0.3s ease;
}
.timer-numero-mini { font-size: 22px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.timer-redondo-mini.urgente { animation: pulsoUrgente 1s ease-in-out infinite; border-color: var(--vermelho); }
.timer-redondo-mini.urgente .anel-progresso-mini { stroke: var(--vermelho); }
.timer-redondo-mini.urgente .timer-numero-mini { color: var(--vermelho); }
@keyframes pulsoUrgente { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

/* ---------- Aviso pra girar o celular (só em pé) ---------- */
.aviso-girar {
  display: none;
  flex: none;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  padding: 6px 6px 6px 12px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid var(--glass-border);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
  position: relative;
  z-index: 2;
}
.aviso-girar button { width: 28px; height: 28px; border-radius: 50%; background: rgba(15, 23, 42, 0.08); color: var(--text-muted); font-size: 13px; }
@media (orientation: portrait) {
  .aviso-girar:not(.dispensado) { display: flex; }
}

/* ---------- Pop-up de reiniciar o jogo ---------- */
.modal-fundo {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l);
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.modal-card {
  width: 100%;
  max-width: 460px;
  padding: clamp(14px, 5vh, 24px) clamp(16px, 5vw, 28px);
  border-radius: 24px;
  background: var(--surface);
  border: 2px solid var(--glass-border);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  text-align: center;
  animation: popModal 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popModal {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}
.modal-card .ajuda { margin-top: 6px; }
.modal-botoes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: clamp(10px, 3vh, 18px);
}

/* ---------- Aviso de conexão perdida / reconectando ---------- */
.aviso-conexao {
  position: fixed;
  left: 50%;
  bottom: max(10px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 60;
  max-width: 92vw;
  padding: 8px 18px;
  border-radius: 100px;
  background: rgba(15, 23, 42, 0.92);
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  animation: pulsoConexao 1.4s ease-in-out infinite;
}
@keyframes pulsoConexao { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }

/* ---------- Entrada ---------- */
.tela-entrada {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  align-content: center;
  gap: 8px 28px;
  overflow-y: auto;
  padding: 2px 6px 8px;
  margin: -2px -6px -8px;
}
.entrada-titulo { text-align: left; }
.entrada-titulo .ajuda { margin-top: 8px; }
.entrada-form .btn-primario { margin-top: 4px; }

/* ---------- Escolha de animal ---------- */
.animais-grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 1fr;
  gap: 10px;
}
.animal-btn {
  --cor-animal: var(--cor-jogador);
  min-height: 0;
  padding: 4px;
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: var(--glass-bg);
  border: 2px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  color: var(--text-main);
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.animal-btn:active:not(:disabled) { transform: scale(0.95); }
.animal-emoji { font-size: clamp(28px, 11vh, 54px); line-height: 1; filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.15)); }
.animal-nome { font-size: clamp(11px, 3.4vh, 15px); font-weight: 800; }
.animal-dono { font-size: clamp(9px, 2.6vh, 12px); font-weight: 600; color: var(--text-muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.animal-btn.meu {
  background: color-mix(in srgb, var(--cor-animal) 15%, transparent);
  border: 3px solid var(--cor-animal);
  box-shadow: 0 15px 35px color-mix(in srgb, var(--cor-animal) 30%, transparent);
}
.animal-btn:disabled:not(.meu) { opacity: 0.45; filter: grayscale(80%); }

/* ---------- Espera no lobby ---------- */
.lista-jogadores {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}
.lista-jogadores li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 8px;
  border-radius: 100px;
  background: var(--glass-bg);
  border: 2px solid var(--glass-border);
  font-weight: 800;
  font-size: 15px;
  min-width: 0;
}
.lista-jogadores li .nome { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lista-jogadores li.sem-animal { opacity: 0.55; }

/* ---------- Portas, poderes e respostas: grade 2x2 de botões de vidro ---------- */
.alternativas {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: 1fr;
  gap: clamp(8px, 2.6vh, 16px);
}
.alternativa {
  min-height: 0;
  padding: 8px 14px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow-wrap: anywhere;
  font-size: clamp(15px, 4.8vh, 24px);
  font-weight: 900;
  color: var(--text-main);
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 2px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.alternativa:active:not(:disabled) {
  transform: scale(0.96);
  background: rgba(255, 255, 255, 0.8);
  box-shadow: inset 2px 2px 8px rgba(0, 0, 0, 0.05);
}
/* a escolhida vira vidro neon na cor do animal do jogador */
.alternativa.selecionada {
  background: var(--player-glass);
  border: 3px solid var(--cor-jogador);
  box-shadow: 0 15px 35px var(--player-glow);
  color: var(--cor-jogador);
}
/* as outras apagam */
.alternativa:disabled:not(.selecionada):not(.correta-revelada):not(.errada-piramide) {
  opacity: 0.5;
  filter: grayscale(80%);
}

/* respostas da pergunta entram girando */
#alternativas .alternativa {
  opacity: 0;
  animation: flipIn 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
#alternativas .alternativa:nth-child(1) { animation-delay: 0s; }
#alternativas .alternativa:nth-child(2) { animation-delay: 0.08s; }
#alternativas .alternativa:nth-child(3) { animation-delay: 0.16s; }
#alternativas .alternativa:nth-child(4) { animation-delay: 0.24s; }
@keyframes flipIn {
  from { opacity: 0; transform: perspective(800px) rotateY(-90deg); }
  to { opacity: 1; transform: perspective(800px) rotateY(0deg); }
}
/* quando a TV revela a resposta certa, pisca em verde por cima de tudo */
#alternativas .alternativa.correta-revelada {
  opacity: 1;
  border-color: var(--verde);
  background: color-mix(in srgb, var(--verde) 15%, var(--glass-bg));
  color: #0a7a3c;
  animation: piscaVerde 0.5s ease-in-out 3;
}
@keyframes piscaVerde {
  0%, 100% { box-shadow: 0 0 0 1px var(--verde); }
  50% { box-shadow: 0 0 14px 3px rgba(46, 213, 115, 0.4); }
}

.opcao-garantir-porta {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  padding: 6px 12px;
  border-radius: 14px;
  background: var(--glass-bg);
  border: 2px solid var(--glass-border);
  font-size: clamp(11px, 3vh, 14px);
  text-align: left;
}
.opcao-garantir-porta input { flex: none; width: 20px; height: 20px; accent-color: var(--cor-jogador); }

/* ---------- Pergunta ---------- */
.fase-leitura {
  margin: auto;
  text-align: center;
  font-size: clamp(16px, 5vh, 24px);
  font-weight: 800;
  color: var(--cor-jogador);
}
.fase-leitura #contagem-leitura { display: block; font-size: clamp(40px, 22vh, 80px); line-height: 1; }
.area-alternativas { position: relative; flex: 1; min-height: 0; display: flex; }

/* ---------- Linking ---------- */
.linking-lista {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: minmax(48px, 1fr);
  gap: 8px;
}
.linking-item-full {
  min-height: 0;
  padding: 6px 12px;
  border-radius: 18px;
  background: var(--glass-bg);
  border: 2px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  color: var(--text-main);
  font-size: clamp(13px, 4vh, 18px);
  font-weight: 800;
  overflow-wrap: anywhere;
}
.linking-item-full:active:not(:disabled) { transform: scale(0.97); }
.linking-item-full.correto { background: color-mix(in srgb, var(--verde) 18%, transparent); border-color: var(--verde); color: #0a7a3c; }
.linking-item-full.incorreto { background: color-mix(in srgb, var(--vermelho) 22%, transparent); border-color: var(--vermelho); }
.linking-item-full.usado { opacity: 0.35; }
.linking-item-full:disabled:not(.correto):not(.usado) { opacity: 0.6; }
.linking-voltar {
  grid-column: 1 / -1;
  grid-row: auto;
  align-self: center;
  height: 78%;
  min-height: 0;
  padding: 6px;
  border-radius: 14px;
  background: transparent;
  border: 2px solid var(--text-muted);
  color: var(--text-muted);
  font-weight: 800;
}

/* ---------- Sorting: 3 itens por vez, cada um numa linha (nome | A | B) ---------- */
.sorting-itens { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.sorting-item {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  border-radius: 20px;
  background: var(--glass-bg);
  border: 2px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
}
.sorting-item-nome { text-align: left; font-size: clamp(14px, 4.2vh, 20px); font-weight: 900; overflow-wrap: anywhere; }
.sorting-item-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 100%; padding: 2px 0; }
.sorting-botao-categoria {
  min-height: 0;
  padding: 4px 6px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.85);
  border: 2px solid var(--glass-border);
  color: var(--text-main);
  font-size: clamp(11px, 3.4vh, 16px);
  font-weight: 800;
  overflow-wrap: anywhere;
}
.sorting-botao-categoria:active:not(:disabled) { transform: scale(0.95); }
.sorting-botao-categoria:disabled:not(.escolhida) { opacity: 0.4; }
.sorting-botao-categoria.escolhida { background: var(--player-glass); border-color: var(--cor-jogador); color: var(--cor-jogador); }
.sorting-item.correto .sorting-botao-categoria.escolhida { background: color-mix(in srgb, var(--verde) 20%, transparent); border-color: var(--verde); color: #0a7a3c; }
.sorting-item.incorreto .sorting-botao-categoria.escolhida { background: color-mix(in srgb, var(--vermelho) 20%, transparent); border-color: var(--vermelho); color: #b3202f; }

/* ---------- Pirâmide ---------- */
.alternativa.errada-piramide {
  background: color-mix(in srgb, var(--vermelho) 20%, transparent);
  border-color: var(--vermelho);
  color: #b3202f;
  opacity: 0.6;
}

/* tema da rodada, depois que a porta é decidida */
.tema-escolhido {
  font-size: clamp(22px, 8vh, 44px);
  font-weight: 900;
  line-height: 1.1;
  color: var(--cor-jogador);
  text-shadow: 0 6px 20px var(--player-glow);
}

/* ---------- "Sua posição" (no lugar do placar, no celular) ---------- */
.minha-posicao {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  text-align: center;
  margin: auto;
}
.coluna-posicao { display: flex; align-items: center; justify-content: center; }
.posicao-rotulo {
  font-size: clamp(10px, 2.8vh, 13px);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
}
.posicao-numero {
  font-size: clamp(42px, 17vh, 86px);
  font-weight: 900;
  line-height: 1;
  color: var(--cor-jogador);
  text-shadow: 0 6px 20px var(--player-glow);
}
.posicao-pontos {
  font-size: clamp(16px, 5vh, 26px);
  font-weight: 800;
  color: var(--text-main);
}
.posicao-diferenca {
  margin-top: 4px;
  font-size: clamp(11px, 3.2vh, 15px);
  font-weight: 700;
  color: var(--text-muted);
  max-width: 90%;
}

/* ---------- Festa, Aposta e Escudo no resultado da pergunta ---------- */
.resultado-extras { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.resultado-extras:empty { display: none; }
.resultado-extra {
  padding: 3px 12px;
  border-radius: 100px;
  font-size: clamp(11px, 3.2vh, 15px);
  font-weight: 800;
  background: rgba(15, 23, 42, 0.06);
  border: 1px solid rgba(15, 23, 42, 0.08);
  color: var(--text-muted);
}
.resultado-extra.festa { background: #fff1e6; border-color: #ffb37a; color: #b45309; }
.resultado-extra.aposta.ganhou { background: #e8f9ef; border-color: var(--verde); color: #0a7a3c; }
.resultado-extra.escudo { background: #eef0ff; border-color: #a5b4fc; color: #4338ca; }

/* ---------- Listas: placar, gabarito, posições ---------- */
.lista-cartoes {
  list-style: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 8px;
}
.lista-cartoes.lista-1col { grid-template-columns: 1fr; }
.lista-cartoes li {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 12px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  font-size: clamp(12px, 3.4vh, 16px);
  font-weight: 700;
  text-align: left;
}
.lista-cartoes li span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }

/* ---------- Em pé: o mesmo layout, em uma coluna ---------- */
@media (orientation: portrait) {
  .cabecalho { flex-wrap: wrap; }
  .cabecalho-texto { order: 3; flex-basis: 100%; }
  .player-identity { max-width: 70%; }
  .cabecalho > .timer-redondo-mini, .cabecalho > .cabecalho-vazio { margin-left: auto; }

  .tela-entrada { grid-template-columns: 1fr; }
  .entrada-titulo { text-align: center; margin-bottom: 8px; }

  .animais-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: minmax(84px, 1fr); }
  .alternativas { grid-template-columns: 1fr; grid-auto-rows: minmax(60px, 1fr); }
  .linking-lista { grid-template-columns: 1fr; }
  .sorting-item { grid-template-columns: 1fr; }
  .corpo-duas-colunas { grid-template-columns: 1fr; }
  .lista-cartoes { grid-template-columns: 1fr; }
  .corpo-duas-colunas { grid-template-columns: 1fr; }

  h2 { font-size: 20px; }
  .pergunta-texto { font-size: 18px; }
  .ajuda { font-size: 14px; }
}

/* ===================================================================
   cópia integral de public/controlador/telas/desafios.css
   =================================================================== */
/* Desafios do tema no celular: Ligação e Classificação.
   Durante, as telas usam os botões de vidro do resto do controle. No
   resultado, o gabarito mostra o que ESTE jogador fez: o par que ele ligou,
   o lado em que ele pôs cada item. */

/* ---------- Ligação: gabarito com os pares do jogador ---------- */
.gabarito-pares {
  list-style: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 8px;
}
.gabarito-pares li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 14px;
  background: var(--glass-bg);
  border: 2px solid var(--glass-border);
  font-size: clamp(12px, 3.4vh, 16px);
  font-weight: 700;
  color: var(--text-muted);
  opacity: 0;
  animation: gabaritoEntrar 0.35s ease forwards;
}
.gabarito-pares .esquerda { color: var(--text-main); font-weight: 800; }
.gabarito-pares .direita { font-weight: 900; }
.gabarito-pares li.acertou {
  border-color: var(--verde);
  background: color-mix(in srgb, var(--verde) 14%, var(--glass-bg));
  color: #0a7a3c;
}
.gabarito-pares li.acertou .direita { color: #0a7a3c; }

/* o selinho da frente: ✓ ligou, – não ligou */
.selo-gabarito {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 900;
  color: #fff;
  background: rgba(15, 23, 42, 0.18);
}
.acertou > .selo-gabarito { background: var(--verde); }
.errou > .selo-gabarito { background: var(--vermelho); }

/* ---------- Classificação: os dois lados, com onde o jogador pôs cada item ---------- */
.gabarito-grupos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.gabarito-grupo {
  min-width: 0;
  padding: 6px 8px 8px;
  border-radius: 16px;
  border: 2px solid var(--glass-border);
  opacity: 0;
  animation: gabaritoEntrar 0.35s ease forwards;
}
.gabarito-grupo.a { background: linear-gradient(180deg, rgba(30, 144, 255, 0.14), var(--glass-bg)); border-color: rgba(30, 144, 255, 0.45); }
.gabarito-grupo.b { background: linear-gradient(180deg, rgba(255, 71, 87, 0.12), var(--glass-bg)); border-color: rgba(255, 71, 87, 0.4); animation-delay: 0.08s; }
.gabarito-grupo h4 {
  margin-bottom: 4px;
  font-size: clamp(11px, 3vh, 14px);
  font-weight: 900;
  text-align: center;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.gabarito-grupo ul { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.gabarito-grupo li {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.85);
  font-size: clamp(11px, 3.1vh, 15px);
  font-weight: 800;
  color: var(--text-main);
  overflow-wrap: anywhere;
}
.gabarito-grupo li.acertou { box-shadow: inset 0 0 0 2px var(--verde); color: #0a7a3c; }
.gabarito-grupo li.errou { box-shadow: inset 0 0 0 2px var(--vermelho); color: #b3202f; }
.gabarito-grupo li.pulou { color: var(--text-muted); }
.gabarito-grupo .selo-gabarito { width: 18px; height: 18px; font-size: 11px; }

@keyframes gabaritoEntrar {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

@media (orientation: portrait) {
  .gabarito-pares { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .gabarito-pares li, .gabarito-grupo { animation-duration: 0.01ms !important; }
}

    /* ===== só deste arquivo, não existe no jogo ===== */
    .barra-prototipo {
      position: fixed; bottom: 6px; right: 6px;
      z-index: 500; display: flex; align-items: center; gap: 6px;
      padding: 4px 6px; border-radius: 8px;
      background: rgba(15, 23, 42, 0.88); color: #fff;
      font-size: 10px; font-weight: 700;
      font-family: "Outfit", system-ui, sans-serif;
    }
    .barra-prototipo button {
      padding: 2px 6px; border: 0; border-radius: 5px;
      background: #fff; color: #0f172a; font-size: 10px; font-weight: 800;
      font-family: inherit; cursor: pointer;
    }
    </style>

<body>
  <div class="ambient-light light-1"></div>
  <div class="ambient-light light-2"></div>
  <div class="ambient-light light-3"></div>

  <section id="tela-linking" class="tela oculto">
    <header class="cabecalho">
      <div class="player-identity glass-panel" data-identidade></div>
      <div class="cabecalho-texto">
        <p class="categoria" id="linking-tema"></p>
        <h2 id="linking-titulo">Ligue os pares!</h2>
        <p class="ajuda ajuda-mini" id="linking-progresso"></p>
      </div>
      <div class="timer-redondo-mini glass-panel">
        <svg class="timer-anel-mini" viewBox="0 0 120 120">
          <circle class="anel-fundo-mini" cx="60" cy="60" r="52"></circle>
          <circle class="anel-progresso-mini" id="anel-linking" cx="60" cy="60" r="52"></circle>
        </svg>
        <span class="timer-numero-mini" id="numero-linking"></span>
      </div>
    </header>
    <div class="corpo">
      <div class="linking-lista" id="linking-lista"></div>
    </div>
  </section>

  <section id="tela-resultado-linking" class="tela oculto">
    <header class="cabecalho">
      <div class="player-identity glass-panel" data-identidade></div>
      <div class="cabecalho-texto">
        <h2 id="linking-resultado-titulo"></h2>
        <p id="linking-pontos" class="pontos"></p>
      </div>
      <div class="cabecalho-vazio"></div>
    </header>
    <div class="corpo corpo-duas-colunas">
      <div>
        <h3>Gabarito</h3>
        <ol id="linking-gabarito" class="gabarito-pares"></ol>
      </div>
      <div class="coluna-posicao">
        <div class="minha-posicao" id="minha-posicao-linking">
        <p class="posicao-rotulo">Sua posição</p>
        <p class="posicao-numero" id="posicao-numero-linking"></p>
        <p class="posicao-pontos" id="posicao-pontos-linking"></p>
        <p class="posicao-diferenca oculto" id="posicao-diferenca-linking"></p>
      </div>
      </div>
    </div>
    <footer class="rodape">
      <button id="botao-continuar-linking" class="btn-primario">Continuar</button>
      <p class="ajuda oculto" id="status-continuar-linking"></p>
    </footer>
  </section>

  <div class="barra-prototipo" id="barra-prototipo">
    <button id="botao-repetir" type="button">Jogar de novo</button>
    <button id="botao-resultado" type="button">Resultado</button>
  </div>

  <script>
  (() => {
    'use strict';

    // ======== igual ao public/controlador/controlador.js ========
    function elementosDePosicao(sufixo) {
      return {
        numero: document.getElementById(`posicao-numero${sufixo}`),
        pontos: document.getElementById(`posicao-pontos${sufixo}`),
        diferenca: document.getElementById(`posicao-diferenca${sufixo}`),
      };
    }

    const telaLinking = document.getElementById("tela-linking");
    const telaResultadoLinking = document.getElementById("tela-resultado-linking");
    const TODAS_AS_TELAS = [telaLinking, telaResultadoLinking];

    const linkingTemaEl = document.getElementById("linking-tema");
    const linkingTituloEl = document.getElementById("linking-titulo");
    const anelLinkingEl = document.getElementById("anel-linking");
    const numeroLinkingEl = document.getElementById("numero-linking");
    const linkingListaEl = document.getElementById("linking-lista");
    const linkingProgressoEl = document.getElementById("linking-progresso");
    const linkingResultadoTituloEl = document.getElementById("linking-resultado-titulo");
    const linkingPontosEl = document.getElementById("linking-pontos");
    const linkingGabaritoEl = document.getElementById("linking-gabarito");
    const posicaoLinkingEls = elementosDePosicao("-linking");
    const botaoContinuarLinking = document.getElementById("botao-continuar-linking");
    const statusContinuarLinkingEl = document.getElementById("status-continuar-linking");

    let meuJogadorId = null;
    let jaConfirmouContinuar = false;
    let statusContinuarAtivoEl = null;

    let linkingEsquerdaTextos = [];
    let linkingDireitaTextos = [];
    let linkingCorretosSet = new Set();
    let linkingDireitaUsada = new Set();
    let linkingParesFeitos = new Map(); // esquerdaIndex -> texto da direita que ele ligou
    let linkingTotalPares = 0;
    let intervaloLinking = null;

    function mostrarTela(tela) {
      for (const t of TODAS_AS_TELAS) t.classList.toggle("oculto", t !== tela);
    }

    function criarEl(tag, classe, texto) {
      const el = document.createElement(tag);
      if (classe) el.className = classe;
      if (texto !== undefined) el.textContent = texto;
      return el;
    }

    // Em vez da lista inteira, o celular mostra só a posição do próprio jogador,
    // a pontuação dele e quanto falta pra passar quem está logo acima.
    function renderizarMinhaPosicao(placar, els) {
      const eu = placar.find((j) => j.id === meuJogadorId);
      if (!eu) return;
      const posicao = placar.filter((j) => j.pontos > eu.pontos).length + 1;
      els.numero.textContent = `${posicao}º`;
      els.pontos.textContent = `${eu.pontos} pts`;
      const acima = [...placar].reverse().find((j) => j.pontos > eu.pontos);
      if (acima) {
        const faltam = acima.pontos - eu.pontos + 1;
        els.diferenca.textContent = `Faltam ${faltam} ${faltam === 1 ? "ponto" : "pontos"} para passar ${acima.nome}`;
        els.diferenca.classList.remove("oculto");
      } else {
        els.diferenca.classList.add("oculto");
      }
    }

    function prepararTelaResultado(botao, statusEl, jaConfirmou = false) {
      jaConfirmouContinuar = !!jaConfirmou;
      botao.disabled = !!jaConfirmou;
      statusEl.classList.toggle("oculto", !jaConfirmou);
      statusEl.textContent = jaConfirmou ? "Aguardando os outros jogadores..." : "";
      statusContinuarAtivoEl = statusEl;
    }

    function confirmarContinuar(botao) {
      if (jaConfirmouContinuar) return;
      jaConfirmouContinuar = true;
      botao.disabled = true;
      statusContinuarAtivoEl.classList.remove("oculto");
      statusContinuarAtivoEl.textContent = "Aguardando os outros jogadores...";
      enviarAoServidor({ type: "continuar" });
    }

    const CIRCUNFERENCIA_TIMER_MINI = 326.7;

    function iniciarContadorRedondo(intervaloAntigo, anelEl, numeroEl, tempoLimiteMs, guardarIntervalo, aoAcabar) {
      clearInterval(intervaloAntigo);
      const inicio = Date.now();
      let novoIntervalo = null;
      const atualizar = () => {
        const decorrido = Date.now() - inicio;
        const restanteMs = Math.max(0, tempoLimiteMs - decorrido);
        anelEl.style.strokeDashoffset = String(CIRCUNFERENCIA_TIMER_MINI * Math.min(1, decorrido / tempoLimiteMs));
        const restanteS = Math.ceil(restanteMs / 1000);
        numeroEl.textContent = String(restanteS);
        const modulo = anelEl.closest(".timer-redondo-mini");
        if (modulo) modulo.classList.toggle("urgente", restanteS <= 3 && restanteS > 0);
        if (restanteMs <= 0) {
          clearInterval(novoIntervalo);
          if (aoAcabar) aoAcabar();
        }
      };
      atualizar();
      novoIntervalo = setInterval(atualizar, 100);
      guardarIntervalo(novoIntervalo);
    }

    // Mostra a lista de itens da esquerda, um por linha, em tela cheia. Tocar
    // num item ainda não ligado leva pra lista de opções da direita.
    function renderizarListaEsquerda() {
      linkingTituloEl.textContent = "Toque em um item pra ligar";
      linkingListaEl.innerHTML = "";
      linkingEsquerdaTextos.forEach((texto, i) => {
        const btn = document.createElement("button");
        btn.className = "linking-item-full";
        if (linkingCorretosSet.has(i)) {
          // o par inteiro, pra ele ver o que já ligou (ao reconectar, só o item)
          const direita = linkingParesFeitos.get(i);
          btn.textContent = direita ? `✓ ${texto} → ${direita}` : `✓ ${texto}`;
          btn.classList.add("correto");
          btn.disabled = true;
        } else {
          btn.textContent = texto;
          btn.addEventListener("click", () => mostrarOpcoesDireita(i));
        }
        linkingListaEl.appendChild(btn);
      });
    }

    // Mostra as opções da direita em tela cheia, pra ligar com o item da
    // esquerda escolhido. Um botão "Voltar" permite desistir e trocar de item.
    function mostrarOpcoesDireita(esquerdaIndex) {
      linkingTituloEl.textContent = `Ligue "${linkingEsquerdaTextos[esquerdaIndex]}" com:`;
      linkingListaEl.innerHTML = "";
      linkingDireitaTextos.forEach((texto, k) => {
        const btn = document.createElement("button");
        btn.className = "linking-item-full";
        btn.textContent = texto;
        btn.dataset.indice = k;
        if (linkingDireitaUsada.has(k)) {
          btn.disabled = true;
          btn.classList.add("usado");
        } else {
          btn.addEventListener("click", () => tentarPar(esquerdaIndex, k, btn));
        }
        linkingListaEl.appendChild(btn);
      });

      const botaoVoltar = document.createElement("button");
      botaoVoltar.className = "linking-voltar";
      botaoVoltar.textContent = "← Voltar";
      botaoVoltar.addEventListener("click", renderizarListaEsquerda);
      linkingListaEl.appendChild(botaoVoltar);
    }

    function tentarPar(esquerdaIndex, direitaIndex, botaoClicado) {
      botaoClicado.disabled = true; // trava até a resposta do servidor chegar, evita clique duplo
      enviarAoServidor({ type: "tentarPar", esquerdaIndex, direitaIndex });
    }

    function tratarMensagem(msg) {
      switch (msg.type) {
        case "iniciarLinking": {
          linkingTemaEl.textContent = msg.tema;
          linkingEsquerdaTextos = msg.esquerda;
          linkingDireitaTextos = msg.direita;
          linkingCorretosSet = new Set(msg.corretos || []);
          linkingDireitaUsada = new Set(msg.direitaUsada || []);
          linkingParesFeitos = new Map();
          linkingTotalPares = msg.esquerda.length;
          linkingProgressoEl.textContent = `${linkingCorretosSet.size} de ${linkingTotalPares} pares`;
          renderizarListaEsquerda();
          if (msg.completou) {
            linkingListaEl.innerHTML = "";
            linkingTituloEl.textContent = "Tudo ligado! 🎉";
            linkingProgressoEl.textContent = `${linkingCorretosSet.size} de ${linkingTotalPares} pares — você terminou! Aguardando os outros...`;
          }
          iniciarContadorRedondo(intervaloLinking, anelLinkingEl, numeroLinkingEl, msg.tempoLimiteMs, (i) => (intervaloLinking = i));
          mostrarTela(telaLinking);
          break;
        }
        case "resultadoTentativaPar": {
          if (msg.correto) {
            linkingCorretosSet.add(msg.esquerdaIndex);
            linkingDireitaUsada.add(msg.direitaIndex);
            linkingParesFeitos.set(msg.esquerdaIndex, linkingDireitaTextos[msg.direitaIndex]);
            linkingProgressoEl.textContent = msg.completou
              ? `${linkingCorretosSet.size} de ${linkingTotalPares} pares — você terminou! Aguardando os outros...`
              : `${linkingCorretosSet.size} de ${linkingTotalPares} pares`;
            if (msg.completou) {
              linkingListaEl.innerHTML = "";
              linkingTituloEl.textContent = "Tudo ligado! 🎉";
            } else {
              renderizarListaEsquerda();
            }
          } else {
            const botaoErrado = linkingListaEl.querySelector(`[data-indice="${msg.direitaIndex}"]`);
            if (botaoErrado) {
              botaoErrado.disabled = false;
              botaoErrado.classList.add("incorreto");
              setTimeout(() => botaoErrado.classList.remove("incorreto"), 400);
            }
          }
          break;
        }
        case "resultadoLinking": {
          clearInterval(intervaloLinking);
          mostrarTela(telaResultadoLinking);
          linkingResultadoTituloEl.textContent = msg.paresCorretos >= msg.totalPares
            ? "Você ligou tudo! 🎉"
            : `Você ligou ${msg.paresCorretos} de ${msg.totalPares}`;
          linkingPontosEl.textContent = `+${msg.pontosGanhos} pontos`;
          // o servidor diz quais pares ele ligou (vale mesmo se reconectou agora)
          const ligados = new Set(msg.corretos || linkingCorretosSet);
          linkingGabaritoEl.replaceChildren(
            ...msg.pares.map((par, i) => {
              const acertou = ligados.has(i);
              const li = criarEl("li", acertou ? "acertou" : "");
              li.style.animationDelay = `${i * 60}ms`;
              li.append(
                criarEl("span", "selo-gabarito", acertou ? "✓" : "–"),
                criarEl("span", "esquerda", par.esquerda),
                document.createTextNode("→"),
                criarEl("span", "direita", par.direita)
              );
              return li;
            })
          );
          renderizarMinhaPosicao(msg.placar, posicaoLinkingEls);
          prepararTelaResultado(botaoContinuarLinking, statusContinuarLinkingEl, msg.jaConfirmou);
          break;
        }
        case "progressoContinuar": {
          if (statusContinuarAtivoEl) {
            statusContinuarAtivoEl.classList.remove("oculto");
            statusContinuarAtivoEl.textContent = `${msg.confirmados} de ${msg.total} confirmaram estar prontos`;
          }
          break;
        }
      }
    }

    botaoContinuarLinking.addEventListener("click", () => confirmarContinuar(botaoContinuarLinking));

    // ======== servidor de mentira (responde como o server/sala.js) ========
    const TEMPO_LIMITE_MS = 30000;      // tempoLimiteLinkingMs
    const PONTOS_POR_PAR = 40;          // pontosPorParLinking
    const BONUS_COMPLETAR_MAX = 100;    // bonusVelocidadeLinkingMax

    const CONJUNTO = {                  // data/associacoes.json, id 1
      tema: 'Capitais e Países',
      pares: [
        { esquerda: 'Brasil', direita: 'Brasília' },
        { esquerda: 'França', direita: 'Paris' },
        { esquerda: 'Japão', direita: 'Tóquio' },
        { esquerda: 'Egito', direita: 'Cairo' },
        { esquerda: 'Austrália', direita: 'Camberra' }
      ]
    };

    const EU = { id: '2', nome: 'Rodrigo', pontos: 1355, avatar: { emoji: '🐼', cor: '#1e90ff' } };
    // os outros: em quanto tempo terminam (null = não termina) e quantos pares fazem
    const OUTROS = [
      { id: '1', nome: 'Ana',   pontos: 1480, avatar: { emoji: '🦊', cor: '#ff4757' }, terminaEm: 14000, pares: 5 },
      { id: '3', nome: 'Carla', pontos: 1290, avatar: { emoji: '🐸', cor: '#2ed573' }, terminaEm: 21000, pares: 5 },
      { id: '4', nome: 'Duda',  pontos: 1105, avatar: { emoji: '🦁', cor: '#ffa502' }, terminaEm: 26000, pares: 5 },
      { id: '5', nome: 'Edu',   pontos:  980, avatar: { emoji: '🦄', cor: '#9b59b6' }, terminaEm: null,  pares: 3 },
      { id: '6', nome: 'Bruno', pontos:  845, avatar: { emoji: '🐧', cor: '#00d2d3' }, terminaEm: 18000, pares: 5 }
    ];

    let timers = [];
    const depois = (ms, fn) => timers.push(setTimeout(fn, ms));
    let estado = null;

    function embaralhar(lista) {
      const a = [...lista];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function ganhoDe(corretos, completoEmMs) {
      const fracao = completoEmMs !== null ? Math.max(0, 1 - completoEmMs / TEMPO_LIMITE_MS) : 0;
      return corretos * PONTOS_POR_PAR + (completoEmMs !== null ? Math.round(BONUS_COMPLETAR_MAX * fracao) : 0);
    }

    function todosTerminaram() {
      return estado.eu.completoEmMs !== null && estado.outros.every((o) => o.completoEmMs !== null);
    }

    function revelar() {
      if (estado.revelado) return;
      estado.revelado = true;
      timers.forEach(clearTimeout);
      timers = [];
      const meuGanho = ganhoDe(estado.eu.corretos.size, estado.eu.completoEmMs);
      const placar = [
        { id: EU.id, nome: EU.nome, avatar: EU.avatar, pontos: EU.pontos + meuGanho },
        ...estado.outros.map((o) => ({ id: o.id, nome: o.nome, avatar: o.avatar, pontos: o.pontos + ganhoDe(o.corretos, o.completoEmMs) }))
      ].sort((a, b) => b.pontos - a.pontos);
      tratarMensagem({
        type: 'resultadoLinking',
        pontosGanhos: meuGanho,
        paresCorretos: estado.eu.corretos.size,
        corretos: [...estado.eu.corretos],
        totalPares: CONJUNTO.pares.length,
        pares: CONJUNTO.pares,
        placar
      });
      estado.confirmados = 0;
      // os outros vão apertando "continuar"
      estado.outros.forEach((_, k) => depois(2000 + k * 900 + Math.random() * 1500, confirmacao));
    }

    function confirmacao() {
      estado.confirmados++;
      tratarMensagem({ type: 'progressoContinuar', confirmados: estado.confirmados, total: 1 + estado.outros.length });
    }

    function enviarAoServidor(msg) {
      if (!estado) return;
      if (msg.type === 'tentarPar') {
        const p = estado.eu;
        const correto = p.direitaEmbaralhadaIndices[msg.direitaIndex] === msg.esquerdaIndex;
        if (correto) {
          p.corretos.add(msg.esquerdaIndex);
          if (p.corretos.size >= CONJUNTO.pares.length) p.completoEmMs = Date.now() - estado.inicio;
        }
        // a resposta chega pela rede, não na hora
        depois(120, () => {
          tratarMensagem({ type: 'resultadoTentativaPar', esquerdaIndex: msg.esquerdaIndex, direitaIndex: msg.direitaIndex, correto, completou: p.completoEmMs !== null });
          if (todosTerminaram()) revelar();
        });
      } else if (msg.type === 'continuar') {
        confirmacao();
      }
    }

    function jogar() {
      timers.forEach(clearTimeout);
      timers = [];
      meuJogadorId = EU.id;
      document.documentElement.style.setProperty('--cor-jogador', EU.avatar.cor);
      for (const el of document.querySelectorAll('[data-identidade]')) {
        el.innerHTML = '';
        el.append(criarEl('span', 'player-avatar', EU.avatar.emoji), criarEl('span', 'player-name', EU.nome));
      }

      // cada jogador recebe seu próprio embaralhamento da coluna da direita
      const ordem = embaralhar(CONJUNTO.pares.map((_, i) => i));
      estado = {
        inicio: Date.now(),
        revelado: false,
        eu: { direitaEmbaralhadaIndices: ordem, corretos: new Set(), completoEmMs: null },
        outros: OUTROS.map((o) => ({ ...o, corretos: 0, completoEmMs: null }))
      };
      for (const o of estado.outros) {
        depois(o.terminaEm ?? TEMPO_LIMITE_MS, () => {
          o.corretos = o.pares;
          if (o.terminaEm !== null) o.completoEmMs = o.terminaEm;
          if (todosTerminaram()) revelar();
        });
      }
      depois(TEMPO_LIMITE_MS + 500, revelar);

      tratarMensagem({
        type: 'iniciarLinking',
        tema: CONJUNTO.tema,
        esquerda: CONJUNTO.pares.map((p) => p.esquerda),
        direita: ordem.map((i) => CONJUNTO.pares[i].direita),
        tempoLimiteMs: TEMPO_LIMITE_MS
      });
    }

    function resultadoDireto() {
      jogar();
      // pula para o fim, como se você tivesse ligado 3 dos 5 pares
      [0, 1, 3].forEach((i) => estado.eu.corretos.add(i));
      for (const o of estado.outros) {
        o.corretos = o.pares;
        if (o.terminaEm !== null) o.completoEmMs = o.terminaEm;
      }
      revelar();
    }

    document.getElementById('botao-repetir').addEventListener('click', jogar);
    document.getElementById('botao-resultado').addEventListener('click', resultadoDireto);
    if (new URLSearchParams(location.search).has('limpo')) document.getElementById('barra-prototipo').classList.add('oculto');
    jogar();
  })();
  </script>
</body>
