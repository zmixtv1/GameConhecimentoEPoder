<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Controle Mobile - Ligação</title>

    <!--
      PROPOSTA NOVA das telas do celular no desafio de Ligação ("linking").

      DURANTE: as duas colunas na mesma tela, lado a lado.
        - Toque num item da esquerda e depois num da direita (ou o contrário),
          ou ARRASTE de um card até o outro: uma linha acompanha o dedo.
        - Certo: os dois cards ficam com a mesma cor e uma linha fixa os liga.
        - Errado: a linha pisca vermelho, os cards tremem e soltam. Errar não
          tira ponto, só custa tempo.
        - Ligou tudo: "Tudo ligado! 🎉" por cima, esperando os outros.
      Funciona deitado e em pé (as colunas continuam lado a lado).

      RESULTADO: pontos ganhos, gabarito marcando quais pares VOCÊ ligou, sua
      posição e o botão Continuar.

      Protocolo igual ao de hoje:
        recebe iniciarLinking, resultadoTentativaPar, resultadoLinking, progressoContinuar
        envia  tentarPar { esquerdaIndex, direitaIndex } e continuar
      Detalhe: ao reconectar, iniciarLinking traz `corretos` e `direitaUsada`,
      mas não QUAL direita foi com qual esquerda. Esses pares aparecem
      marcados ✓, sem a linha.

      Barra do protótipo: Jogar de novo · Resultado. ?limpo esconde.
    -->

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: light;
            --text-main: #0f172a;
            --text-muted: #475569;
            --bg: #f8fafc;
            --verde: #2ed573;
            --verde-escuro: #0a7a3c;
            --vermelho: #ff4757;
            --violet: #9b59b6;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 6px 14px rgba(0, 0, 0, 0.07);

            --cor-jogador: #1e90ff;
            --player-glass: color-mix(in srgb, var(--cor-jogador) 15%, transparent);
            --player-glow: color-mix(in srgb, var(--cor-jogador) 30%, transparent);

            --pad-t: max(8px, env(safe-area-inset-top));
            --pad-r: max(12px, env(safe-area-inset-right));
            --pad-b: max(8px, env(safe-area-inset-bottom));
            --pad-l: max(12px, env(safe-area-inset-left));

            --gap: clamp(6px, 2vmin, 12px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Outfit", system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html { height: 100%; }

        body {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l);
            background-color: var(--bg);
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
            touch-action: none;
        }

        .oculto { display: none !important; }

        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: fluidMotion 20s infinite alternate ease-in-out;
        }
        .light-1 { top: -10%; left: -10%; width: 60vmax; height: 60vmax; background: rgba(226, 232, 240, 0.8); }
        .light-2 { bottom: -20%; right: -10%; width: 50vmax; height: 50vmax; background: rgba(186, 230, 253, 0.5); animation-delay: -5s; }
        .light-3 { top: 30%; left: 30%; width: 35vmax; height: 35vmax; background: rgba(233, 213, 255, 0.5); animation-delay: -10s; }
        @keyframes fluidMotion {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(15px, 20px) scale(1.05); }
            66% { transform: translate(-15px, 10px) scale(0.95); }
            100% { transform: translate(25px, -15px) scale(1.02); }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* ===================== ESTRUTURA ===================== */
        .tela {
            position: relative;
            z-index: 1;
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }

        .cabecalho { flex: none; display: flex; align-items: center; gap: 10px; }
        .cabecalho-texto { flex: 1; min-width: 0; text-align: center; }
        .cabecalho-vazio { flex: none; width: clamp(44px, 13vmin, 56px); }

        .player-identity {
            flex: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px 5px 8px;
            border-radius: 100px;
            max-width: 32%;
        }
        .player-avatar { font-size: clamp(20px, 6vmin, 26px); line-height: 1; }
        .player-name {
            font-size: clamp(12px, 3.6vmin, 15px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tema {
            font-size: clamp(10px, 3vmin, 13px);
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--violet);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .titulo {
            font-size: clamp(15px, 5vmin, 22px);
            font-weight: 900;
            line-height: 1.15;
        }
        .progresso-pares {
            display: inline-flex;
            gap: 4px;
            vertical-align: middle;
            margin-left: 6px;
        }
        .progresso-pares i {
            width: clamp(7px, 2vmin, 10px);
            height: clamp(7px, 2vmin, 10px);
            border-radius: 50%;
            background: rgba(15, 23, 42, .15);
            transition: background .25s ease, transform .25s ease;
        }
        .progresso-pares i.ok { background: var(--verde); transform: scale(1.2); }

        /* Timer */
        .timer {
            position: relative;
            flex: none;
            width: clamp(44px, 13vmin, 56px);
            height: clamp(44px, 13vmin, 56px);
            border-radius: 50%;
            display: grid;
            place-items: center;
        }
        .timer svg { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); transform: rotate(-90deg); }
        .anel-fundo { fill: none; stroke: rgba(255, 255, 255, 0.8); stroke-width: 9; }
        .anel { fill: none; stroke: var(--text-main); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 326.7; transition: stroke .3s ease; }
        .timer-numero { font-size: clamp(17px, 5.4vmin, 22px); font-weight: 900; font-variant-numeric: tabular-nums; }
        .timer.urgente { animation: pulso 1s ease-in-out infinite; border-color: var(--vermelho); }
        .timer.urgente .anel { stroke: var(--vermelho); }
        .timer.urgente .timer-numero { color: var(--vermelho); }
        @keyframes pulso { 50% { transform: scale(1.1); } }

        /* ===================== ÁREA DE LIGAR ===================== */
        .ligar {
            position: relative;
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) clamp(30px, 10vw, 90px) minmax(0, 1fr);
        }

        .coluna {
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(5px, 1.6vmin, 10px);
        }
        .coluna.esquerda { grid-column: 1; }
        .coluna.direita { grid-column: 3; }

        .item {
            --cor-par: var(--cor-jogador);
            position: relative;
            flex: 1 1 0;
            min-height: 0;
            max-height: 92px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px clamp(8px, 2.4vmin, 14px);
            border-radius: clamp(12px, 3.6vmin, 18px);
            border: 2px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--glass-shadow);
            color: var(--text-main);
            font-size: clamp(13px, 4.4vmin, 20px);
            font-weight: 900;
            line-height: 1.1;
            text-align: center;
            overflow-wrap: anywhere;
            cursor: pointer;
            touch-action: none;
            opacity: 0;
            animation: entrar .4s cubic-bezier(.34, 1.56, .64, 1) forwards;
            transition: transform .15s cubic-bezier(.34, 1.56, .64, 1), border-color .2s ease, background .2s ease, box-shadow .2s ease, opacity .3s ease;
        }
        @keyframes entrar { from { opacity: 0; transform: translateY(8px) scale(.94); } to { opacity: 1; transform: none; } }
        .item:active:not(.ligado) { transform: scale(.96); }

        /* Ponto de conexão na borda que fica de frente para a outra coluna */
        .item::after {
            content: '';
            position: absolute;
            top: 50%;
            width: clamp(10px, 2.8vmin, 14px);
            height: clamp(10px, 2.8vmin, 14px);
            margin-top: calc(clamp(10px, 2.8vmin, 14px) / -2);
            border-radius: 50%;
            background: #fff;
            border: 2px solid rgba(15, 23, 42, .2);
            transition: background .2s ease, border-color .2s ease;
        }
        .esquerda .item::after { right: calc(clamp(10px, 2.8vmin, 14px) / -2 - 1px); }
        .direita .item::after { left: calc(clamp(10px, 2.8vmin, 14px) / -2 - 1px); }

        .item.selecionado {
            border-color: var(--cor-jogador);
            background: var(--player-glass);
            box-shadow: 0 8px 20px var(--player-glow);
            color: color-mix(in srgb, var(--cor-jogador) 75%, #0f172a);
            transform: scale(1.03);
        }
        .item.selecionado::after { background: var(--cor-jogador); border-color: var(--cor-jogador); }

        .item.aguardando { opacity: .7; pointer-events: none; }

        .item.ligado {
            cursor: default;
            border-color: var(--cor-par);
            background: color-mix(in srgb, var(--cor-par) 16%, var(--glass-bg));
            color: color-mix(in srgb, var(--cor-par) 60%, #0f172a);
            box-shadow: 0 6px 14px color-mix(in srgb, var(--cor-par) 22%, transparent);
            animation: ligou .45s cubic-bezier(.34, 1.8, .64, 1);
            opacity: 1;
        }
        .item.ligado::after { background: var(--cor-par); border-color: var(--cor-par); }
        .item.ligado .check { display: inline; }
        .check { display: none; margin-right: 4px; }
        @keyframes ligou { 40% { transform: scale(1.07); } }

        .item.errou {
            border-color: var(--vermelho);
            background: color-mix(in srgb, var(--vermelho) 18%, var(--glass-bg));
            animation: tremer .4s ease;
            opacity: 1;
        }
        @keyframes tremer {
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(3px); }
        }

        /* Linhas por cima de tudo, sem pegar toque */
        .linhas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
            z-index: 3;
        }
        .linhas path {
            fill: none;
            stroke-width: clamp(3px, 1.1vmin, 5px);
            stroke-linecap: round;
        }
        .linhas .fixa { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: desenhar .35s ease forwards; }
        .linhas .temporaria { stroke: var(--cor-jogador); stroke-dasharray: 7 7; opacity: .85; }
        .linhas .erro { stroke: var(--vermelho); animation: sumir .5s ease forwards; }
        @keyframes desenhar { to { stroke-dashoffset: 0; } }
        @keyframes sumir { 0%, 50% { opacity: 1; } 100% { opacity: 0; } }

        /* Tudo ligado */
        .terminou {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border-radius: 20px;
            background: rgba(248, 250, 252, .78);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            text-align: center;
            animation: aparecer .4s ease;
        }
        @keyframes aparecer { from { opacity: 0; } }
        .terminou .grande { font-size: clamp(36px, 14vmin, 64px); line-height: 1; animation: ligou .6s cubic-bezier(.34, 1.8, .64, 1); }
        .terminou b { font-size: clamp(18px, 6vmin, 28px); font-weight: 900; color: var(--verde-escuro); }
        .terminou small { font-size: clamp(12px, 3.6vmin, 15px); font-weight: 700; color: var(--text-muted); }

        /* ===================== RESULTADO ===================== */
        .resultado-corpo {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
            gap: clamp(10px, 2.4vw, 20px);
        }
        .ganho-titulo { font-size: clamp(15px, 5vmin, 22px); font-weight: 900; }
        .ganho-titulo .pts { color: var(--cor-jogador); }
        .ganho-sub { font-size: clamp(11px, 3.2vmin, 14px); font-weight: 700; color: var(--text-muted); }

        .rotulo {
            margin-bottom: 4px;
            font-size: clamp(9px, 2.6vmin, 11px);
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .gabarito-col { min-height: 0; display: flex; flex-direction: column; }
        .gabarito { list-style: none; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
        .gabarito li {
            flex: 1 1 0;
            min-height: 0;
            max-height: 48px;
            display: grid;
            grid-template-columns: 1.4em minmax(0, 1fr) 1.2em minmax(0, 1fr);
            align-items: center;
            gap: 4px;
            padding: 0 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .6);
            border: 1px solid rgba(255, 255, 255, .9);
            font-size: clamp(12px, 3.6vmin, 16px);
            font-weight: 800;
        }
        .gabarito li.meu { background: color-mix(in srgb, var(--verde) 14%, white); border-color: color-mix(in srgb, var(--verde) 50%, white); }
        .gabarito .marca { text-align: center; }
        .gabarito .seta { text-align: center; color: var(--text-muted); }
        .gabarito .esq, .gabarito .dir { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gabarito .dir { color: var(--verde-escuro); }
        .gabarito li:not(.meu) .marca { opacity: .45; }

        .minha-posicao {
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 8px;
            border-radius: 20px;
            text-align: center;
        }
        .posicao-numero {
            font-size: clamp(40px, 16vmin, 80px);
            font-weight: 900;
            line-height: 1;
            color: var(--cor-jogador);
            text-shadow: 0 6px 20px var(--player-glow);
        }
        .posicao-pontos { font-size: clamp(15px, 4.6vmin, 22px); font-weight: 900; }
        .posicao-diferenca { font-size: clamp(11px, 3.2vmin, 14px); font-weight: 700; color: var(--text-muted); max-width: 95%; }

        .rodape { flex: none; display: flex; align-items: center; gap: 10px; }
        .btn-primario {
            flex: 1;
            padding: clamp(9px, 3vmin, 14px) 18px;
            border: 0;
            border-radius: 16px;
            background: var(--cor-jogador);
            color: #fff;
            font-size: clamp(15px, 4.6vmin, 20px);
            font-weight: 900;
            box-shadow: 0 10px 25px var(--player-glow);
            cursor: pointer;
            transition: transform .15s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
        }
        .btn-primario:active:not(:disabled) { transform: scale(.96); }
        .btn-primario:disabled { opacity: .5; box-shadow: none; cursor: default; }
        .status { flex: none; max-width: 45%; font-size: clamp(11px, 3.2vmin, 14px); font-weight: 700; color: var(--text-muted); }

        /* ===================== EM PÉ ===================== */
        @media (orientation: portrait) {
            .cabecalho { flex-wrap: wrap; row-gap: 6px; }
            .cabecalho-texto { order: 3; flex-basis: 100%; }
            .player-identity { max-width: 60%; }
            .timer, .cabecalho-vazio { margin-left: auto; }
            .ligar { grid-template-columns: minmax(0, 1fr) clamp(40px, 15vw, 80px) minmax(0, 1fr); }
            .item { max-height: 110px; font-size: clamp(15px, 2.6vh, 22px); }
            .resultado-corpo { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
            .minha-posicao { order: -1; }
            .rodape { flex-direction: column-reverse; }
            .status { max-width: none; }
            .btn-primario { width: 100%; }
        }

        @media (orientation: landscape) and (max-height: 340px) {
            :root { --gap: 6px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }

        /* ===== só deste protótipo, não existe no jogo ===== */
        .barra-prototipo {
            position: fixed; bottom: 6px; right: 6px; z-index: 500;
            display: flex; align-items: center; gap: 6px;
            padding: 4px 6px; border-radius: 8px;
            background: rgba(15, 23, 42, 0.88); color: #fff;
            font-size: 10px; font-weight: 700;
        }
        .barra-prototipo button { padding: 2px 6px; border: 0; border-radius: 5px; background: #fff; color: #0f172a; font-size: 10px; font-weight: 800; font-family: inherit; cursor: pointer; }
    </style>
</head>

<body>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>
    <div class="ambient-light light-3"></div>

    <!-- ===================== DURANTE ===================== -->
    <section id="tela-linking" class="tela oculto">
        <header class="cabecalho">
            <div class="player-identity glass-panel" data-identidade></div>
            <div class="cabecalho-texto">
                <p class="tema" id="linking-tema"></p>
                <h2 class="titulo"><span id="linking-titulo">Ligue os pares</span><span class="progresso-pares" id="linking-progresso"></span></h2>
            </div>
            <div class="timer glass-panel" id="timer-linking">
                <svg viewBox="0 0 120 120">
                    <circle class="anel-fundo" cx="60" cy="60" r="52"></circle>
                    <circle class="anel" id="anel-linking" cx="60" cy="60" r="52"></circle>
                </svg>
                <span class="timer-numero" id="numero-linking"></span>
            </div>
        </header>

        <div class="ligar" id="ligar">
            <div class="coluna esquerda" id="coluna-esquerda"></div>
            <div class="coluna direita" id="coluna-direita"></div>
            <svg class="linhas" id="linhas"></svg>
        </div>
    </section>

    <!-- ===================== RESULTADO ===================== -->
    <section id="tela-resultado-linking" class="tela oculto">
        <header class="cabecalho">
            <div class="player-identity glass-panel" data-identidade></div>
            <div class="cabecalho-texto">
                <p class="ganho-titulo">Ligação: <span class="pts" id="linking-pontos"></span></p>
                <p class="ganho-sub" id="linking-pares-sub"></p>
            </div>
            <div class="cabecalho-vazio"></div>
        </header>

        <div class="resultado-corpo">
            <div class="gabarito-col">
                <p class="rotulo">Gabarito</p>
                <ol class="gabarito" id="linking-gabarito"></ol>
            </div>
            <div class="minha-posicao glass-panel">
                <p class="rotulo">Sua posição</p>
                <p class="posicao-numero" id="posicao-numero-linking"></p>
                <p class="posicao-pontos" id="posicao-pontos-linking"></p>
                <p class="posicao-diferenca oculto" id="posicao-diferenca-linking"></p>
            </div>
        </div>

        <footer class="rodape">
            <button id="botao-continuar-linking" class="btn-primario" type="button">Continuar</button>
            <p class="status oculto" id="status-continuar-linking"></p>
        </footer>
    </section>

    <div class="barra-prototipo" id="barra-prototipo">
        <button id="botao-repetir" type="button">Jogar de novo</button>
        <button id="botao-resultado" type="button">Resultado</button>
    </div>

    <script>
    (() => {
        'use strict';

        // ======== Celular (substitui o trecho do public/controlador/controlador.js) ========
        const $ = id => document.getElementById(id);
        const telaLinking = $('tela-linking');
        const telaResultadoLinking = $('tela-resultado-linking');
        const TODAS_AS_TELAS = [telaLinking, telaResultadoLinking];

        const ligarEl = $('ligar');
        const colEsq = $('coluna-esquerda');
        const colDir = $('coluna-direita');
        const svg = $('linhas');
        const SVG_NS = 'http://www.w3.org/2000/svg';

        // Uma cor por par ligado, para as linhas não se confundirem
        const CORES_PARES = ['#22c55e', '#3b82f6', '#f59e0b', '#a855f7', '#ec4899', '#14b8a6', '#ef4444', '#64748b'];

        let meuJogadorId = null;
        let jaConfirmouContinuar = false;
        let statusContinuarAtivoEl = null;
        let intervaloLinking = null;

        let esquerdaTextos = [];
        let direitaTextos = [];
        let totalPares = 0;
        let pares = [];                 // [{ e, d, cor }] pares ligados (com linha)
        let corretosSemLinha = new Set(); // reconexão: esquerda já certa, sem saber a direita
        let direitaUsada = new Set();
        let selecionado = null;         // { lado: 'e'|'d', i }
        let pendente = null;            // { e, d } esperando o servidor
        let completou = false;

        function mostrarTela(tela) {
            for (const t of TODAS_AS_TELAS) t.classList.toggle('oculto', t !== tela);
        }

        function criarEl(tag, classe, texto) {
            const el = document.createElement(tag);
            if (classe) el.className = classe;
            if (texto !== undefined) el.textContent = texto;
            return el;
        }

        const itemEl = (lado, i) => (lado === 'e' ? colEsq : colDir).children[i];

        // ---------- Timer ----------
        const CIRC = 326.7;
        function iniciarTimer(ms) {
            clearInterval(intervaloLinking);
            const anel = $('anel-linking'), numero = $('numero-linking'), modulo = $('timer-linking');
            const inicio = Date.now();
            const atualizar = () => {
                const dec = Date.now() - inicio;
                const resta = Math.max(0, ms - dec);
                anel.style.strokeDashoffset = String(CIRC * Math.min(1, dec / ms));
                const s = Math.ceil(resta / 1000);
                numero.textContent = String(s);
                modulo.classList.toggle('urgente', s <= 5 && s > 0 && !completou);
                if (resta <= 0) clearInterval(intervaloLinking);
            };
            atualizar();
            intervaloLinking = setInterval(atualizar, 100);
        }

        // ---------- Montagem ----------
        function montarColunas() {
            colEsq.replaceChildren();
            colDir.replaceChildren();
            esquerdaTextos.forEach((t, i) => colEsq.append(criarItem('e', i, t)));
            direitaTextos.forEach((t, i) => colDir.append(criarItem('d', i, t)));
            atualizarProgresso();
        }

        function criarItem(lado, i, texto) {
            const b = criarEl('button', 'item');
            b.type = 'button';
            b.dataset.lado = lado;
            b.dataset.i = String(i);
            b.style.animationDelay = `${i * 50 + (lado === 'd' ? 120 : 0)}ms`;
            b.append(criarEl('span', 'check', '✓'), document.createTextNode(texto));
            b.addEventListener('pointerdown', comecarToque);
            return b;
        }

        function atualizarProgresso() {
            const feitos = pares.length + corretosSemLinha.size;
            const cont = $('linking-progresso');
            cont.replaceChildren(...Array.from({ length: totalPares }, (_, k) => criarEl('i', k < feitos ? 'ok' : '')));
            $('linking-titulo').textContent = completou ? 'Tudo ligado!' : 'Ligue os pares';
        }

        const estaLigado = (lado, i) =>
            lado === 'e' ? (pares.some(p => p.e === i) || corretosSemLinha.has(i)) : (pares.some(p => p.d === i) || direitaUsada.has(i));

        // ---------- Seleção por toque ----------
        function limparSelecao() {
            if (selecionado) itemEl(selecionado.lado, selecionado.i)?.classList.remove('selecionado');
            selecionado = null;
        }

        function tocar(lado, i) {
            if (pendente || completou || estaLigado(lado, i)) return;
            if (selecionado && selecionado.lado === lado && selecionado.i === i) { limparSelecao(); return; }
            if (selecionado && selecionado.lado !== lado) {
                const e = lado === 'e' ? i : selecionado.i;
                const d = lado === 'd' ? i : selecionado.i;
                limparSelecao();
                tentarPar(e, d);
                return;
            }
            limparSelecao();
            selecionado = { lado, i };
            itemEl(lado, i).classList.add('selecionado');
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function tentarPar(e, d) {
            pendente = { e, d };
            itemEl('e', e).classList.add('aguardando');
            itemEl('d', d).classList.add('aguardando');
            desenharTemporaria(itemEl('e', e), itemEl('d', d));
            enviarAoServidor({ type: 'tentarPar', esquerdaIndex: e, direitaIndex: d });
        }

        // ---------- Arrastar ----------
        let arrasto = null; // { lado, i, x0, y0, moveu }

        function comecarToque(ev) {
            const b = ev.currentTarget;
            const lado = b.dataset.lado, i = Number(b.dataset.i);
            if (pendente || completou || estaLigado(lado, i)) return;
            ev.preventDefault();
            arrasto = { lado, i, x0: ev.clientX, y0: ev.clientY, moveu: false };
            window.addEventListener('pointermove', moverToque);
            window.addEventListener('pointerup', soltarToque, { once: true });
            window.addEventListener('pointercancel', cancelarToque, { once: true });
        }

        function moverToque(ev) {
            if (!arrasto) return;
            if (!arrasto.moveu && Math.hypot(ev.clientX - arrasto.x0, ev.clientY - arrasto.y0) < 10) return;
            if (!arrasto.moveu) {
                arrasto.moveu = true;
                limparSelecao();
                selecionado = { lado: arrasto.lado, i: arrasto.i };
                itemEl(arrasto.lado, arrasto.i).classList.add('selecionado');
            }
            desenharTemporaria(itemEl(arrasto.lado, arrasto.i), { x: ev.clientX, y: ev.clientY });
        }

        function soltarToque(ev) {
            window.removeEventListener('pointermove', moverToque);
            const a = arrasto;
            arrasto = null;
            if (!a) return;
            if (!a.moveu) { tocar(a.lado, a.i); return; }

            limparTemporaria();
            const alvo = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.item');
            if (alvo && alvo.dataset.lado !== a.lado && !estaLigado(alvo.dataset.lado, Number(alvo.dataset.i))) {
                const j = Number(alvo.dataset.i);
                limparSelecao();
                tentarPar(a.lado === 'e' ? a.i : j, a.lado === 'd' ? a.i : j);
            }
            // Soltou fora: o item continua selecionado, dá para completar com um toque
        }

        function cancelarToque() {
            window.removeEventListener('pointermove', moverToque);
            arrasto = null;
            limparTemporaria();
        }

        // ---------- Linhas ----------
        function pontoBorda(el) {
            const base = ligarEl.getBoundingClientRect();
            const r = el.getBoundingClientRect();
            const x = el.dataset.lado === 'e' ? r.right : r.left;
            return { x: x - base.left, y: r.top + r.height / 2 - base.top };
        }

        function caminho(a, b) {
            const dx = Math.max(24, Math.abs(b.x - a.x) * 0.5);
            const s = b.x >= a.x ? 1 : -1;
            return `M${a.x} ${a.y} C${a.x + dx * s} ${a.y}, ${b.x - dx * s} ${b.y}, ${b.x} ${b.y}`;
        }

        function novoPath(classe, d, cor) {
            const p = document.createElementNS(SVG_NS, 'path');
            p.setAttribute('class', classe);
            p.setAttribute('d', d);
            if (cor) p.setAttribute('stroke', cor);
            svg.append(p);
            return p;
        }

        function limparTemporaria() { svg.querySelectorAll('.temporaria').forEach(p => p.remove()); }

        function desenharTemporaria(deEl, para) {
            limparTemporaria();
            const a = pontoBorda(deEl);
            let b;
            if (para instanceof Element) b = pontoBorda(para);
            else { const base = ligarEl.getBoundingClientRect(); b = { x: para.x - base.left, y: para.y - base.top }; }
            const de = deEl.dataset.lado === 'e' ? a : b, ate = deEl.dataset.lado === 'e' ? b : a;
            novoPath('temporaria', caminho(de, ate));
        }

        function desenharFixa(par, animar) {
            const p = novoPath(animar ? 'fixa' : '', caminho(pontoBorda(itemEl('e', par.e)), pontoBorda(itemEl('d', par.d))), par.cor);
            p.dataset.par = `${par.e}-${par.d}`;
            if (animar) p.style.setProperty('--len', String(Math.ceil(p.getTotalLength())));
        }

        function redesenharTudo() {
            svg.replaceChildren();
            pares.forEach(par => desenharFixa(par, false));
        }

        function marcarLigado(par) {
            for (const [lado, i] of [['e', par.e], ['d', par.d]]) {
                const el = itemEl(lado, i);
                el.classList.remove('aguardando', 'selecionado');
                el.classList.add('ligado');
                el.style.setProperty('--cor-par', par.cor);
            }
        }

        function mostrarTerminou() {
            if (ligarEl.querySelector('.terminou')) return;
            const t = criarEl('div', 'terminou');
            t.append(criarEl('span', 'grande', '🎉'), criarEl('b', '', 'Tudo ligado!'), criarEl('small', '', 'Aguardando os outros jogadores…'));
            ligarEl.append(t);
        }

        window.addEventListener('resize', () => requestAnimationFrame(redesenharTudo));

        // ---------- Resultado ----------
        function renderizarMinhaPosicao(placar) {
            const eu = placar.find(j => j.id === meuJogadorId);
            if (!eu) return;
            const posicao = placar.filter(j => j.pontos > eu.pontos).length + 1;
            $('posicao-numero-linking').textContent = `${posicao}º`;
            $('posicao-pontos-linking').textContent = `${eu.pontos} pts`;
            const dif = $('posicao-diferenca-linking');
            const acima = [...placar].reverse().find(j => j.pontos > eu.pontos);
            if (acima) {
                const faltam = acima.pontos - eu.pontos + 1;
                dif.textContent = `Faltam ${faltam} ${faltam === 1 ? 'ponto' : 'pontos'} para passar ${acima.nome}`;
                dif.classList.remove('oculto');
            } else {
                dif.textContent = 'Você está na frente! 🏆';
                dif.classList.remove('oculto');
            }
        }

        function renderizarGabarito(paresCertos) {
            const ol = $('linking-gabarito');
            ol.replaceChildren();
            for (const par of paresCertos) {
                const iEsq = esquerdaTextos.indexOf(par.esquerda);
                const meu = pares.some(p => p.e === iEsq) || corretosSemLinha.has(iEsq);
                const li = criarEl('li', meu ? 'meu' : '');
                li.append(
                    criarEl('span', 'marca', meu ? '✅' : '➖'),
                    criarEl('span', 'esq', par.esquerda),
                    criarEl('span', 'seta', '→'),
                    criarEl('span', 'dir', par.direita)
                );
                ol.append(li);
            }
        }

        function prepararContinuar(jaConfirmou) {
            const botao = $('botao-continuar-linking'), status = $('status-continuar-linking');
            jaConfirmouContinuar = !!jaConfirmou;
            botao.disabled = !!jaConfirmou;
            status.classList.toggle('oculto', !jaConfirmou);
            status.textContent = jaConfirmou ? 'Aguardando os outros jogadores…' : '';
            statusContinuarAtivoEl = status;
        }

        $('botao-continuar-linking').addEventListener('click', () => {
            if (jaConfirmouContinuar) return;
            jaConfirmouContinuar = true;
            $('botao-continuar-linking').disabled = true;
            statusContinuarAtivoEl.classList.remove('oculto');
            statusContinuarAtivoEl.textContent = 'Aguardando os outros jogadores…';
            enviarAoServidor({ type: 'continuar' });
        });

        // ---------- Mensagens do servidor ----------
        function tratarMensagem(msg) {
            switch (msg.type) {
                case 'iniciarLinking': {
                    $('linking-tema').textContent = msg.tema;
                    esquerdaTextos = msg.esquerda;
                    direitaTextos = msg.direita;
                    totalPares = msg.esquerda.length;
                    pares = [];
                    corretosSemLinha = new Set(msg.corretos || []);
                    direitaUsada = new Set(msg.direitaUsada || []);
                    selecionado = null;
                    pendente = null;
                    completou = !!msg.completou;
                    ligarEl.querySelector('.terminou')?.remove();
                    svg.replaceChildren();
                    mostrarTela(telaLinking);
                    montarColunas();
                    corretosSemLinha.forEach(i => { const el = itemEl('e', i); el.classList.add('ligado'); el.style.setProperty('--cor-par', '#94a3b8'); });
                    direitaUsada.forEach(i => { const el = itemEl('d', i); el.classList.add('ligado'); el.style.setProperty('--cor-par', '#94a3b8'); });
                    if (completou) mostrarTerminou();
                    iniciarTimer(msg.tempoLimiteMs);
                    break;
                }
                case 'resultadoTentativaPar': {
                    const e = msg.esquerdaIndex, d = msg.direitaIndex;
                    pendente = null;
                    limparTemporaria();
                    const elE = itemEl('e', e), elD = itemEl('d', d);
                    if (msg.correto) {
                        const par = { e, d, cor: CORES_PARES[pares.length % CORES_PARES.length] };
                        pares.push(par);
                        direitaUsada.add(d);
                        marcarLigado(par);
                        desenharFixa(par, true);
                        if (navigator.vibrate) navigator.vibrate(25);
                        if (msg.completou) { completou = true; setTimeout(mostrarTerminou, 450); }
                    } else {
                        [elE, elD].forEach(el => {
                            el.classList.remove('aguardando', 'selecionado');
                            el.classList.add('errou');
                            setTimeout(() => el.classList.remove('errou'), 450);
                        });
                        novoPath('erro', caminho(pontoBorda(elE), pontoBorda(elD)));
                        setTimeout(() => svg.querySelectorAll('.erro').forEach(p => p.remove()), 520);
                        if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
                    }
                    atualizarProgresso();
                    break;
                }
                case 'resultadoLinking': {
                    clearInterval(intervaloLinking);
                    mostrarTela(telaResultadoLinking);
                    $('linking-pontos').textContent = `+${msg.pontosGanhos} pts`;
                    $('linking-pares-sub').textContent = `Você ligou ${msg.paresCorretos} de ${msg.totalPares} pares`;
                    renderizarGabarito(msg.pares);
                    renderizarMinhaPosicao(msg.placar);
                    prepararContinuar(msg.jaConfirmou);
                    break;
                }
                case 'progressoContinuar': {
                    if (statusContinuarAtivoEl) {
                        statusContinuarAtivoEl.classList.remove('oculto');
                        statusContinuarAtivoEl.textContent = `${msg.confirmados} de ${msg.total} prontos`;
                    }
                    break;
                }
            }
        }

        // ======== servidor de mentira (responde como o server/sala.js) ========
        const TEMPO_LIMITE_MS = 30000;
        const PONTOS_POR_PAR = 40;
        const BONUS_COMPLETAR_MAX = 100;

        const CONJUNTO = {
            tema: 'Capitais e Países',
            pares: [
                { esquerda: 'Brasil', direita: 'Brasília' },
                { esquerda: 'França', direita: 'Paris' },
                { esquerda: 'Japão', direita: 'Tóquio' },
                { esquerda: 'Egito', direita: 'Cairo' },
                { esquerda: 'Austrália', direita: 'Camberra' }
            ]
        };

        const EU = { id: '2', nome: 'Rodrigo', pontos: 1355, avatar: { emoji: '🐼', cor: '#1e90ff' } };
        const OUTROS = [
            { id: '1', nome: 'Ana',   pontos: 1480, avatar: { emoji: '🦊', cor: '#ff4757' }, terminaEm: 14000, pares: 5 },
            { id: '3', nome: 'Carla', pontos: 1290, avatar: { emoji: '🐸', cor: '#2ed573' }, terminaEm: 21000, pares: 5 },
            { id: '4', nome: 'Duda',  pontos: 1105, avatar: { emoji: '🦁', cor: '#ffa502' }, terminaEm: 26000, pares: 5 },
            { id: '5', nome: 'Edu',   pontos:  980, avatar: { emoji: '🦄', cor: '#9b59b6' }, terminaEm: null,  pares: 3 },
            { id: '6', nome: 'Bruno', pontos:  845, avatar: { emoji: '🐧', cor: '#00d2d3' }, terminaEm: 18000, pares: 5 }
        ];

        let timers = [];
        const depois = (ms, fn) => timers.push(setTimeout(fn, ms));
        let estado = null;

        function embaralhar(lista) {
            const a = [...lista];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function ganhoDe(corretos, completoEmMs) {
            const fracao = completoEmMs !== null ? Math.max(0, 1 - completoEmMs / TEMPO_LIMITE_MS) : 0;
            return corretos * PONTOS_POR_PAR + (completoEmMs !== null ? Math.round(BONUS_COMPLETAR_MAX * fracao) : 0);
        }

        const todosTerminaram = () => estado.eu.completoEmMs !== null && estado.outros.every(o => o.completoEmMs !== null);

        function revelar() {
            if (estado.revelado) return;
            estado.revelado = true;
            timers.forEach(clearTimeout);
            timers = [];
            const meuGanho = ganhoDe(estado.eu.corretos.size, estado.eu.completoEmMs);
            const placar = [
                { id: EU.id, nome: EU.nome, avatar: EU.avatar, pontos: EU.pontos + meuGanho },
                ...estado.outros.map(o => ({ id: o.id, nome: o.nome, avatar: o.avatar, pontos: o.pontos + ganhoDe(o.corretos, o.completoEmMs) }))
            ].sort((a, b) => b.pontos - a.pontos);
            tratarMensagem({ type: 'resultadoLinking', pontosGanhos: meuGanho, paresCorretos: estado.eu.corretos.size, totalPares: CONJUNTO.pares.length, pares: CONJUNTO.pares, placar });
            estado.confirmados = 0;
            estado.outros.forEach((_, k) => depois(2000 + k * 900 + Math.random() * 1500, confirmacao));
        }

        function confirmacao() {
            estado.confirmados++;
            tratarMensagem({ type: 'progressoContinuar', confirmados: estado.confirmados, total: 1 + estado.outros.length });
        }

        function enviarAoServidor(msg) {
            if (!estado) return;
            if (msg.type === 'tentarPar') {
                const p = estado.eu;
                const correto = p.direitaEmbaralhadaIndices[msg.direitaIndex] === msg.esquerdaIndex;
                if (correto) {
                    p.corretos.add(msg.esquerdaIndex);
                    if (p.corretos.size >= CONJUNTO.pares.length) p.completoEmMs = Date.now() - estado.inicio;
                }
                depois(120, () => {
                    tratarMensagem({ type: 'resultadoTentativaPar', esquerdaIndex: msg.esquerdaIndex, direitaIndex: msg.direitaIndex, correto, completou: p.completoEmMs !== null });
                    if (todosTerminaram()) depois(1600, revelar);
                });
            } else if (msg.type === 'continuar') {
                confirmacao();
            }
        }

        function jogar() {
            timers.forEach(clearTimeout);
            timers = [];
            meuJogadorId = EU.id;
            document.documentElement.style.setProperty('--cor-jogador', EU.avatar.cor);
            for (const el of document.querySelectorAll('[data-identidade]')) {
                el.replaceChildren(criarEl('span', 'player-avatar', EU.avatar.emoji), criarEl('span', 'player-name', EU.nome));
            }
            const ordem = embaralhar(CONJUNTO.pares.map((_, i) => i));
            estado = {
                inicio: Date.now(),
                revelado: false,
                eu: { direitaEmbaralhadaIndices: ordem, corretos: new Set(), completoEmMs: null },
                outros: OUTROS.map(o => ({ ...o, corretos: 0, completoEmMs: null }))
            };
            for (const o of estado.outros) {
                depois(o.terminaEm ?? TEMPO_LIMITE_MS, () => {
                    o.corretos = o.pares;
                    if (o.terminaEm !== null) o.completoEmMs = o.terminaEm;
                    if (todosTerminaram()) revelar();
                });
            }
            depois(TEMPO_LIMITE_MS + 500, revelar);
            tratarMensagem({
                type: 'iniciarLinking',
                tema: CONJUNTO.tema,
                esquerda: CONJUNTO.pares.map(p => p.esquerda),
                direita: ordem.map(i => CONJUNTO.pares[i].direita),
                tempoLimiteMs: TEMPO_LIMITE_MS
            });
        }

        function resultadoDireto() {
            jogar();
            // como se você tivesse ligado 4 dos 5 pares
            [0, 1, 2, 3].forEach(i => {
                estado.eu.corretos.add(i);
                pares.push({ e: i, d: estado.eu.direitaEmbaralhadaIndices.indexOf(i), cor: CORES_PARES[i] });
            });
            for (const o of estado.outros) {
                o.corretos = o.pares;
                if (o.terminaEm !== null) o.completoEmMs = o.terminaEm;
            }
            revelar();
        }

        // Expõe para testes automáticos do protótipo
        window.__prototipo = { estado: () => estado, tocar };

        $('botao-repetir').addEventListener('click', jogar);
        $('botao-resultado').addEventListener('click', resultadoDireto);
        const params = new URLSearchParams(location.search);
        if (params.has('limpo')) $('barra-prototipo').classList.add('oculto');
        if (params.get('tela') === 'resultado') resultadoDireto(); else jogar();
    })();
    </script>
