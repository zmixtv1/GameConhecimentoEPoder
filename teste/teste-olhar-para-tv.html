<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle Mobile - Olhe para a TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-main: #0f172a;
            --text-muted: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mesmo tamanho e fundo das outras telas do controle */
        .mobile-screen {
            width: 751px;
            height: 336px;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            /* Nada aqui é clicável */
            pointer-events: none;
            touch-action: none;
        }

        .ambient-light {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: fluidMotion 20s infinite alternate ease-in-out;
        }

        .light-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: rgba(226, 232, 240, 0.8); }
        .light-2 { bottom: -20%; right: -10%; width: 350px; height: 350px; background: rgba(186, 230, 253, 0.5); animation-delay: -5s; }
        .light-3 { top: 30%; left: 30%; width: 250px; height: 250px; background: rgba(255, 255, 255, 0.9); animation-delay: -10s; }

        @keyframes fluidMotion {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(15px, 20px) scale(1.05); }
            66% { transform: translate(-15px, 10px) scale(0.95); }
            100% { transform: translate(25px, -15px) scale(1.02); }
        }

        .tv-icon {
            position: relative;
            z-index: 1;
            font-size: 64px;
            line-height: 1;
            filter: drop-shadow(0 8px 14px rgba(15, 23, 42, 0.18));
            animation: olhar 2.4s ease-in-out infinite;
        }

        .message {
            position: relative;
            z-index: 1;
            font-size: 64px;
            font-weight: 900;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
            text-align: center;
            text-shadow: 0 6px 20px rgba(255, 255, 255, 0.9);
        }

        /* Leve "chamada" para cima, como quem aponta para a TV */
        @keyframes olhar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .tv-icon, .ambient-light { animation: none; }
        }
    </style>
</head>

<body>

    <div class="mobile-screen" aria-live="polite">
        <div class="ambient-light light-1"></div>
        <div class="ambient-light light-2"></div>
        <div class="ambient-light light-3"></div>

        <div class="tv-icon" aria-hidden="true">📺</div>
        <h1 class="message">Olhe para a TV</h1>
    </div>

</body>

</html>
