<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Controle Mobile - Escolha de Poder</title>

    <!--
      PROPOSTA NOVA da tela `tela-escolha-poder` do celular (10 s).

      - 4 poderes por vez: os 3 de ataque (Congelamento, Mordicadores, Névoa)
        sempre aparecem, e o 4º é sorteado entre Escudo, Aposta e Festa de
        Pontos, só entre os que ainda estão disponíveis. O sorteio é
        invisível para o jogador: o 4º cartão aparece igual aos outros.
      - Poderes com limite mostram quantos usos restam; esgotado ou indisponível
        (Festa fora dos temas 2 e 4) nunca é sorteado. Se nenhum dos três
        estiver disponível, aparecem só os 3 de ataque.
      - Novo botão "Não usar poder", para não precisar esperar o tempo acabar.
      - Cabe sem rolar com o celular em pé (2×3) ou deitado (3×2).

      Para testar: a barra no rodapé troca o tema e os usos restantes.
      Abra com ?limpo para esconder a barra.
    -->

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: light;
            --text-main: #0f172a;
            --text-muted: #475569;
            --bg: #f8fafc;
            --vermelho: #ff4757;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 6px 14px rgba(0, 0, 0, 0.07);

            --cor-jogador: #1e90ff;
            --cor-poder: #1e90ff;

            --pad-t: max(8px, env(safe-area-inset-top));
            --pad-r: max(12px, env(safe-area-inset-right));
            --pad-b: max(8px, env(safe-area-inset-bottom));
            --pad-l: max(12px, env(safe-area-inset-left));

            --gap: clamp(6px, 2vmin, 12px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Outfit", system-ui, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html { height: 100%; }

        body {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l);
            background-color: var(--bg);
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        .oculto { display: none !important; }

        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: fluidMotion 20s infinite alternate ease-in-out;
        }
        .light-1 { top: -10%; left: -10%; width: 60vmax; height: 60vmax; background: rgba(226, 232, 240, 0.8); }
        .light-2 { bottom: -20%; right: -10%; width: 50vmax; height: 50vmax; background: rgba(186, 230, 253, 0.5); animation-delay: -5s; }
        .light-3 { top: 30%; left: 30%; width: 35vmax; height: 35vmax; background: rgba(255, 255, 255, 0.9); animation-delay: -10s; }
        @keyframes fluidMotion {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(15px, 20px) scale(1.05); }
            66% { transform: translate(-15px, 10px) scale(0.95); }
            100% { transform: translate(25px, -15px) scale(1.02); }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* ===================== ESTRUTURA ===================== */
        .tela {
            position: relative;
            z-index: 1;
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }

        .cabecalho { flex: none; display: flex; align-items: center; gap: 10px; }
        .cabecalho-texto { flex: 1; min-width: 0; text-align: center; }

        .player-identity {
            flex: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px 5px 8px;
            border-radius: 100px;
            max-width: 34%;
        }
        .player-avatar { font-size: clamp(20px, 6vmin, 26px); line-height: 1; }
        .player-name {
            font-size: clamp(12px, 3.6vmin, 15px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rotulo {
            font-size: clamp(10px, 3vmin, 13px);
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .titulo {
            font-size: clamp(16px, 5.4vmin, 24px);
            font-weight: 900;
            line-height: 1.15;
            transition: color .3s ease;
        }
        .titulo.confirmado { color: color-mix(in srgb, var(--cor-poder) 70%, #0f172a); }

        .timer {
            position: relative;
            flex: none;
            width: clamp(44px, 13vmin, 56px);
            height: clamp(44px, 13vmin, 56px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            transition: transform .2s ease;
        }
        .timer svg { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); transform: rotate(-90deg); }
        .anel-fundo { fill: none; stroke: rgba(255, 255, 255, 0.8); stroke-width: 9; }
        .anel { fill: none; stroke: var(--text-main); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 326.7; transition: stroke .3s ease; }
        .timer-numero { font-size: clamp(17px, 5.4vmin, 22px); font-weight: 900; font-variant-numeric: tabular-nums; }
        .timer.urgente { animation: pulso 1s ease-in-out infinite; border-color: var(--vermelho); }
        .timer.urgente .anel { stroke: var(--vermelho); }
        .timer.urgente .timer-numero { color: var(--vermelho); }
        @keyframes pulso { 50% { transform: scale(1.1); } }

        /* ===================== PODERES ===================== */
        .poder-tipos {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: var(--gap);
        }

        .poder-btn {
            --cor: #94a3b8;
            position: relative;
            min-height: 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(2px, 1vmin, 6px);
            padding: 6px 8px;
            border-radius: clamp(16px, 4.5vmin, 22px);
            border: 2px solid var(--glass-border);
            background:
                radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--cor) 22%, transparent), transparent 70%),
                var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--glass-shadow);
            color: var(--text-main);
            font: inherit;
            cursor: pointer;
            opacity: 0;
            animation: entrar .45s cubic-bezier(.34, 1.56, .64, 1) forwards;
            transition: transform .2s cubic-bezier(.34, 1.56, .64, 1), opacity .3s ease, filter .3s ease,
                        border-color .3s ease, box-shadow .3s ease;
        }
        @keyframes entrar {
            from { opacity: 0; transform: translateY(12px) scale(.92); }
            to   { opacity: 1; transform: none; }
        }
        .poder-btn:active:not(:disabled) { transform: scale(.95); }

        .poder-icone {
            font-size: var(--icone);
            line-height: 1;
            filter: drop-shadow(0 6px 10px color-mix(in srgb, var(--cor) 35%, transparent));
        }
        .poder-nome {
            max-width: 100%;
            font-size: var(--nome);
            font-weight: 900;
            line-height: 1.1;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* Só 3 cartões (nenhum especial disponível) */
        .poder-tipos.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); }
        @media (orientation: portrait) {
            .poder-tipos.tres { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(3, minmax(0, 1fr)); }
        }

        /* Usos restantes (só poderes com limite) */
        .poder-usos {
            position: absolute;
            top: 6px;
            right: 6px;
            padding: 1px 7px;
            border-radius: 100px;
            font-size: clamp(10px, 2.8vmin, 12px);
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            background: color-mix(in srgb, var(--cor) 18%, white);
            color: color-mix(in srgb, var(--cor) 65%, #0f172a);
            border: 1px solid color-mix(in srgb, var(--cor) 40%, white);
        }

        /* Escolhido / outros / indisponível */
        .poder-btn.selecionada {
            border: 3px solid var(--cor);
            background:
                radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--cor) 40%, transparent), color-mix(in srgb, var(--cor) 12%, transparent)),
                var(--glass-bg);
            box-shadow: 0 14px 30px color-mix(in srgb, var(--cor) 40%, transparent);
            transform: scale(1.04);
            z-index: 2;
        }
        .poder-btn.selecionada .poder-icone { animation: pular .5s cubic-bezier(.34, 1.8, .64, 1); }
        @keyframes pular { 40% { transform: translateY(-8px) scale(1.2) rotate(-8deg); } }

        .poder-btn.apagado { opacity: .38 !important; filter: grayscale(.85); }
        .poder-btn.indisponivel { opacity: .4 !important; filter: grayscale(1); cursor: default; }
        .poder-btn.indisponivel .poder-usos { background: rgba(15, 23, 42, .08); color: var(--text-muted); border-color: transparent; }
        .poder-btn:disabled { cursor: default; }

        /* Não usar poder */
        .rodape { flex: none; display: flex; justify-content: center; }
        .btn-pular {
            min-width: min(320px, 100%);
            padding: clamp(7px, 2.2vmin, 12px) 20px;
            border-radius: 100px;
            border: 2px solid rgba(71, 85, 105, .35);
            background: rgba(255, 255, 255, .55);
            color: var(--text-muted);
            font: inherit;
            font-size: clamp(13px, 3.8vmin, 16px);
            font-weight: 800;
            cursor: pointer;
            transition: transform .15s ease, opacity .3s ease;
        }
        .btn-pular:active:not(:disabled) { transform: scale(.96); }
        .btn-pular:disabled { opacity: .4; cursor: default; }
        .btn-pular.escolhido { opacity: 1; border-color: var(--text-muted); background: rgba(71, 85, 105, .12); color: var(--text-main); }

        /* ===================== DEITADO (padrão) ===================== */
        .poder-tipos { --icone: clamp(26px, 11vh, 52px); --nome: clamp(13px, 4.4vh, 20px); }

        /* ===================== EM PÉ ===================== */
        @media (orientation: portrait) {
            .cabecalho { flex-wrap: wrap; row-gap: 8px; }
            .cabecalho-texto { order: 3; flex-basis: 100%; }
            .player-identity { max-width: 70%; }
            .timer { margin-left: auto; }

            .poder-tipos {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: repeat(2, minmax(0, 1fr));
                max-height: 460px;
                margin: auto 0;
                --icone: clamp(32px, 6.4vh, 56px);
                --nome: clamp(15px, 2.6vh, 21px);
            }
            .btn-pular { width: 100%; }
        }

        @media (orientation: landscape) and (max-height: 340px) {
            :root { --gap: 6px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }

        /* ===== só deste protótipo, não existe no jogo ===== */
        .barra-prototipo {
            position: fixed; top: 6px; left: 50%; transform: translateX(-50%);
            z-index: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
            max-width: 96vw; padding: 5px 8px; border-radius: 10px;
            background: rgba(15, 23, 42, 0.88); color: #fff;
            font-size: 11px; font-weight: 700;
        }
        .barra-prototipo select, .barra-prototipo button {
            font: inherit; font-size: 11px; padding: 3px 6px; border-radius: 6px; border: 0;
        }
        .barra-prototipo button { background: #fff; color: #0f172a; font-weight: 800; cursor: pointer; }
    </style>
</head>

<body>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>
    <div class="ambient-light light-3"></div>

    <section id="tela-escolha-poder" class="tela">
        <header class="cabecalho">
            <div class="player-identity glass-panel" data-identidade></div>
            <div class="cabecalho-texto">
                <p class="rotulo" id="poder-rodada-rotulo"></p>
                <h2 class="titulo" id="poder-titulo">Escolha um poder</h2>
            </div>
            <div class="timer glass-panel" id="timer-poder">
                <svg viewBox="0 0 120 120">
                    <circle class="anel-fundo" cx="60" cy="60" r="52"></circle>
                    <circle class="anel" id="anel-poder" cx="60" cy="60" r="52"></circle>
                </svg>
                <span class="timer-numero" id="numero-poder"></span>
            </div>
        </header>

        <div class="poder-tipos" id="poder-tipos"></div>

        <div class="rodape">
            <button class="btn-pular" id="btn-pular" type="button">Não usar poder</button>
        </div>
    </section>

    <div class="barra-prototipo" id="barra-prototipo">
        <span>Protótipo:</span>
        <select id="proto-tema">
            <option value="2">Tema 2 (com Festa)</option>
            <option value="1">Tema 1 (sem Festa)</option>
        </select>
        <select id="proto-usos">
            <option value="cheio">Usos cheios</option>
            <option value="poucos">Poucos usos</option>
            <option value="esgotado">Escudo/Aposta esgotados</option>
        </select>
        <button id="botao-repetir" type="button">Repetir</button>
    </div>

    <script>
    (() => {
        'use strict';

        // ===================== DADOS =====================
        // Só ícone, nome e cor de cada poder (a mecânica fica no servidor)
        const POR_TIPO = {
            congelamento: { icone: '🧊', nome: 'Congelamento',    cor: '#38bdf8' },
            mordicadores: { icone: '😬', nome: 'Mordicadores',    cor: '#f59e0b' },
            nevoa:        { icone: '🌫️', nome: 'Névoa',           cor: '#64748b' },
            escudo:       { icone: '🛡️', nome: 'Escudo',          cor: '#6366f1' },
            aposta:       { icone: '🎲', nome: 'Aposta',          cor: '#10b981' },
            festa:        { icone: '🎉', nome: 'Festa de Pontos', cor: '#ec4899' }
        };
        const FIXOS = ['congelamento', 'mordicadores', 'nevoa'];      // sempre aparecem
        const ESPECIAIS = ['escudo', 'aposta', 'festa'];              // 1 é sorteado por pergunta
        const CIRCUNFERENCIA = 326.7;
        const TEMPO_ESCOLHA_PODER_MS = 10000; // tempoEscolhaPoderMs em server/sala.js

        const EU = { nome: 'Rodrigo', avatar: { emoji: '🐼', cor: '#1e90ff' } };

        // ===================== AUXILIARES =====================
        const $ = id => document.getElementById(id);
        function el(tag, classe, texto) {
            const e = document.createElement(tag);
            if (classe) e.className = classe;
            if (texto !== undefined) e.textContent = texto;
            return e;
        }

        const listaEl = $('poder-tipos');
        const tituloEl = $('poder-titulo');
        const pularEl = $('btn-pular');
        let escolhido = null;
        let intervaloTimer = null;

        function preencherIdentidade() {
            document.documentElement.style.setProperty('--cor-jogador', EU.avatar.cor);
            document.querySelectorAll('[data-identidade]').forEach(e => {
                e.replaceChildren(el('span', 'player-avatar', EU.avatar.emoji), el('span', 'player-name', EU.nome));
            });
        }

        function iniciarTimer(ms, aoAcabar) {
            clearInterval(intervaloTimer);
            const anel = $('anel-poder'), numero = $('numero-poder'), modulo = $('timer-poder');
            const inicio = Date.now();
            const atualizar = () => {
                const decorrido = Date.now() - inicio;
                const resta = Math.max(0, ms - decorrido);
                anel.style.strokeDashoffset = String(CIRCUNFERENCIA * Math.min(1, decorrido / ms));
                const s = Math.ceil(resta / 1000);
                numero.textContent = String(s);
                modulo.classList.toggle('urgente', s <= 3 && s > 0 && !escolhido);
                if (resta <= 0) { clearInterval(intervaloTimer); aoAcabar(); }
            };
            atualizar();
            intervaloTimer = setInterval(atualizar, 100);
        }

        // ===================== TELA =====================
        // disponibilidade[tipo] = { usos: número | null (ilimitado), motivo?: texto se indisponível }
        function criarCartao(tipo, disp, i) {
            const info = POR_TIPO[tipo];
            const btn = el('button', 'poder-btn');
            btn.type = 'button';
            btn.style.setProperty('--cor', info.cor);
            btn.style.animationDelay = `${i * 45}ms`;
            btn.dataset.tipo = tipo;

            btn.append(el('span', 'poder-icone', info.icone), el('span', 'poder-nome', info.nome));

            const indisponivel = !!disp.motivo || disp.usos === 0;
            if (disp.motivo) btn.append(el('span', 'poder-usos', disp.motivo));
            else if (disp.usos !== null) btn.append(el('span', 'poder-usos', disp.usos === 0 ? 'Esgotado' : `${disp.usos}x`));

            if (indisponivel) {
                btn.disabled = true;
                btn.classList.add('indisponivel');
            }
            btn.setAttribute('aria-label', info.nome + (disp.usos ? `, ${disp.usos} usos restantes` : '') + (indisponivel ? ', indisponível' : ''));
            btn.addEventListener('click', () => escolher(btn, tipo));
            return btn;
        }

        function travarTudo() {
            listaEl.querySelectorAll('.poder-btn').forEach(b => { b.disabled = true; });
            pularEl.disabled = true;
        }

        function escolher(btn, tipo) {
            if (escolhido) return;
            escolhido = tipo;
            const info = POR_TIPO[tipo];
            document.documentElement.style.setProperty('--cor-poder', info.cor);

            listaEl.querySelectorAll('.poder-btn').forEach(b => {
                if (b !== btn && !b.classList.contains('indisponivel')) b.classList.add('apagado');
            });
            btn.classList.add('selecionada');
            travarTudo();
            if (navigator.vibrate) navigator.vibrate(30);

            tituloEl.classList.add('confirmado');
            tituloEl.textContent = `${info.icone} ${info.nome}!`;

            // Aqui o controlador.js emite a escolha para o servidor (socket)
            console.log('Poder escolhido:', tipo);
        }

        function pular() {
            if (escolhido) return;
            escolhido = 'nenhum';
            listaEl.querySelectorAll('.poder-btn:not(.indisponivel)').forEach(b => b.classList.add('apagado'));
            travarTudo();
            pularEl.classList.add('escolhido');
            tituloEl.classList.remove('confirmado');
            tituloEl.textContent = 'Sem poder nesta pergunta';
            console.log('Poder escolhido: nenhum');
        }

        function tempoEsgotado() {
            if (escolhido) return;
            listaEl.querySelectorAll('.poder-btn:not(.indisponivel)').forEach(b => b.classList.add('apagado'));
            travarTudo();
            tituloEl.textContent = 'Tempo esgotado!';
        }

        function montar(disponibilidade, rotulo) {
            escolhido = null;
            preencherIdentidade();
            $('poder-rodada-rotulo').textContent = rotulo;
            tituloEl.classList.remove('confirmado');
            tituloEl.textContent = 'Escolha um poder';
            pularEl.disabled = false;
            pularEl.classList.remove('escolhido');

            // Sorteia o 4º poder só entre os especiais que ainda podem ser usados.
            // No jogo o ideal é o servidor sortear e mandar pronto (fica igual
            // se o jogador recarregar a página); aqui é sorteado no próprio celular.
            const disponiveis = ESPECIAIS.filter(t => {
                const d = disponibilidade[t];
                return d && !d.motivo && d.usos !== 0;
            });
            const sorteado = disponiveis.length
                ? disponiveis[Math.floor(Math.random() * disponiveis.length)]
                : null;

            const tipos = sorteado ? [...FIXOS, sorteado] : FIXOS;
            listaEl.classList.toggle('tres', !sorteado);
            listaEl.replaceChildren(...tipos.map((tipo, i) => criarCartao(tipo, disponibilidade[tipo], i)));
            iniciarTimer(TEMPO_ESCOLHA_PODER_MS, tempoEsgotado);
        }

        pularEl.addEventListener('click', pular);

        // ===== protótipo =====
        const params = new URLSearchParams(location.search);
        if (params.has('limpo')) $('barra-prototipo').classList.add('oculto');
        const protoTema = $('proto-tema'), protoUsos = $('proto-usos');

        function remontar() {
            const tema = Number(protoTema.value);
            const u = protoUsos.value;
            const pessoal = u === 'cheio' ? 3 : u === 'poucos' ? 1 : 0;
            const festaTema = tema === 2 || tema === 4;
            montar({
                congelamento: { usos: null },
                mordicadores: { usos: null },
                nevoa:        { usos: null },
                escudo:       { usos: pessoal },
                aposta:       { usos: pessoal },
                festa:        festaTema ? { usos: u === 'cheio' ? 2 : 1 } : { usos: 0, motivo: 'Temas 2 e 4' }
            }, `Rodada ${tema} de 4 — Pergunta 1 de 3`);
        }
        protoTema.addEventListener('change', remontar);
        protoUsos.addEventListener('change', remontar);
        $('botao-repetir').addEventListener('click', remontar);
        remontar();
    })();
    </script>
</body>

</html>
