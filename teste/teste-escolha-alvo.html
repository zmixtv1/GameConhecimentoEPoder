<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Controle Mobile - Escolha de Alvo</title>

    <!--
      PROPOSTA NOVA da tela `tela-escolha-alvo` do celular.

      - Cada alvo é um cartão com o animal (na cor do jogador), o nome e a
        posição/pontos no placar, ordenado do líder para baixo. Isso ajuda a
        decidir em quem usar o poder.
      - Cabe sem rolar de 1 a 8 alvos (sala de até 9), com o celular em pé ou
        deitado. O JS escolhe colunas/linhas pela orientação e pela quantidade;
        a última linha incompleta fica centralizada.
      - Ao tocar: o ícone do poder "voa" até o alvo, o cartão acende na cor do
        poder, os outros apagam e o título vira a confirmação.
      - Sem poder nesta pergunta: tela de espera com o aviso.

      Para testar: a barra no rodapé troca poder, quantidade de alvos e o estado
      "sem poder". Abra com ?limpo para esconder a barra.
    -->

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: light;
            --text-main: #0f172a;
            --text-muted: #475569;
            --bg: #f8fafc;
            --vermelho: #ff4757;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 6px 14px rgba(0, 0, 0, 0.07);

            --cor-jogador: #1e90ff;
            --cor-poder: #38bdf8;   /* trocada pelo JS conforme o poder */

            --pad-t: max(8px, env(safe-area-inset-top));
            --pad-r: max(12px, env(safe-area-inset-right));
            --pad-b: max(8px, env(safe-area-inset-bottom));
            --pad-l: max(12px, env(safe-area-inset-left));

            --gap: clamp(6px, 2vmin, 12px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Outfit", system-ui, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html { height: 100%; }

        body {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l);
            background-color: var(--bg);
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        .oculto { display: none !important; }

        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: fluidMotion 20s infinite alternate ease-in-out;
        }
        .light-1 { top: -10%; left: -10%; width: 60vmax; height: 60vmax; background: rgba(226, 232, 240, 0.8); }
        .light-2 { bottom: -20%; right: -10%; width: 50vmax; height: 50vmax; background: rgba(186, 230, 253, 0.5); animation-delay: -5s; }
        .light-3 { top: 30%; left: 30%; width: 35vmax; height: 35vmax; background: rgba(255, 255, 255, 0.9); animation-delay: -10s; }
        @keyframes fluidMotion {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(15px, 20px) scale(1.05); }
            66% { transform: translate(-15px, 10px) scale(0.95); }
            100% { transform: translate(25px, -15px) scale(1.02); }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* ===================== ESTRUTURA ===================== */
        .tela {
            position: relative;
            z-index: 1;
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }

        .cabecalho {
            flex: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cabecalho-texto { flex: 1; min-width: 0; text-align: center; }

        .player-identity {
            flex: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px 5px 8px;
            border-radius: 100px;
            max-width: 34%;
        }
        .player-avatar { font-size: clamp(20px, 6vmin, 26px); line-height: 1; }
        .player-name {
            font-size: clamp(12px, 3.6vmin, 15px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .titulo {
            font-size: clamp(16px, 5.4vmin, 24px);
            font-weight: 900;
            line-height: 1.15;
            transition: color .3s ease;
        }
        .titulo.confirmado { color: color-mix(in srgb, var(--cor-poder) 70%, #0f172a); }

        /* "🧊 Congelamento" destacado dentro do título */
        .poder-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 1px 10px 2px 6px;
            margin: 0 2px;
            border-radius: 100px;
            background: color-mix(in srgb, var(--cor-poder) 20%, white);
            border: 2px solid color-mix(in srgb, var(--cor-poder) 55%, white);
            color: color-mix(in srgb, var(--cor-poder) 60%, #0f172a);
            white-space: nowrap;
            vertical-align: middle;
        }
        .poder-icone { display: inline-block; font-size: 1.1em; }

        .subtitulo {
            margin-top: 2px;
            font-size: clamp(11px, 3.2vmin, 14px);
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Timer */
        .timer {
            position: relative;
            flex: none;
            width: clamp(44px, 13vmin, 56px);
            height: clamp(44px, 13vmin, 56px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            transition: transform .2s ease;
        }
        .timer svg { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); transform: rotate(-90deg); }
        .anel-fundo { fill: none; stroke: rgba(255, 255, 255, 0.8); stroke-width: 9; }
        .anel { fill: none; stroke: var(--text-main); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 326.7; transition: stroke .3s ease; }
        .timer-numero { font-size: clamp(17px, 5.4vmin, 22px); font-weight: 900; font-variant-numeric: tabular-nums; }
        .timer.urgente { animation: pulso 1s ease-in-out infinite; border-color: var(--vermelho); }
        .timer.urgente .anel { stroke: var(--vermelho); }
        .timer.urgente .timer-numero { color: var(--vermelho); }
        @keyframes pulso { 50% { transform: scale(1.1); } }

        .corpo {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* ===================== ALVOS ===================== */
        /* Grade com colunas "duplas": cada cartão ocupa 2, o que permite
           centralizar a última linha incompleta deslocando meia coluna. */
        .poder-alvos {
            --colunas: 4;
            --linhas: 2;
            --card-max: 150px;
            flex: 1;
            min-height: 0;
            width: 100%;
            max-height: calc(var(--linhas) * var(--card-max) + (var(--linhas) - 1) * var(--gap));
            margin: auto 0;
            display: grid;
            grid-template-columns: repeat(calc(var(--colunas) * 2), minmax(0, 1fr));
            grid-template-rows: repeat(var(--linhas), minmax(0, 1fr));
            gap: var(--gap);
        }

        .poder-alvo-btn {
            --cor-alvo: #94a3b8;
            position: relative;
            grid-column: span 2;
            min-height: 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(2px, 1vmin, 6px);
            padding: 6px 8px;
            border-radius: clamp(16px, 4.5vmin, 22px);
            border: 2px solid var(--glass-border);
            background:
                linear-gradient(180deg, color-mix(in srgb, var(--cor-alvo) 14%, transparent), transparent 70%),
                var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--glass-shadow);
            color: var(--text-main);
            cursor: pointer;
            opacity: 0;
            animation: entrar .45s cubic-bezier(.34, 1.56, .64, 1) forwards;
            transition: transform .2s cubic-bezier(.34, 1.56, .64, 1), opacity .3s ease, filter .3s ease,
                        border-color .3s ease, box-shadow .3s ease;
        }
        @keyframes entrar {
            from { opacity: 0; transform: translateY(12px) scale(.92); }
            to   { opacity: 1; transform: none; }
        }
        .poder-alvo-btn:active:not(:disabled) { transform: scale(.95); }

        .alvo-avatar {
            position: relative;
            flex: none;
            width: var(--avatar);
            height: var(--avatar);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: calc(var(--avatar) * 0.58);
            line-height: 1;
            background: color-mix(in srgb, var(--cor-alvo) 24%, white);
            border: 2px solid color-mix(in srgb, var(--cor-alvo) 55%, white);
            box-shadow: 0 4px 10px color-mix(in srgb, var(--cor-alvo) 25%, transparent);
        }

        .alvo-coroa {
            position: absolute;
            top: -0.55em;
            right: -0.25em;
            font-size: .42em;
            transform: rotate(18deg);
        }

        /* Ícone do poder que pousa no alvo escolhido */
        .alvo-efeito {
            position: absolute;
            right: -0.3em;
            bottom: -0.3em;
            font-size: .55em;
            transform: scale(0);
            filter: drop-shadow(0 3px 5px rgba(15, 23, 42, .3));
        }

        .alvo-info { display: flex; flex-direction: column; align-items: center; min-width: 0; max-width: 100%; }
        .alvo-nome {
            max-width: 100%;
            font-size: var(--nome);
            font-weight: 900;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .alvo-pontos {
            font-size: calc(var(--nome) * 0.68);
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* Escolhido / não escolhidos */
        .poder-alvo-btn.selecionada {
            border: 3px solid var(--cor-poder);
            background:
                linear-gradient(180deg, color-mix(in srgb, var(--cor-poder) 28%, transparent), color-mix(in srgb, var(--cor-poder) 10%, transparent)),
                var(--glass-bg);
            box-shadow: 0 14px 30px color-mix(in srgb, var(--cor-poder) 40%, transparent);
            transform: scale(1.04);
            z-index: 2;
        }
        .poder-alvo-btn.selecionada .alvo-efeito { animation: pousar .5s cubic-bezier(.34, 1.8, .64, 1) forwards; }
        .poder-alvo-btn.selecionada .alvo-avatar { animation: tremer .4s ease .1s; }
        .poder-alvo-btn.apagado { opacity: .38 !important; filter: grayscale(.85); }
        .poder-alvo-btn:disabled { cursor: default; }

        @keyframes pousar { to { transform: scale(1); } }
        @keyframes tremer {
            25% { transform: translateX(-3px) rotate(-6deg); }
            50% { transform: translateX(3px) rotate(6deg); }
            75% { transform: translateX(-2px) rotate(-3deg); }
        }

        /* Ícone voando do título até o alvo */
        .voo {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            pointer-events: none;
            line-height: 1;
            filter: drop-shadow(0 6px 10px rgba(15, 23, 42, .3));
        }

        /* ===================== DEITADO (padrão) ===================== */
        .poder-alvos { --avatar: clamp(30px, 12vh, 58px); --nome: clamp(13px, 4.4vh, 20px); }

        /* ===================== EM PÉ ===================== */
        @media (orientation: portrait) {
            .cabecalho { flex-wrap: wrap; row-gap: 8px; }
            .cabecalho-texto { order: 3; flex-basis: 100%; }
            .player-identity { max-width: 70%; }
            .timer { margin-left: auto; }

            .poder-alvos { --card-max: 150px; --avatar: clamp(38px, 7vh, 64px); --nome: clamp(15px, 2.7vh, 21px); }

            /* Com uma coluna só (até 3 alvos) o cartão fica deitado: avatar à esquerda */
            .poder-alvos.uma-coluna { --card-max: 120px; }
            .poder-alvos.uma-coluna .poder-alvo-btn {
                flex-direction: row;
                justify-content: flex-start;
                gap: 14px;
                padding: 6px 18px;
            }
            .poder-alvos.uma-coluna .alvo-info { align-items: flex-start; flex: 1; }
        }

        /* Celulares deitados bem baixos (≤ 340px de altura) */
        @media (orientation: landscape) and (max-height: 340px) {
            :root { --gap: 6px; }
            .subtitulo { display: none; }
        }

        /* ===================== SEM PODER ===================== */
        .sem-poder {
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
        }
        .sem-poder-icone { font-size: clamp(40px, 16vmin, 72px); line-height: 1; animation: balancar 2.6s ease-in-out infinite; }
        .sem-poder-titulo { font-size: clamp(18px, 6vmin, 28px); font-weight: 900; }
        .sem-poder-texto { font-size: clamp(13px, 4vmin, 17px); font-weight: 700; color: var(--text-muted); }
        @keyframes balancar { 50% { transform: rotate(-8deg) translateY(-4px); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }

        /* ===== só deste protótipo, não existe no jogo ===== */
        .barra-prototipo {
            position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%);
            z-index: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
            max-width: 96vw; padding: 5px 8px; border-radius: 10px;
            background: rgba(15, 23, 42, 0.88); color: #fff;
            font-size: 11px; font-weight: 700;
        }
        .barra-prototipo select, .barra-prototipo button {
            font: inherit; font-size: 11px; padding: 3px 6px; border-radius: 6px; border: 0;
        }
        .barra-prototipo button { background: #fff; color: #0f172a; font-weight: 800; cursor: pointer; }
    </style>
</head>

<body>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>
    <div class="ambient-light light-3"></div>

    <section id="tela-escolha-alvo" class="tela">
        <header class="cabecalho">
            <div class="player-identity glass-panel" data-identidade></div>
            <div class="cabecalho-texto">
                <h2 class="titulo" id="alvo-titulo"></h2>
                <p class="subtitulo" id="alvo-subtitulo"></p>
            </div>
            <div class="timer glass-panel" id="timer-alvo">
                <svg viewBox="0 0 120 120">
                    <circle class="anel-fundo" cx="60" cy="60" r="52"></circle>
                    <circle class="anel" id="anel-alvo" cx="60" cy="60" r="52"></circle>
                </svg>
                <span class="timer-numero" id="numero-alvo"></span>
            </div>
        </header>

        <div class="corpo">
            <div class="poder-alvos" id="alvo-lista"></div>

            <div class="sem-poder oculto" id="sem-poder">
                <span class="sem-poder-icone">🤷</span>
                <p class="sem-poder-titulo">Você não tem poder nesta pergunta</p>
                <p class="sem-poder-texto">Aguarde os outros escolherem o alvo…</p>
            </div>
        </div>
    </section>

    <div class="barra-prototipo" id="barra-prototipo">
        <span>Protótipo:</span>
        <select id="proto-poder">
            <option value="congelamento">🧊 Congelamento</option>
            <option value="mordicadores">😬 Mordicadores</option>
            <option value="nevoa">🌫️ Névoa</option>
            <option value="aposta">🎲 Aposta</option>
            <option value="">Sem poder</option>
        </select>
        <select id="proto-qtd">
            <option value="8">8 alvos</option><option value="7">7</option><option value="6">6</option><option value="5">5</option>
            <option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option>
        </select>
        <button id="botao-repetir" type="button">Repetir</button>
    </div>

    <script>
    (() => {
        'use strict';

        // ===================== DADOS =====================
        // cor = cor de destaque do poder no cartão escolhido
        const POR_TIPO = {
            // Só os poderes que precisam de alvo (Escudo e Festa de Pontos não passam por aqui)
            congelamento: { icone: '🧊', nome: 'Congelamento', cor: '#38bdf8' },
            mordicadores: { icone: '😬', nome: 'Mordicadores', cor: '#f59e0b' },
            nevoa:        { icone: '🌫️', nome: 'Névoa',        cor: '#64748b' },
            aposta:       { icone: '🎲', nome: 'Aposta',       cor: '#10b981', aFavor: true }
        };
        const CIRCUNFERENCIA = 326.7;
        const TEMPO_ESCOLHA_ALVO_MS = 20000; // tempoEscolhaAlvoMs em server/sala.js

        const EU = { id: '2', nome: 'Rodrigo', pontos: 1355, avatar: { emoji: '🐼', cor: '#1e90ff' } };

        // Outros jogadores da sala (máx. 8). Pontos servem para mostrar a posição.
        const OUTROS = [
            { id: '1', nome: 'Vítoria',   pontos: 1480, avatar: { emoji: '🦊', cor: '#ff4757' } },
            { id: '3', nome: 'Cecília',   pontos: 1290, avatar: { emoji: '🐸', cor: '#2ed573' } },
            { id: '4', nome: 'Adamor',    pontos: 1290, avatar: { emoji: '🦁', cor: '#ffa502' } },
            { id: '5', nome: 'Catarina',  pontos: 1105, avatar: { emoji: '🦄', cor: '#9b59b6' } },
            { id: '6', nome: 'Guilherme', pontos:  980, avatar: { emoji: '🐧', cor: '#00d2d3' } },
            { id: '7', nome: 'Mônica',    pontos:  845, avatar: { emoji: '🐙', cor: '#ff6b81' } },
            { id: '8', nome: 'Luciana',   pontos:  720, avatar: { emoji: '🐯', cor: '#ff7f50' } },
            { id: '2', nome: 'Rodrigo',   pontos: 1355, avatar: { emoji: '🐼', cor: '#1e90ff' } }
        ];

        // ===================== AUXILIARES =====================
        const $ = id => document.getElementById(id);
        function el(tag, classe, texto) {
            const e = document.createElement(tag);
            if (classe) e.className = classe;
            if (texto !== undefined) e.textContent = texto;
            return e;
        }

        const listaEl = $('alvo-lista');
        const tituloEl = $('alvo-titulo');
        const subtituloEl = $('alvo-subtitulo');
        let escolhido = null;
        let intervaloTimer = null;

        function preencherIdentidade() {
            document.documentElement.style.setProperty('--cor-jogador', EU.avatar.cor);
            document.querySelectorAll('[data-identidade]').forEach(e => {
                e.replaceChildren(el('span', 'player-avatar', EU.avatar.emoji), el('span', 'player-name', EU.nome));
            });
        }

        function iniciarTimer(ms, aoAcabar) {
            clearInterval(intervaloTimer);
            const anel = $('anel-alvo'), numero = $('numero-alvo'), modulo = $('timer-alvo');
            const inicio = Date.now();
            const atualizar = () => {
                const decorrido = Date.now() - inicio;
                const resta = Math.max(0, ms - decorrido);
                anel.style.strokeDashoffset = String(CIRCUNFERENCIA * Math.min(1, decorrido / ms));
                const s = Math.ceil(resta / 1000);
                numero.textContent = String(s);
                modulo.classList.toggle('urgente', s <= 3 && s > 0 && !escolhido);
                if (resta <= 0) { clearInterval(intervaloTimer); aoAcabar(); }
            };
            atualizar();
            intervaloTimer = setInterval(atualizar, 100);
        }

        // Colunas/linhas pela orientação e quantidade (sempre cabe sem rolar)
        function ajustarGrade() {
            const cards = [...listaEl.children];
            const n = cards.length;
            if (!n) return;
            const emPe = matchMedia('(orientation: portrait)').matches;
            const colunas = emPe ? (n <= 3 ? 1 : 2) : (n <= 4 ? n : Math.ceil(n / 2));
            const linhas = Math.ceil(n / colunas);
            listaEl.style.setProperty('--colunas', colunas);
            listaEl.style.setProperty('--linhas', linhas);

            // Centraliza a última linha incompleta
            const resto = n % colunas;
            cards.forEach(c => (c.style.gridColumn = ''));
            if (resto) cards[n - resto].style.gridColumn = `${colunas - resto + 1} / span 2`;

            // Cartão deitado (avatar ao lado do nome) só quando há uma coluna só
            listaEl.classList.toggle('uma-coluna', colunas === 1);
        }

        // ===================== TELA =====================
        function montarTitulo(info) {
            tituloEl.classList.remove('confirmado');
            const chip = el('span', 'poder-chip');
            chip.id = 'poder-chip';
            chip.append(el('span', 'poder-icone', info.icone), document.createTextNode(info.nome));
            if (info.aFavor) {
                tituloEl.replaceChildren('Fazer ', chip, ' em quem?');
                subtituloEl.textContent = 'Se acertar, você ganha +75';
            } else {
                tituloEl.replaceChildren('Usar ', chip, ' em quem?');
                subtituloEl.textContent = 'Toque em um jogador';
            }
        }

        function criarCartao(alvo, posicao, info) {
            const btn = el('button', 'poder-alvo-btn');
            btn.type = 'button';
            btn.style.setProperty('--cor-alvo', alvo.avatar.cor);

            const av = el('span', 'alvo-avatar', alvo.avatar.emoji);
            if (posicao === 1) av.append(el('span', 'alvo-coroa', '👑'));
            av.append(el('span', 'alvo-efeito', info.icone));

            const infoEl = el('span', 'alvo-info');
            infoEl.append(
                el('span', 'alvo-nome', alvo.nome),
                el('span', 'alvo-pontos', `${posicao}º · ${alvo.pontos} pts`)
            );

            btn.append(av, infoEl);
            btn.setAttribute('aria-label', `${alvo.nome}, ${posicao}º lugar, ${alvo.pontos} pontos`);
            btn.addEventListener('click', () => escolher(btn, alvo, info));
            return btn;
        }

        function escolher(btn, alvo, info) {
            if (escolhido) return;
            escolhido = alvo;

            listaEl.querySelectorAll('.poder-alvo-btn').forEach(b => {
                b.disabled = true;
                if (b !== btn) b.classList.add('apagado');
            });
            btn.classList.add('selecionada');
            if (navigator.vibrate) navigator.vibrate(30);

            voarIcone(info.icone, $('poder-chip'), btn.querySelector('.alvo-avatar'));

            tituloEl.classList.add('confirmado');
            if (info.aFavor) {
                tituloEl.replaceChildren(`${info.icone} Você apostou em ${alvo.nome}!`);
                subtituloEl.textContent = 'Se acertar, você ganha +75';
            } else {
                tituloEl.replaceChildren(`${info.icone} ${info.nome} vai para ${alvo.nome}!`);
                subtituloEl.textContent = 'Olhe para a TV';
            }

            // Aqui o controlador.js emite a escolha para o servidor (socket)
            console.log('Alvo escolhido:', alvo.id, alvo.nome, 'poder:', info.nome);
        }

        // Ícone sai do chip do título e cai em arco no avatar do alvo
        function voarIcone(icone, origemEl, destinoEl) {
            if (!origemEl || !destinoEl) return;
            const o = origemEl.getBoundingClientRect();
            const d = destinoEl.getBoundingClientRect();
            const voo = el('span', 'voo', icone);
            const tam = Math.max(22, d.height * 0.5);
            voo.style.fontSize = `${tam}px`;
            document.body.append(voo);

            const x0 = o.left + o.width / 2 - tam / 2, y0 = o.top + o.height / 2 - tam / 2;
            const x1 = d.left + d.width / 2 - tam / 2, y1 = d.top + d.height / 2 - tam / 2;
            const arco = Math.min(120, Math.abs(x1 - x0) * 0.3 + 40);
            const frames = [];
            for (let i = 0; i <= 10; i++) {
                const t = i / 10;
                const x = x0 + (x1 - x0) * t;
                const y = y0 + (y1 - y0) * t - Math.sin(Math.PI * t) * arco;
                frames.push({ transform: `translate(${x}px, ${y}px) rotate(${t * 360}deg) scale(${1 + Math.sin(Math.PI * t) * 0.4})`, opacity: t > .9 ? 0 : 1 });
            }
            voo.animate(frames, { duration: 480, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }).onfinish = () => voo.remove();
        }

        function tempoEsgotado() {
            if (escolhido) return;
            listaEl.querySelectorAll('.poder-alvo-btn').forEach(b => { b.disabled = true; b.classList.add('apagado'); });
            tituloEl.replaceChildren('Tempo esgotado!');
            subtituloEl.textContent = 'O poder não foi usado nesta pergunta';
        }

        function montar(poder, qtd) {
            escolhido = null;
            preencherIdentidade();
            listaEl.replaceChildren();

            const info = POR_TIPO[poder];
            const semPoder = !info;
            $('sem-poder').classList.toggle('oculto', !semPoder);
            listaEl.classList.toggle('oculto', semPoder);

            if (semPoder) {
                tituloEl.replaceChildren('Escolha de alvo');
                subtituloEl.textContent = '';
                iniciarTimer(TEMPO_ESCOLHA_ALVO_MS, () => {});
                return;
            }

            document.documentElement.style.setProperty('--cor-poder', info.cor);
            montarTitulo(info);

            // Posição considera a sala toda (inclusive eu), com empate
            const sala = OUTROS.some(j => j.id === EU.id) ? OUTROS : [EU, ...OUTROS];
            const alvos = OUTROS.slice(0, qtd).sort((a, b) => b.pontos - a.pontos || a.nome.localeCompare(b.nome));
            alvos.forEach((alvo, i) => {
                const posicao = sala.filter(j => j.pontos > alvo.pontos).length + 1;
                const card = criarCartao(alvo, posicao, info);
                card.style.animationDelay = `${i * 45}ms`;
                listaEl.append(card);
            });

            ajustarGrade();
            iniciarTimer(TEMPO_ESCOLHA_ALVO_MS, tempoEsgotado);
        }

        // Reorganiza ao girar o celular
        matchMedia('(orientation: portrait)').addEventListener('change', ajustarGrade);
        window.addEventListener('resize', ajustarGrade);

        // ===== protótipo =====
        const params = new URLSearchParams(location.search);
        if (params.has('limpo')) $('barra-prototipo').classList.add('oculto');
        const protoPoder = $('proto-poder'), protoQtd = $('proto-qtd');
        if (params.has('poder')) protoPoder.value = params.get('poder');
        if (params.has('qtd')) protoQtd.value = params.get('qtd');
        const remontar = () => montar(protoPoder.value, Number(protoQtd.value));
        protoPoder.addEventListener('change', remontar);
        protoQtd.addEventListener('change', remontar);
        $('botao-repetir').addEventListener('click', remontar);
        remontar();
    })();
    </script>
</body>
