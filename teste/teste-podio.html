<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz TV - Pódio final</title>

    <!--
      Última tela da partida, depois que alguém chega ao topo da Pirâmide.

      REGRA DE CLASSIFICAÇÃO (decisão de design do finale):
        1º lugar     = quem chegou ao topo da Pirâmide. Só isso.
        2º em diante = pelo andar alcançado; empate no mesmo andar é
                       desempatado pelos pontos das rodadas.

      A TV mostra SÓ o pódio. O placar das rodadas e a explicação da virada
      ficam para os celulares.

      Escala de andares igual à tela "Pontos viram andares":
        0 = chão (largada mínima), 1 a 8 = andares, 8 = topo.

      Sequência: 3º sobe → 2º sobe → rufar → campeão sobe com coroa e confete →
      título "venceu!" → 4º em diante.

      Barra do protótipo: troca entre "Virada" e "Líder confirma". ?limpo esconde.
    -->

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: light;
            --ink: #0f172a;
            --ink-soft: #475569;
            --verde: #15a356;
            --ouro: #f5b301;
            --glass-bg: rgba(255, 255, 255, 0.68);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 14px 30px rgba(0, 0, 0, 0.07);
            font-family: "Outfit", system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: center;
            color: var(--ink);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: clamp(8px, 2vh, 24px);
            padding: clamp(12px, 2.6vh, 34px) clamp(16px, 3vw, 56px);
            position: relative;
        }

        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            animation: fluidMotion 20s infinite alternate ease-in-out;
        }

        .light-1 {
            top: -10%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            background: rgba(226, 232, 240, 0.8);
        }

        .light-2 {
            bottom: -20%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: rgba(186, 230, 253, 0.4);
            animation-delay: -5s;
        }

        .light-3 {
            top: 20%;
            left: 25%;
            width: 40vw;
            height: 40vw;
            background: rgba(255, 244, 200, 0.7);
            animation-delay: -10s;
        }

        @keyframes fluidMotion {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(5vw, 10vh) scale(1.1);
            }

            66% {
                transform: translate(-5vw, 5vh) scale(0.9);
            }

            100% {
                transform: translate(10vw, -5vh) scale(1.05);
            }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        header,
        main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1760px;
            margin: 0 auto;
        }

        /* ===================== CABEÇALHO ===================== */
        header {
            text-align: center;
        }

        .rotulo {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 100px;
            font-size: clamp(11px, 1.6vh, 18px);
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        h1 {
            margin-top: clamp(4px, .8vh, 10px);
            min-height: 1.05em;
            font-size: clamp(28px, 5.8vh, 70px);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -1px;
        }

        h1 .nome-campeao {
            color: #c58b00;
        }

        h1.revelado {
            animation: titulo .6s cubic-bezier(.2, .9, .3, 1.3);
        }

        @keyframes titulo {
            from {
                opacity: 0;
                transform: scale(.85) translateY(10px);
            }
        }

        .subtitulo {
            margin-top: 4px;
            min-height: 1.2em;
            font-size: clamp(14px, 2.2vh, 26px);
            font-weight: 700;
            color: var(--ink-soft);
        }

        /* ===================== CORPO ===================== */
        main {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            max-width: 1320px;
            gap: clamp(14px, 2.4vw, 44px);
        }

        .secao-titulo {
            margin-bottom: clamp(6px, 1vh, 12px);
            font-size: clamp(11px, 1.55vh, 18px);
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        /* ---------- Pódio ---------- */
        .lado-podio {
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .podio {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            align-items: end;
            gap: clamp(8px, 1.4vw, 22px);
            padding: 0 clamp(0px, 2vw, 40px);
        }

        .degrau {
            --cor: #94a3b8;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
        }

        .degrau .bicho {
            position: relative;
            font-size: clamp(36px, 10.5vh, 124px);
            line-height: 1;
            filter: drop-shadow(0 10px 12px rgba(15, 23, 42, .25));
            opacity: 0;
            transform: translateY(-40vh);
        }

        .degrau.primeiro .bicho {
            font-size: clamp(48px, 14vh, 168px);
        }

        .degrau.revelado .bicho {
            animation: cair .7s cubic-bezier(.3, 1.4, .5, 1) forwards;
        }

        .degrau.primeiro.festa .bicho {
            animation: cair .7s cubic-bezier(.3, 1.4, .5, 1) forwards, comemorar 1.1s ease-in-out .8s infinite;
        }

        @keyframes cair {
            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes comemorar {

            0%,
            100% {
                transform: translateY(0) rotate(0);
            }

            25% {
                transform: translateY(-14%) rotate(-8deg);
            }

            50% {
                transform: translateY(0) rotate(0);
            }

            75% {
                transform: translateY(-10%) rotate(8deg);
            }
        }

        /* Raios de luz atrás do campeão */
        .raios {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 260%;
            aspect-ratio: 1;
            transform: translate(-50%, -50%);
            z-index: -1;
            border-radius: 50%;
            background: repeating-conic-gradient(rgba(245, 179, 1, .28) 0 10deg, transparent 10deg 22deg);
            -webkit-mask: radial-gradient(closest-side, #000 30%, transparent 100%);
            mask: radial-gradient(closest-side, #000 30%, transparent 100%);
            opacity: 0;
            transition: opacity .6s ease;
        }

        .degrau.festa .raios {
            opacity: 1;
            animation: girar 14s linear infinite;
        }

        @keyframes girar {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .coroa {
            position: absolute;
            left: 50%;
            top: -0.42em;
            font-size: .42em;
            transform: translateX(-50%) translateY(-30vh) rotate(0deg);
            opacity: 0;
        }

        .degrau.festa .coroa {
            animation: coroa .6s cubic-bezier(.3, 1.6, .5, 1) .25s forwards;
        }

        @keyframes coroa {
            to {
                opacity: 1;
                transform: translateX(-50%) rotate(0deg);
            }
        }

        .degrau .nome {
            margin-top: clamp(4px, .8vh, 10px);
            max-width: 100%;
            font-size: clamp(16px, 3vh, 36px);
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transition: opacity .4s ease .35s;
        }

        .degrau.primeiro .nome {
            font-size: clamp(19px, 3.8vh, 44px);
        }

        .degrau.revelado .nome {
            opacity: 1;
        }

        .bloco {
            position: relative;
            width: 100%;
            height: 0;
            margin-top: clamp(4px, .8vh, 10px);
            border-radius: clamp(12px, 1.8vh, 22px) clamp(12px, 1.8vh, 22px) 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 2px;
            padding-top: clamp(8px, 1.6vh, 20px);
            overflow: hidden;
            color: #fff;
            background: linear-gradient(180deg, color-mix(in srgb, var(--cor) 80%, white), var(--cor) 45%, color-mix(in srgb, var(--cor) 80%, black));
            box-shadow: inset 0 3px 0 rgba(255, 255, 255, .55), 0 18px 40px color-mix(in srgb, var(--cor) 35%, transparent);
            transition: height .8s cubic-bezier(.2, .9, .3, 1.05);
        }

        .degrau.primeiro {
            --cor: #f5b301;
        }

        .degrau.segundo {
            --cor: #94a3b8;
        }

        .degrau.terceiro {
            --cor: #cd8a4f;
        }

        .degrau.primeiro.subiu .bloco {
            height: clamp(90px, 32vh, 380px);
        }

        .degrau.segundo.subiu .bloco {
            height: clamp(64px, 23vh, 270px);
        }

        .degrau.terceiro.subiu .bloco {
            height: clamp(46px, 16.5vh, 200px);
        }

        .bloco .posicao {
            font-size: clamp(26px, 6.4vh, 76px);
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 3px 10px rgba(0, 0, 0, .18);
        }

        .degrau.primeiro .bloco {
            color: #4a3500;
        }

        .degrau.primeiro .bloco .posicao {
            text-shadow: 0 3px 10px rgba(255, 255, 255, .5);
        }

        .bloco .detalhe {
            font-size: clamp(12px, 2vh, 24px);
            font-weight: 800;
            opacity: .95;
            white-space: nowrap;
        }

        .bloco .desempate {
            margin-top: clamp(2px, .6vh, 8px);
            padding: 2px 10px;
            border-radius: 100px;
            background: rgba(255, 255, 255, .28);
            font-size: clamp(10px, 1.45vh, 17px);
            font-weight: 800;
            white-space: nowrap;
        }

        /* ---------- 4º em diante ---------- */
        .restantes {
            list-style: none;
            margin-top: clamp(8px, 1.6vh, 20px);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
            gap: clamp(6px, .8vw, 12px);
        }

        .restantes li {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: clamp(4px, .5vw, 8px);
            padding: clamp(7px, 1.3vh, 16px) clamp(8px, .8vw, 16px);
            border-radius: clamp(12px, 1.8vh, 20px);
            opacity: 0;
            transform: translateY(14px);
            transition: opacity .4s ease, transform .4s ease;
        }

        .restantes li.visivel {
            opacity: 1;
            transform: none;
        }

        .restantes .pos {
            font-weight: 900;
            color: var(--ink-soft);
            font-size: clamp(13px, 2vh, 24px);
        }

        .restantes .bicho-mini {
            flex: none;
            font-size: clamp(19px, 3.6vh, 44px);
            line-height: 1;
        }

        .restantes .info {
            min-width: 0;
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .restantes .nome {
            font-weight: 900;
            font-size: clamp(14px, 2.4vh, 29px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .restantes .onde {
            font-weight: 700;
            font-size: clamp(11px, 1.8vh, 22px);
            color: var(--ink-soft);
            white-space: nowrap;
        }

        /* ---------- Confete ---------- */
        #confete {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }

        /* Telas estreitas */
        @media (max-width: 900px) {
            body {
                overflow-y: auto;
                height: auto;
                min-height: 100dvh;
            }

            main {
                grid-template-columns: 1fr;
            }

            .podio {
                min-height: 52vh;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }

        /* ===== só deste protótipo, não existe no jogo ===== */
        .barra-prototipo {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.88);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }

        .barra-prototipo select,
        .barra-prototipo button {
            font: inherit;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 0;
        }

        .barra-prototipo button {
            background: #fff;
            color: #0f172a;
            font-weight: 800;
            cursor: pointer;
        }

        .oculto {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>
    <div class="ambient-light light-3"></div>

    <header>
        <span class="rotulo glass-panel" id="rotulo">Fim de jogo</span>
        <h1 id="titulo">E o campeão é…</h1>
        <p class="subtitulo" id="subtitulo">Quem chega ao topo da Pirâmide primeiro vence</p>
    </header>

    <main>
        <section class="lado-podio">
            <div class="podio" id="podio"></div>
            <ol class="restantes" id="restantes"></ol>
        </section>

    </main>

    <canvas id="confete"></canvas>

    <div class="barra-prototipo" id="barra-prototipo">
        <span>Protótipo:</span>
        <select id="proto-cenario">
            <option value="virada">Virada (Luciana)</option>
            <option value="lider">Líder confirma</option>
        </select>
        <button id="botao-repetir" type="button">Repetir</button>
    </div>

    <script>
        (() => {
            'use strict';

            const TOPO = 8; // 0 = chão, 8 = topo

            // Estado no fim da corrida.
            //   pontos     = somados nas 5 rodadas (só definiram a largada)
            //   largada    = andar onde começou (0 = chão)
            //   andarFinal = onde parou quando a corrida acabou (8 = chegou ao topo)
            const CENARIOS = {
                // VIRADA de propósito: a Luciana era a última em pontos, largou no chão e venceu.
                virada: [
                    { nome: 'Luciana', bicho: '🐯', cor: '#ff7f50', pontos: 2300, largada: 0, andarFinal: 8 },
                    { nome: 'Fernanda', bicho: '🦊', cor: '#ff4757', pontos: 2600, largada: 4, andarFinal: 6 },
                    { nome: 'Rodrigo', bicho: '🐼', cor: '#1e90ff', pontos: 2550, largada: 3, andarFinal: 6 },
                    { nome: 'Adamor', bicho: '🦁', cor: '#ffa502', pontos: 2480, largada: 2, andarFinal: 5 },
                    { nome: 'Cecília', bicho: '🐸', cor: '#2ed573', pontos: 2500, largada: 2, andarFinal: 4 },
                    { nome: 'Catarina', bicho: '🦄', cor: '#9b59b6', pontos: 2450, largada: 1, andarFinal: 4 },
                    { nome: 'Guilherme', bicho: '🐧', cor: '#00d2d3', pontos: 2400, largada: 1, andarFinal: 3 },
                    { nome: 'Mônica', bicho: '🐙', cor: '#ff6b81', pontos: 2380, largada: 0, andarFinal: 2 }
                ],
                // Líder em pontos confirma no topo (sem virada)
                lider: [
                    { nome: 'Vítoria', bicho: '🦊', cor: '#ff4757', pontos: 2600, largada: 4, andarFinal: 8 },
                    { nome: 'Rodrigo', bicho: '🐼', cor: '#1e90ff', pontos: 2550, largada: 3, andarFinal: 7 },
                    { nome: 'Cecília', bicho: '🐸', cor: '#2ed573', pontos: 2500, largada: 2, andarFinal: 5 },
                    { nome: 'Adamor', bicho: '🦁', cor: '#ffa502', pontos: 2480, largada: 2, andarFinal: 5 },
                    { nome: 'Catarina', bicho: '🦄', cor: '#9b59b6', pontos: 2450, largada: 1, andarFinal: 4 },
                    { nome: 'Luciana', bicho: '🐯', cor: '#ff7f50', pontos: 2300, largada: 0, andarFinal: 4 },
                    { nome: 'Guilherme', bicho: '🐧', cor: '#00d2d3', pontos: 2400, largada: 1, andarFinal: 3 },
                    { nome: 'Mônica', bicho: '🐙', cor: '#ff6b81', pontos: 2380, largada: 0, andarFinal: 1 }
                ]
            };

            // Linha do tempo (ms)
            const T = { terceiro: 900, segundo: 2300, rufar: 3600, campeao: 4500, restantes: 5800 };

            // ============================================================
            // A CLASSIFICAÇÃO (igual à base)
            // Quem chegou ao topo vence. Depois, por andar alcançado, e pontos
            // só desempatam quem parou no mesmo andar.
            // ============================================================
            function classificar(lista) {
                return [...lista].sort((a, b) => {
                    if (a.andarFinal !== b.andarFinal) return b.andarFinal - a.andarFinal;
                    return b.pontos - a.pontos;
                });
            }
            // ============================================================

            const $ = id => document.getElementById(id);
            function el(tag, classe, texto) {
                const e = document.createElement(tag);
                if (classe) e.className = classe;
                if (texto !== undefined) e.textContent = texto;
                return e;
            }

            const nomeAndar = n => n === 0 ? 'chão' : n === TOPO ? 'topo' : `andar ${n}`;
            const ondeParou = j => j.andarFinal === TOPO ? 'Chegou ao topo 🏆' : `Parou no andar ${j.andarFinal}`;

            // Empatou no andar com alguém e foi decidido nos pontos?
            function desempateCom(corrida, i) {
                const j = corrida[i];
                const vizinho = [corrida[i - 1], corrida[i + 1]].find(o => o && o.andarFinal === j.andarFinal);
                if (!vizinho || j.andarFinal === TOPO) return null;
                const dif = Math.abs(j.pontos - vizinho.pontos);
                return j.pontos >= vizinho.pontos ? `Desempate: +${dif} pts` : `Desempate: −${dif} pts`;
            }

            let timers = [];
            const depois = (ms, fn) => timers.push(setTimeout(fn, ms));

            // ===================== MONTAGEM =====================
            function montar(cenario) {
                timers.forEach(clearTimeout);
                timers = [];
                pararConfete();

                const jogadores = CENARIOS[cenario];
                const corrida = classificar(jogadores);
                const campeao = corrida[0];
                const subiu = TOPO - campeao.largada;

                // ---- cabeçalho ----
                $('rotulo').textContent = 'Fim de jogo';
                const titulo = $('titulo');
                titulo.classList.remove('revelado');
                titulo.textContent = 'E o campeão é…';
                $('subtitulo').textContent = 'Quem chega ao topo da Pirâmide primeiro vence';

                // ---- pódio (ordem visual: 2º, 1º, 3º) ----
                const podio = $('podio');
                podio.replaceChildren();
                const degraus = {};
                [[1, 'segundo'], [0, 'primeiro'], [2, 'terceiro']].forEach(([i, classe]) => {
                    const j = corrida[i];
                    if (!j) return;
                    const d = el('div', `degrau ${classe}`);

                    const bicho = el('div', 'bicho', j.bicho);
                    if (i === 0) {
                        bicho.prepend(el('span', 'raios'));
                        bicho.append(el('span', 'coroa', '👑'));
                    }

                    const bloco = el('div', 'bloco');
                    bloco.append(el('span', 'posicao', `${i + 1}º`), el('span', 'detalhe', ondeParou(j)));
                    const dsp = desempateCom(corrida, i);
                    if (dsp) bloco.append(el('span', 'desempate', dsp));

                    d.append(bicho, el('div', 'nome', j.nome), bloco);
                    podio.append(d);
                    degraus[i] = d;
                });

                // ---- 4º em diante ----
                const restantes = $('restantes');
                restantes.replaceChildren();
                corrida.slice(3).forEach((j, k) => {
                    const li = el('li', 'glass-panel');
                    const info = el('span', 'info');
                    info.append(el('span', 'nome', j.nome), el('span', 'onde', `${k + 4}º · ${nomeAndar(j.andarFinal)}`));
                    li.append(el('span', 'bicho-mini', j.bicho), info);
                    restantes.append(li);
                });

                // ===================== SEQUÊNCIA =====================
                const revelar = (d) => { if (d) d.classList.add('subiu', 'revelado'); };

                depois(T.terceiro, () => revelar(degraus[2]));
                depois(T.segundo, () => revelar(degraus[1]));
                depois(T.rufar, () => {
                    $('subtitulo').textContent = '🥁 …';
                    if (degraus[0]) degraus[0].classList.add('subiu');
                });
                depois(T.campeao, () => {
                    const d = degraus[0];
                    if (d) d.classList.add('revelado', 'festa');
                    titulo.replaceChildren(`${campeao.bicho} `, el('span', 'nome-campeao', campeao.nome), ' venceu!');
                    void titulo.offsetWidth;
                    titulo.classList.add('revelado');
                    $('rotulo').textContent = 'Campeão da Pirâmide';
                    $('subtitulo').textContent = `Largou no ${nomeAndar(campeao.largada)} e subiu ${subiu} ${subiu === 1 ? 'andar' : 'andares'} até o topo`;
                    soltarConfete();
                });
                depois(T.restantes, () => {
                    [...restantes.children].forEach((li, k) => depois(k * 90, () => li.classList.add('visivel')));
                });
            }

            // ===================== CONFETE =====================
            const canvas = $('confete');
            const ctx = canvas.getContext('2d');
            const CORES = ['#f5b301', '#ff4757', '#1e90ff', '#2ed573', '#9b59b6', '#ff7f50', '#00d2d3', '#ffffff'];
            let pecas = [];
            let animando = null;
            let chuvaAte = 0;

            function ajustarCanvas() {
                const dpr = Math.min(2, window.devicePixelRatio || 1);
                canvas.width = innerWidth * dpr;
                canvas.height = innerHeight * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function novaPeca(x, y, vx, vy) {
                return {
                    x, y, vx, vy,
                    w: 6 + Math.random() * 8,
                    h: 4 + Math.random() * 6,
                    rot: Math.random() * Math.PI,
                    vr: (Math.random() - .5) * .3,
                    giro: Math.random() * Math.PI * 2,
                    cor: CORES[Math.floor(Math.random() * CORES.length)]
                };
            }

            function soltarConfete() {
                if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                ajustarCanvas();
                // Duas explosões de canhão nos cantos de baixo
                for (let i = 0; i < 140; i++) {
                    const esq = i % 2 === 0;
                    const ang = (esq ? -60 : -120) * Math.PI / 180 + (Math.random() - .5) * .7;
                    const v = 12 + Math.random() * 10;
                    pecas.push(novaPeca(esq ? -10 : innerWidth + 10, innerHeight * .9, Math.cos(ang) * v, Math.sin(ang) * v));
                }
                chuvaAte = performance.now() + 6000;
                if (!animando) animando = requestAnimationFrame(quadro);
            }

            function quadro(agora) {
                ctx.clearRect(0, 0, innerWidth, innerHeight);
                // Chuva leve de confete por alguns segundos
                if (agora < chuvaAte && Math.random() < .5) {
                    pecas.push(novaPeca(Math.random() * innerWidth, -12, (Math.random() - .5) * 2, 1 + Math.random() * 2));
                }
                pecas = pecas.filter(p => p.y < innerHeight + 30);
                for (const p of pecas) {
                    p.vx *= .985;
                    p.vy = p.vy * .985 + .32;
                    p.x += p.vx + Math.sin(p.giro) * .6;
                    p.y += p.vy;
                    p.rot += p.vr;
                    p.giro += .08;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.scale(1, Math.cos(p.giro)); // efeito de papel virando
                    ctx.fillStyle = p.cor;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                }
                if (pecas.length || agora < chuvaAte) animando = requestAnimationFrame(quadro);
                else { animando = null; ctx.clearRect(0, 0, innerWidth, innerHeight); }
            }

            function pararConfete() {
                pecas = [];
                chuvaAte = 0;
                if (animando) cancelAnimationFrame(animando);
                animando = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            window.addEventListener('resize', ajustarCanvas);
            ajustarCanvas();

            // ===== protótipo =====
            const params = new URLSearchParams(location.search);
            if (params.has('limpo')) $('barra-prototipo').classList.add('oculto');
            const sel = $('proto-cenario');
            if (params.has('cenario')) sel.value = params.get('cenario');
            const remontar = () => montar(sel.value);
            sel.addEventListener('change', remontar);
            $('botao-repetir').addEventListener('click', remontar);
            if (document.fonts) document.fonts.ready.then(remontar); else remontar();
        })();
    </script>
</body>
