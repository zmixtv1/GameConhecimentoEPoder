<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TV - Ligação</title>

    <!--
      PROPOSTA NOVA das duas telas da TV no desafio de Ligação ("linking").

      1. DURANTE (`tela-linking`): tema grande, timer redondo e uma "pista" por
         jogador com uma corrente de elos que acende a cada par certo. Quem
         completa ganha selo verde com a ordem de chegada (1º a completar…).
         A TV continua SEM mostrar os pares (cada celular tem a ordem dele).
      2. RESULTADO (`tela-resultado-linking`): gabarito com os pares ligados por
         uma linha que se desenha, placar com animal, "+ganho" deste desafio e
         total, e as bolinhas de quem já apertou "continuar".

      Usa só o que o servidor já manda, com dois detalhes:
        - `progressoLinking` não traz o animal: a TV já conhece os jogadores do
          lobby (aqui: mapa AVATARES por nome).
        - o total de pares não vem em `iniciarLinking`. Aqui o servidor de
          mentira manda `totalPares`; sem ele a tela assume 5.
          Sugestão: incluir `totalPares` no iniciarLinking do server/sala.js.

      Barra do protótipo: Durante · Resultado · Repetir. ?limpo esconde.
    -->

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap">

    <style>
        :root {
            color-scheme: light;
            --bg: #f8fafc;
            --ink: #0f172a;
            --ink-soft: #475569;
            --violet: #9b59b6;
            --verde: #2ed573;
            --verde-escuro: #15a356;
            --vermelho: #ff4757;
            --glass-bg: rgba(255, 255, 255, 0.68);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 14px 30px rgba(0, 0, 0, 0.07);
            font-family: "Outfit", system-ui, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg);
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: center;
            color: var(--ink);
            position: relative;
        }

        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            animation: fluidMotion 20s infinite alternate ease-in-out;
        }
        .light-1 { top: -10%; left: -10%; width: 60vw; height: 60vw; background: rgba(226, 232, 240, 0.8); }
        .light-2 { bottom: -20%; right: -10%; width: 50vw; height: 50vw; background: rgba(186, 230, 253, 0.4); animation-delay: -5s; }
        .light-3 { top: 30%; left: 30%; width: 40vw; height: 40vw; background: rgba(233, 213, 255, 0.45); animation-delay: -10s; }
        @keyframes fluidMotion {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5vw, 10vh) scale(1.1); }
            66% { transform: translate(-5vw, 5vh) scale(0.9); }
            100% { transform: translate(10vw, -5vh) scale(1.05); }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .oculto { display: none !important; }

        .tela {
            position: relative;
            z-index: 1;
            height: 100%;
            width: 100%;
            max-width: 1760px;
            margin: 0 auto;
            padding: clamp(14px, 3vh, 40px) clamp(18px, 3vw, 60px);
            display: grid;
            gap: clamp(10px, 2.2vh, 28px);
        }

        /* ===================== CABEÇALHO (comum) ===================== */
        .cabecalho {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 16px;
        }
        .pill {
            justify-self: start;
            display: flex;
            align-items: center;
            gap: clamp(8px, 1vw, 16px);
            padding: clamp(8px, 1.2vh, 14px) clamp(16px, 1.8vw, 30px);
            border-radius: 100px;
            font-size: clamp(13px, 1.9vh, 22px);
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--ink-soft);
            white-space: nowrap;
        }
        .pill .icone { font-size: 1.3em; letter-spacing: 0; }

        .tema-bloco { text-align: center; }
        .tema-rotulo {
            font-size: clamp(12px, 1.8vh, 20px);
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--violet);
        }
        .tema {
            font-size: clamp(30px, 6.2vh, 76px);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -1px;
        }
        .tema-sub {
            margin-top: 2px;
            font-size: clamp(14px, 2.2vh, 26px);
            font-weight: 700;
            color: var(--ink-soft);
        }

        /* Timer redondo (igual ao da pergunta) */
        .timer {
            justify-self: end;
            position: relative;
            width: clamp(78px, 12vh, 130px);
            height: clamp(78px, 12vh, 130px);
            border-radius: 50%;
            display: grid;
            place-items: center;
        }
        .timer svg { position: absolute; inset: -8%; width: 116%; height: 116%; transform: rotate(-90deg); }
        .anel-fundo { fill: none; stroke: rgba(255, 255, 255, .8); stroke-width: 10; }
        .anel { fill: none; stroke: var(--ink); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 408; transition: stroke-dashoffset .2s linear, stroke .3s ease; }
        .timer-valor { font-size: clamp(30px, 5.2vh, 56px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .timer.urgente { animation: pulso 1s ease-in-out infinite; }
        .timer.urgente .anel { stroke: var(--vermelho); }
        .timer.urgente .timer-valor { color: var(--vermelho); }
        @keyframes pulso { 50% { transform: scale(1.08); } }

        /* ===================== DURANTE ===================== */
        #tela-linking { grid-template-rows: auto minmax(0, 1fr) auto; }

        .pistas {
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: minmax(0, 19vh);
            gap: clamp(8px, 1.8vh, 24px) clamp(12px, 1.6vw, 28px);
            align-content: center;
        }
        .pistas.uma-coluna { grid-template-columns: minmax(0, 1fr); max-width: 1100px; width: 100%; margin: 0 auto; }

        .pista {
            --cor: #94a3b8;
            min-height: 0;
            max-height: 19vh;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: clamp(10px, 1.2vw, 22px);
            padding: clamp(8px, 1.4vh, 18px) clamp(14px, 1.4vw, 26px);
            border-radius: clamp(18px, 2.6vh, 30px);
            transition: border-color .4s ease, box-shadow .4s ease, background .4s ease;
            animation: entrar .45s cubic-bezier(.34, 1.56, .64, 1) backwards;
        }
        @keyframes entrar { from { opacity: 0; transform: translateY(14px) scale(.96); } }

        .pista .avatar {
            width: clamp(46px, 8vh, 92px);
            height: clamp(46px, 8vh, 92px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: clamp(26px, 4.8vh, 56px);
            line-height: 1;
            background: color-mix(in srgb, var(--cor) 22%, white);
            border: 3px solid color-mix(in srgb, var(--cor) 55%, white);
        }

        .pista .meio { min-width: 0; display: flex; flex-direction: column; gap: clamp(4px, .8vh, 10px); }
        .pista .nome {
            font-size: clamp(18px, 3vh, 36px);
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Corrente de elos: um por par */
        .corrente { display: flex; align-items: center; }
        .elo {
            position: relative;
            flex: none;
            width: clamp(22px, 3.6vh, 42px);
            height: clamp(22px, 3.6vh, 42px);
            border-radius: 50%;
            border: 3px solid rgba(15, 23, 42, .14);
            background: rgba(255, 255, 255, .7);
            transition: background .25s ease, border-color .25s ease, box-shadow .25s ease;
        }
        .ligacao {
            flex: 1;
            min-width: 8px;
            max-width: clamp(16px, 3vw, 60px);
            height: clamp(4px, .7vh, 8px);
            border-radius: 4px;
            background: rgba(15, 23, 42, .1);
            transition: background .25s ease;
        }
        .elo.ligado {
            border-color: var(--cor);
            background: var(--cor);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--cor) 22%, transparent), 0 4px 10px color-mix(in srgb, var(--cor) 40%, transparent);
            animation: ligar .45s cubic-bezier(.34, 1.8, .64, 1);
        }
        .elo.ligado::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 900;
            font-size: .62em;
        }
        .ligacao.ligado { background: var(--cor); }
        @keyframes ligar { 0% { transform: scale(.4); } 60% { transform: scale(1.25); } }

        .pista .contagem {
            text-align: right;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            white-space: nowrap;
        }
        .pista .contagem b { font-size: clamp(26px, 4.6vh, 56px); font-weight: 900; }
        .pista .contagem small { font-size: clamp(14px, 2.2vh, 26px); font-weight: 800; color: var(--ink-soft); }

        /* Completou */
        .pista.completou {
            border-color: var(--verde);
            background: color-mix(in srgb, var(--verde) 14%, var(--glass-bg));
            box-shadow: 0 14px 32px rgba(46, 213, 115, .25);
        }
        .pista.completou .contagem b { color: var(--verde-escuro); }
        .selo {
            display: none;
            padding: 4px 12px;
            border-radius: 100px;
            background: var(--verde-escuro);
            color: #fff;
            font-size: clamp(12px, 1.8vh, 20px);
            font-weight: 900;
            white-space: nowrap;
        }
        .pista.completou .selo { display: inline-block; animation: ligar .5s cubic-bezier(.34, 1.8, .64, 1); }
        .pista .linha-nome { display: flex; align-items: center; gap: 10px; min-width: 0; }

        .rodape-dica {
            text-align: center;
            font-size: clamp(14px, 2.1vh, 24px);
            font-weight: 700;
            color: var(--ink-soft);
        }
        .rodape-dica b { color: var(--ink); }

        .aguardando {
            align-self: center;
            justify-self: center;
            text-align: center;
            font-size: clamp(18px, 3vh, 34px);
            font-weight: 800;
            color: var(--ink-soft);
        }
        .aguardando .icone-grande { display: block; font-size: clamp(50px, 10vh, 120px); margin-bottom: 8px; animation: balancar 2.4s ease-in-out infinite; }
        @keyframes balancar { 50% { transform: rotate(-8deg) scale(1.05); } }

        /* ===================== RESULTADO ===================== */
        #tela-resultado-linking { grid-template-rows: auto minmax(0, 1fr) auto; }

        .resultado-corpo {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: clamp(14px, 2.4vw, 44px);
        }
        .secao-titulo {
            margin-bottom: clamp(6px, 1vh, 12px);
            font-size: clamp(12px, 1.7vh, 20px);
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }
        .coluna { min-height: 0; display: flex; flex-direction: column; }

        /* Gabarito: [esquerda] ——— [direita] */
        .gabarito { list-style: none; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: clamp(6px, 1.2vh, 14px); }
        .par {
            flex: 1 1 0;
            min-height: 0;
            max-height: 11vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) clamp(40px, 6vw, 120px) minmax(0, 1fr);
            align-items: center;
        }
        .par .lado {
            height: 100%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 clamp(8px, 1vw, 18px);
            border-radius: clamp(14px, 2vh, 22px);
            font-size: clamp(16px, 2.8vh, 34px);
            font-weight: 900;
            text-align: center;
            overflow-wrap: anywhere;
            opacity: 0;
            transform: translateX(-16px);
            transition: opacity .35s ease, transform .35s ease;
        }
        .par .lado.dir { transform: translateX(16px); }
        .par.visivel .lado { opacity: 1; transform: none; }
        .par .lado.dir { color: var(--verde-escuro); }

        .par .fio { position: relative; height: 100%; }
        .par .fio::before {
            content: '';
            position: absolute;
            left: -6px;
            right: -6px;
            top: 50%;
            height: clamp(4px, .7vh, 7px);
            margin-top: calc(clamp(4px, .7vh, 7px) / -2);
            border-radius: 4px;
            background: var(--verde);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .45s cubic-bezier(.6, 0, .3, 1) .2s;
        }
        .par .fio::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: clamp(12px, 2vh, 20px);
            height: clamp(12px, 2vh, 20px);
            margin: calc(clamp(12px, 2vh, 20px) / -2);
            border-radius: 50%;
            background: var(--verde);
            box-shadow: 0 0 0 4px rgba(46, 213, 115, .25);
            transform: scale(0);
            transition: transform .3s cubic-bezier(.34, 1.8, .64, 1) .6s;
        }
        .par.visivel .fio::before { transform: scaleX(1); }
        .par.visivel .fio::after { transform: scale(1); }

        /* Placar */
        .placar { list-style: none; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: clamp(5px, 1vh, 12px); }
        .placar li {
            --cor: #94a3b8;
            flex: 1 1 0;
            min-height: 0;
            max-height: 10vh;
            display: grid;
            grid-template-columns: 2.1em 2.4em minmax(0, 1fr) auto 4.6em;
            align-items: center;
            column-gap: clamp(8px, .8vw, 14px);
            padding: 0 clamp(10px, 1vw, 18px);
            border-radius: clamp(14px, 2vh, 22px);
            font-size: clamp(16px, 2.6vh, 31px);
            opacity: 0;
            transform: translateX(20px);
            transition: opacity .4s ease, transform .4s ease;
        }
        .placar li.visivel { opacity: 1; transform: none; }
        .placar .pos { font-weight: 900; color: var(--ink-soft); text-align: center; }
        .placar .pos.p1 { color: #e0a000; }
        .placar .av {
            width: 2.2em;
            height: 2.2em;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: color-mix(in srgb, var(--cor) 22%, white);
            border: 2px solid color-mix(in srgb, var(--cor) 50%, white);
            font-size: .9em;
        }
        .placar .av span { font-size: 1.3em; line-height: 1; }
        .placar .nome { font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .placar .ganho {
            padding: 3px 10px;
            border-radius: 100px;
            font-size: .72em;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transform: scale(0);
            transition: transform .4s cubic-bezier(.34, 1.8, .64, 1) .3s;
        }
        .placar li.visivel .ganho { transform: scale(1); }
        .placar .ganho.positivo { background: rgba(46, 213, 115, .18); color: var(--verde-escuro); }
        .placar .ganho.zero { background: rgba(15, 23, 42, .06); color: rgba(71, 85, 105, .6); }
        .placar .pontos { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .placar .pontos small { font-size: .55em; color: var(--ink-soft); margin-left: 2px; }

        /* Quem já apertou "continuar" */
        .continuar {
            justify-self: center;
            display: flex;
            align-items: center;
            gap: clamp(10px, 1.2vw, 20px);
            padding: clamp(8px, 1.2vh, 14px) clamp(16px, 1.8vw, 30px);
            border-radius: 100px;
            font-size: clamp(14px, 2.1vh, 24px);
            font-weight: 800;
            color: var(--ink-soft);
        }
        .bolinhas { display: flex; gap: clamp(6px, .6vw, 10px); }
        .bolinha {
            --cor: var(--verde);
            color: transparent;
            font-weight: 900;
            width: clamp(28px, 4.2vh, 46px);
            height: clamp(28px, 4.2vh, 46px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: clamp(15px, 2.4vh, 26px);
            background: rgba(15, 23, 42, .06);
            filter: grayscale(1);
            opacity: .45;
            transition: all .35s cubic-bezier(.34, 1.56, .64, 1);
        }
        .bolinha.pronto {
            filter: none;
            opacity: 1;
            color: #fff;
            background: var(--cor);
            box-shadow: 0 4px 12px rgba(46, 213, 115, .4);
            transform: scale(1.1);
        }

        @media (max-width: 900px) {
            .pistas { grid-template-columns: minmax(0, 1fr); }
            .resultado-corpo { grid-template-columns: minmax(0, 1fr); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }

        /* ===== só deste protótipo, não existe no jogo ===== */
        .barra-prototipo {
            position: fixed; bottom: 10px; right: 10px; z-index: 500;
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; border-radius: 10px;
            background: rgba(15, 23, 42, 0.88); color: #fff;
            font-size: 12px; font-weight: 700;
        }
        .barra-prototipo button {
            padding: 4px 10px; border: 0; border-radius: 6px;
            background: #fff; color: #0f172a; font-weight: 800;
            font-family: inherit; font-size: 12px; cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>
    <div class="ambient-light light-3"></div>

    <!-- ===================== DURANTE ===================== -->
    <div id="tela-linking" class="tela oculto">
        <header class="cabecalho">
            <div class="pill glass-panel"><span class="icone">🔗</span>Desafio de Ligação</div>
            <div class="tema-bloco">
                <p class="tema-rotulo">Ligue os pares</p>
                <h1 class="tema" id="linking-tema"></h1>
                <p class="tema-sub">Cada um liga no próprio celular</p>
            </div>
            <div class="timer glass-panel" id="linking-timer">
                <svg viewBox="0 0 150 150">
                    <circle class="anel-fundo" cx="75" cy="75" r="65"></circle>
                    <circle class="anel" id="linking-anel" cx="75" cy="75" r="65"></circle>
                </svg>
                <span class="timer-valor" id="linking-tempo"></span>
            </div>
        </header>

        <div class="pistas" id="linking-progresso"></div>

        <p class="rodape-dica"><b>40 pts</b> por par certo · completou tudo? bônus de até <b>100</b> pela velocidade · errar não tira ponto</p>
    </div>

    <!-- ===================== RESULTADO ===================== -->
    <div id="tela-resultado-linking" class="tela oculto">
        <header class="cabecalho">
            <div class="pill glass-panel"><span class="icone">🔗</span>Resultado da Ligação</div>
            <div class="tema-bloco">
                <p class="tema-rotulo">Gabarito</p>
                <h1 class="tema" id="resultado-tema"></h1>
            </div>
            <div></div>
        </header>

        <div class="resultado-corpo">
            <section class="coluna">
                <div class="secao-titulo">Os pares certos</div>
                <ol class="gabarito" id="linking-gabarito"></ol>
            </section>
            <section class="coluna">
                <div class="secao-titulo">Placar</div>
                <ol class="placar" id="placar-linking"></ol>
            </section>
        </div>

        <div class="continuar glass-panel">
            <span id="progresso-continuar-linking">Aguardando jogadores confirmarem…</span>
            <span class="bolinhas" id="bolinhas-continuar"></span>
        </div>
    </div>

    <div class="barra-prototipo" id="barra-prototipo">
        <span>Protótipo:</span>
        <button id="botao-durante" type="button">Durante</button>
        <button id="botao-resultado" type="button">Resultado</button>
        <button id="botao-repetir" type="button">Repetir</button>
    </div>

    <script>
    (() => {
        'use strict';

        // ======== TV (substitui o trecho do public/tv/tv.js) ========
        const telaLinking = document.getElementById('tela-linking');
        const telaResultadoLinking = document.getElementById('tela-resultado-linking');
        const TODAS_AS_TELAS = [telaLinking, telaResultadoLinking];

        const $ = id => document.getElementById(id);
        const CIRCUNFERENCIA = 2 * Math.PI * 65;

        // A TV já conhece os jogadores pelo lobby; aqui um mapa nome → animal.
        const AVATARES = {};

        let intervaloLinking = null;
        let progressoContinuarAtivoEl = null;
        let totalPares = 5;
        let ordemConclusao = [];   // nomes na ordem em que completaram
        let pistas = new Map();    // nome → { el, elos, ligacoes, contagem, selo, corretos }
        let ultimoPlacar = [];
        let timersTela = [];

        function mostrarTela(tela) {
            for (const t of TODAS_AS_TELAS) t.classList.toggle('oculto', t !== tela);
        }

        function criarEl(tag, classe, texto) {
            const el = document.createElement(tag);
            if (classe) el.className = classe;
            if (texto !== undefined) el.textContent = texto;
            return el;
        }

        function avatarDe(nome, avatar) {
            return avatar || AVATARES[nome] || { emoji: '🙂', cor: '#94a3b8' };
        }

        function iniciarTimer(tempoLimiteMs) {
            clearInterval(intervaloLinking);
            const anel = $('linking-anel'), valor = $('linking-tempo'), modulo = $('linking-timer');
            anel.style.strokeDasharray = String(CIRCUNFERENCIA);
            const inicio = Date.now();
            const atualizar = () => {
                const decorrido = Date.now() - inicio;
                const resta = Math.max(0, tempoLimiteMs - decorrido);
                anel.style.strokeDashoffset = String(CIRCUNFERENCIA * Math.min(1, decorrido / tempoLimiteMs));
                const s = Math.ceil(resta / 1000);
                valor.textContent = String(s);
                modulo.classList.toggle('urgente', s <= 5 && s > 0);
                if (resta <= 0) clearInterval(intervaloLinking);
            };
            atualizar();
            intervaloLinking = setInterval(atualizar, 200);
        }

        // ---------- Durante ----------
        function mostrarAguardando() {
            const cont = $('linking-progresso');
            const aviso = criarEl('div', 'aguardando');
            aviso.append(criarEl('span', 'icone-grande', '🔗'), 'Peguem o celular e liguem os pares!');
            cont.replaceChildren(aviso);
        }

        function criarPista(jogador) {
            const av = avatarDe(jogador.nome);
            const el = criarEl('div', 'pista glass-panel');
            el.style.setProperty('--cor', av.cor);
            el.style.animationDelay = `${pistas.size * 60}ms`;

            const avatar = criarEl('div', 'avatar', av.emoji);
            const meio = criarEl('div', 'meio');
            const linhaNome = criarEl('div', 'linha-nome');
            const selo = criarEl('span', 'selo', '');
            linhaNome.append(criarEl('span', 'nome', jogador.nome), selo);

            const corrente = criarEl('div', 'corrente');
            const elos = [], ligacoes = [];
            for (let i = 0; i < totalPares; i++) {
                if (i > 0) { const l = criarEl('span', 'ligacao'); ligacoes.push(l); corrente.append(l); }
                const e = criarEl('span', 'elo'); elos.push(e); corrente.append(e);
            }
            meio.append(linhaNome, corrente);

            const contagem = criarEl('div', 'contagem');
            const b = criarEl('b', '', '0');
            contagem.append(b, criarEl('small', '', `/${totalPares}`));

            el.append(avatar, meio, contagem);
            return { el, elos, ligacoes, contagem: b, selo, corretos: 0, completou: false };
        }

        function atualizarPistas(jogadores) {
            const cont = $('linking-progresso');
            if (!pistas.size) cont.replaceChildren();
            cont.classList.toggle('uma-coluna', jogadores.length <= 4);

            for (const j of jogadores) {
                let p = pistas.get(j.nome);
                if (!p) { p = criarPista(j); pistas.set(j.nome, p); cont.append(p.el); }

                const novos = Math.min(totalPares, j.corretos);
                for (let i = p.corretos; i < novos; i++) {
                    p.elos[i].classList.add('ligado');
                    if (i > 0) p.ligacoes[i - 1].classList.add('ligado');
                }
                p.corretos = novos;
                p.contagem.textContent = String(novos);

                if (j.completou && !p.completou) {
                    p.completou = true;
                    if (!ordemConclusao.includes(j.nome)) ordemConclusao.push(j.nome);
                    const ordem = ordemConclusao.indexOf(j.nome) + 1;
                    p.selo.textContent = `✅ ${ordem}º a completar`;
                    p.el.classList.add('completou');
                }
            }
        }

        // ---------- Resultado ----------
        function renderizarGabarito(pares) {
            const ol = $('linking-gabarito');
            ol.replaceChildren();
            pares.forEach((par, i) => {
                const li = criarEl('li', 'par');
                li.append(
                    criarEl('span', 'lado esq glass-panel', par.esquerda),
                    criarEl('span', 'fio'),
                    criarEl('span', 'lado dir glass-panel', par.direita)
                );
                ol.append(li);
                timersTela.push(setTimeout(() => li.classList.add('visivel'), 300 + i * 260));
            });
            return 300 + pares.length * 260;
        }

        function renderizarPlacar(lista, ol, atraso) {
            ol.replaceChildren();
            lista.forEach((jogador, k) => {
                const posicao = lista.filter(j => j.pontos > jogador.pontos).length + 1;
                const av = avatarDe(jogador.nome, jogador.avatar);
                const li = criarEl('li', 'glass-panel');
                li.style.setProperty('--cor', av.cor);
                const avEl = criarEl('span', 'av');
                avEl.append(criarEl('span', '', av.emoji));
                const ganho = jogador.ganho ?? 0;
                const pontos = criarEl('span', 'pontos');
                pontos.append(document.createTextNode(String(jogador.pontos)), criarEl('small', '', 'pts'));
                li.append(
                    criarEl('span', 'pos' + (posicao === 1 ? ' p1' : ''), `${posicao}º`),
                    avEl,
                    criarEl('span', 'nome', jogador.nome),
                    criarEl('span', 'ganho ' + (ganho > 0 ? 'positivo' : 'zero'), `+${ganho}`),
                    pontos
                );
                ol.append(li);
                timersTela.push(setTimeout(() => li.classList.add('visivel'), atraso + k * 110));
            });
        }

        function renderizarBolinhas(placar, confirmados) {
            const cont = $('bolinhas-continuar');
            if (cont.children.length !== placar.length) {
                cont.replaceChildren(...placar.map(() => criarEl('span', 'bolinha', '✓')));
            }
            // progressoContinuar só traz QUANTOS confirmaram (não quem), então as bolinhas
            // são neutras. Se o servidor mandar os ids, dá para mostrar o animal de cada um.
            [...cont.children].forEach((b, i) => b.classList.toggle('pronto', i < confirmados));
        }

        function tratarMensagem(msg) {
            switch (msg.type) {
                case 'iniciarLinking': {
                    timersTela.forEach(clearTimeout); timersTela = [];
                    mostrarTela(telaLinking);
                    totalPares = msg.totalPares || 5;
                    ordemConclusao = [];
                    pistas = new Map();
                    $('linking-tema').textContent = msg.tema;
                    $('resultado-tema').textContent = msg.tema;
                    mostrarAguardando();
                    iniciarTimer(msg.tempoLimiteMs);
                    break;
                }
                case 'progressoLinking': {
                    atualizarPistas(msg.jogadores);
                    break;
                }
                case 'resultadoLinking': {
                    clearInterval(intervaloLinking);
                    mostrarTela(telaResultadoLinking);
                    const fimGabarito = renderizarGabarito(msg.pares);
                    renderizarPlacar(msg.placar, $('placar-linking'), Math.min(fimGabarito, 1200));
                    ultimoPlacar = msg.placar;
                    renderizarBolinhas(msg.placar, 0);
                    $('progresso-continuar-linking').textContent = 'Aguardando jogadores confirmarem…';
                    progressoContinuarAtivoEl = $('progresso-continuar-linking');
                    break;
                }
                case 'progressoContinuar': {
                    if (progressoContinuarAtivoEl) {
                        progressoContinuarAtivoEl.textContent = `${msg.confirmados} de ${msg.total} prontos`;
                        renderizarBolinhas(ultimoPlacar, msg.confirmados);
                    }
                    break;
                }
            }
        }

        // ======== servidor de mentira (as mesmas mensagens do server/sala.js) ========
        const TEMPO_LIMITE_MS = 30000;
        const PONTOS_POR_PAR = 40;
        const BONUS_COMPLETAR_MAX = 100;

        const CONJUNTO = {
            tema: 'Capitais e Países',
            pares: [
                { esquerda: 'Brasil', direita: 'Brasília' },
                { esquerda: 'França', direita: 'Paris' },
                { esquerda: 'Japão', direita: 'Tóquio' },
                { esquerda: 'Egito', direita: 'Cairo' },
                { esquerda: 'Austrália', direita: 'Camberra' }
            ]
        };

        const JOGADORES = [
            { id: '1', nome: 'Ana',     pontos: 1480, avatar: { emoji: '🦊', cor: '#ff4757' }, ritmo: 2600, erro: 0.15 },
            { id: '2', nome: 'Rodrigo', pontos: 1355, avatar: { emoji: '🐼', cor: '#1e90ff' }, ritmo: 2100, erro: 0.20 },
            { id: '3', nome: 'Carla',   pontos: 1290, avatar: { emoji: '🐸', cor: '#2ed573' }, ritmo: 3400, erro: 0.30 },
            { id: '4', nome: 'Duda',    pontos: 1105, avatar: { emoji: '🦁', cor: '#ffa502' }, ritmo: 4200, erro: 0.25 },
            { id: '5', nome: 'Edu',     pontos:  980, avatar: { emoji: '🦄', cor: '#9b59b6' }, ritmo: 5200, erro: 0.40 },
            { id: '6', nome: 'Bruno',   pontos:  845, avatar: { emoji: '🐧', cor: '#00d2d3' }, ritmo: 3000, erro: 0.20 }
        ];
        JOGADORES.forEach(j => (AVATARES[j.nome] = j.avatar));

        let timers = [];
        const depois = (ms, fn) => timers.push(setTimeout(fn, ms));
        function pararTudo() {
            timers.forEach(clearTimeout);
            timers = [];
            clearInterval(intervaloLinking);
        }

        let estado = null;

        function progressoParaTv() {
            return estado.jogadores.map(j => ({ nome: j.nome, corretos: j.corretos, completou: j.completoEmMs !== null }));
        }

        function revelar() {
            if (estado.revelado) return;
            estado.revelado = true;
            pararTudo();
            const comGanho = estado.jogadores.map(j => {
                const fracao = j.completoEmMs !== null ? Math.max(0, 1 - j.completoEmMs / TEMPO_LIMITE_MS) : 0;
                const ganho = j.corretos * PONTOS_POR_PAR + (j.completoEmMs !== null ? Math.round(BONUS_COMPLETAR_MAX * fracao) : 0);
                return { id: j.id, nome: j.nome, avatar: j.avatar, pontos: j.pontos + ganho, ganho };
            });
            const placar = comGanho.sort((a, b) => b.pontos - a.pontos);
            tratarMensagem({ type: 'resultadoLinking', pares: CONJUNTO.pares, placar });

            let confirmados = 0;
            const total = estado.jogadores.length;
            const confirmar = () => {
                confirmados++;
                tratarMensagem({ type: 'progressoContinuar', confirmados, total });
                if (confirmados < total) depois(700 + Math.random() * 1800, confirmar);
            };
            depois(3500, confirmar);
        }

        function durante() {
            pararTudo();
            estado = {
                inicio: Date.now(),
                revelado: false,
                jogadores: JOGADORES.map(j => ({ ...j, corretos: 0, completoEmMs: null }))
            };
            tratarMensagem({ type: 'iniciarLinking', tema: CONJUNTO.tema, tempoLimiteMs: TEMPO_LIMITE_MS, totalPares: CONJUNTO.pares.length });

            for (const j of estado.jogadores) {
                const tentar = () => {
                    if (estado.revelado || j.completoEmMs !== null) return;
                    if (Math.random() >= j.erro) j.corretos++;
                    if (j.corretos >= CONJUNTO.pares.length) j.completoEmMs = Date.now() - estado.inicio;
                    tratarMensagem({ type: 'progressoLinking', jogadores: progressoParaTv() });
                    if (estado.jogadores.every(o => o.completoEmMs !== null)) return revelar();
                    depois(j.ritmo * (0.6 + Math.random() * 0.8), tentar);
                };
                depois(1500 + Math.random() * 1500, tentar);
            }
            depois(TEMPO_LIMITE_MS + 500, revelar);
        }

        function resultadoDireto() {
            durante();
            for (const j of estado.jogadores) {
                j.corretos = Math.max(1, Math.round(CONJUNTO.pares.length * (1 - j.erro) * (2600 / j.ritmo)));
                if (j.corretos >= CONJUNTO.pares.length) {
                    j.corretos = CONJUNTO.pares.length;
                    j.completoEmMs = Math.round(j.ritmo * 6);
                }
            }
            revelar();
        }

        $('botao-durante').addEventListener('click', durante);
        $('botao-resultado').addEventListener('click', resultadoDireto);
        $('botao-repetir').addEventListener('click', durante);
        const params = new URLSearchParams(location.search);
        if (params.has('limpo')) $('barra-prototipo').classList.add('oculto');
        if (params.get('tela') === 'resultado') resultadoDireto(); else durante();
    })();
    </script>
