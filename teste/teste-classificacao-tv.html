<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TV - Classificação</title>

    <!--
      PROPOSTA NOVA das duas telas da TV no desafio de Classificação ("sorting").
      Mesmo visual da tela nova de Ligação.

      1. DURANTE (`tela-sorting`): as duas categorias grandes ("Marvel vs DC"),
         timer redondo e uma pista por jogador com uma barra de segmentos que
         enche a cada item respondido ("5/8"). Quem termina fica verde com a
         ordem de chegada (1º a terminar…).
         A TV só sabe QUANTOS cada um respondeu, não se acertou, então a barra
         mostra progresso, não acerto. Os itens continuam escondidos.
      2. RESULTADO (`tela-resultado-sorting`): o gabarito separado em duas
         "caixas" (uma por categoria, com os itens caindo dentro), o placar com
         animal, "+ganho" e total, e as bolinhas de quem já apertou "continuar".

      Usa só o que o servidor já manda. Como na Ligação, `progressoSorting` não
      traz o animal: a TV usa os jogadores que já conhece do lobby (mapa
      AVATARES por nome).

      Barra do protótipo: Durante · Resultado · Repetir. ?limpo esconde,
      ?tela=resultado abre direto no resultado.
    -->

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap">

    <style>
        :root {
            color-scheme: light;
            --bg: #f8fafc;
            --ink: #0f172a;
            --ink-soft: #475569;
            --violet: #9b59b6;
            --verde: #2ed573;
            --verde-escuro: #15a356;
            --vermelho: #ff4757;
            --glass-bg: rgba(255, 255, 255, 0.68);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 14px 30px rgba(0, 0, 0, 0.07);

            /* Cores das duas categorias */
            --cor-a: #6366f1;
            --cor-b: #f59e0b;

            font-family: "Outfit", system-ui, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg);
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: center;
            color: var(--ink);
            position: relative;
        }

        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            animation: fluidMotion 20s infinite alternate ease-in-out;
        }
        .light-1 { top: -10%; left: -10%; width: 60vw; height: 60vw; background: rgba(224, 231, 255, 0.8); }
        .light-2 { bottom: -20%; right: -10%; width: 50vw; height: 50vw; background: rgba(254, 243, 199, 0.6); animation-delay: -5s; }
        .light-3 { top: 30%; left: 30%; width: 40vw; height: 40vw; background: rgba(255, 255, 255, 0.9); animation-delay: -10s; }
        @keyframes fluidMotion {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5vw, 10vh) scale(1.1); }
            66% { transform: translate(-5vw, 5vh) scale(0.9); }
            100% { transform: translate(10vw, -5vh) scale(1.05); }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .oculto { display: none !important; }

        .tela {
            position: relative;
            z-index: 1;
            height: 100%;
            width: 100%;
            max-width: 1760px;
            margin: 0 auto;
            padding: clamp(14px, 3vh, 40px) clamp(18px, 3vw, 60px);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            gap: clamp(10px, 2.2vh, 28px);
        }

        /* ===================== CABEÇALHO ===================== */
        .cabecalho {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 16px;
        }
        .pill {
            justify-self: start;
            display: flex;
            align-items: center;
            gap: clamp(8px, 1vw, 16px);
            padding: clamp(8px, 1.2vh, 14px) clamp(16px, 1.8vw, 30px);
            border-radius: 100px;
            font-size: clamp(13px, 1.9vh, 22px);
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--ink-soft);
            white-space: nowrap;
        }
        .pill .icone { font-size: 1.3em; letter-spacing: 0; }

        .centro { text-align: center; }
        .rotulo-centro {
            font-size: clamp(12px, 1.8vh, 20px);
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--violet);
        }
        .duelo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 1.4vw, 24px);
            margin-top: 4px;
        }
        .cat {
            padding: clamp(4px, .8vh, 10px) clamp(14px, 1.6vw, 28px);
            border-radius: clamp(14px, 2vh, 22px);
            font-size: clamp(26px, 5.4vh, 66px);
            font-weight: 900;
            line-height: 1.05;
            color: #fff;
            white-space: nowrap;
            box-shadow: 0 12px 28px color-mix(in srgb, var(--c) 35%, transparent);
            background: linear-gradient(180deg, color-mix(in srgb, var(--c) 85%, white), var(--c));
            animation: entrarCat .55s cubic-bezier(.34, 1.56, .64, 1) backwards;
        }
        .cat.a { --c: var(--cor-a); }
        .cat.b { --c: var(--cor-b); animation-delay: .12s; }
        @keyframes entrarCat { from { opacity: 0; transform: scale(.7) rotate(-4deg); } }
        .vs {
            font-size: clamp(16px, 2.8vh, 32px);
            font-weight: 900;
            color: var(--ink-soft);
        }
        .centro-sub {
            margin-top: 4px;
            font-size: clamp(14px, 2.1vh, 25px);
            font-weight: 700;
            color: var(--ink-soft);
        }

        /* Timer */
        .timer {
            justify-self: end;
            position: relative;
            width: clamp(78px, 12vh, 130px);
            height: clamp(78px, 12vh, 130px);
            border-radius: 50%;
            display: grid;
            place-items: center;
        }
        .timer svg { position: absolute; inset: -8%; width: 116%; height: 116%; transform: rotate(-90deg); }
        .anel-fundo { fill: none; stroke: rgba(255, 255, 255, .8); stroke-width: 10; }
        .anel { fill: none; stroke: var(--ink); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .2s linear, stroke .3s ease; }
        .timer-valor { font-size: clamp(30px, 5.2vh, 56px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .timer.urgente { animation: pulso 1s ease-in-out infinite; }
        .timer.urgente .anel { stroke: var(--vermelho); }
        .timer.urgente .timer-valor { color: var(--vermelho); }
        @keyframes pulso { 50% { transform: scale(1.08); } }

        /* ===================== DURANTE ===================== */
        .pistas {
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: minmax(0, 19vh);
            gap: clamp(8px, 1.8vh, 24px) clamp(12px, 1.6vw, 28px);
            align-content: center;
        }
        .pistas.uma-coluna { grid-template-columns: minmax(0, 1fr); max-width: 1100px; width: 100%; margin: 0 auto; }

        .pista {
            --cor: #94a3b8;
            min-height: 0;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: clamp(10px, 1.2vw, 22px);
            padding: clamp(8px, 1.4vh, 18px) clamp(14px, 1.4vw, 26px);
            border-radius: clamp(18px, 2.6vh, 30px);
            transition: border-color .4s ease, box-shadow .4s ease, background .4s ease;
            animation: entrar .45s cubic-bezier(.34, 1.56, .64, 1) backwards;
        }
        @keyframes entrar { from { opacity: 0; transform: translateY(14px) scale(.96); } }

        .pista .avatar {
            width: clamp(46px, 8vh, 92px);
            height: clamp(46px, 8vh, 92px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: clamp(26px, 4.8vh, 56px);
            line-height: 1;
            background: color-mix(in srgb, var(--cor) 22%, white);
            border: 3px solid color-mix(in srgb, var(--cor) 55%, white);
        }
        .pista .meio { min-width: 0; display: flex; flex-direction: column; gap: clamp(6px, 1vh, 12px); }
        .pista .linha-nome { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .pista .nome {
            font-size: clamp(18px, 3vh, 36px);
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Barra de segmentos: um por item */
        .segmentos { display: flex; gap: clamp(3px, .4vw, 6px); }
        .seg {
            flex: 1;
            height: clamp(12px, 2.2vh, 24px);
            border-radius: 6px;
            background: rgba(15, 23, 42, .1);
            transition: background .25s ease;
        }
        .seg.feito { background: var(--cor); animation: encher .4s cubic-bezier(.34, 1.8, .64, 1); }
        @keyframes encher { 0% { transform: scaleY(.3); } 60% { transform: scaleY(1.35); } }

        .pista .contagem { text-align: right; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
        .pista .contagem b { font-size: clamp(26px, 4.6vh, 56px); font-weight: 900; }
        .pista .contagem small { font-size: clamp(14px, 2.2vh, 26px); font-weight: 800; color: var(--ink-soft); }

        .pista.completou {
            border-color: var(--verde);
            background: color-mix(in srgb, var(--verde) 14%, var(--glass-bg));
            box-shadow: 0 14px 32px rgba(46, 213, 115, .25);
        }
        .pista.completou .contagem b { color: var(--verde-escuro); }
        .selo {
            display: none;
            padding: 4px 12px;
            border-radius: 100px;
            background: var(--verde-escuro);
            color: #fff;
            font-size: clamp(12px, 1.8vh, 20px);
            font-weight: 900;
            white-space: nowrap;
        }
        .pista.completou .selo { display: inline-block; animation: encher .5s cubic-bezier(.34, 1.8, .64, 1); }

        .aguardando {
            align-self: center;
            justify-self: center;
            text-align: center;
            font-size: clamp(18px, 3vh, 34px);
            font-weight: 800;
            color: var(--ink-soft);
        }
        .aguardando .icone-grande { display: block; font-size: clamp(50px, 10vh, 120px); margin-bottom: 8px; animation: balancar 2.4s ease-in-out infinite; }
        @keyframes balancar { 50% { transform: rotate(-8deg) scale(1.05); } }

        .rodape-dica {
            text-align: center;
            font-size: clamp(14px, 2.1vh, 24px);
            font-weight: 700;
            color: var(--ink-soft);
        }
        .rodape-dica b { color: var(--ink); }

        /* ===================== RESULTADO ===================== */
        .resultado-corpo {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
            gap: clamp(14px, 2.4vw, 44px);
        }
        .coluna { min-height: 0; display: flex; flex-direction: column; }
        .secao-titulo {
            margin-bottom: clamp(6px, 1vh, 12px);
            font-size: clamp(12px, 1.7vh, 20px);
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        /* Duas caixas, uma por categoria */
        .caixas {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: clamp(10px, 1.2vw, 20px);
        }
        .caixa {
            --c: var(--cor-a);
            min-height: 0;
            display: flex;
            flex-direction: column;
            border-radius: clamp(18px, 2.6vh, 30px);
            overflow: hidden;
            border: 3px solid color-mix(in srgb, var(--c) 45%, white);
            background: color-mix(in srgb, var(--c) 8%, rgba(255, 255, 255, .7));
        }
        .caixa.b { --c: var(--cor-b); }
        .caixa-titulo {
            flex: none;
            padding: clamp(8px, 1.4vh, 16px);
            text-align: center;
            font-size: clamp(18px, 3.2vh, 38px);
            font-weight: 900;
            color: #fff;
            background: linear-gradient(180deg, color-mix(in srgb, var(--c) 85%, white), var(--c));
        }
        .caixa ul {
            list-style: none;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(5px, 1vh, 12px);
            padding: clamp(8px, 1.4vh, 16px);
        }
        .caixa li {
            flex: 1 1 0;
            min-height: 0;
            max-height: 11vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(6px, 1.1vh, 14px) clamp(10px, 1vw, 16px);
            border-radius: clamp(12px, 1.6vh, 18px);
            background: #fff;
            border: 2px solid color-mix(in srgb, var(--c) 30%, white);
            box-shadow: 0 6px 14px color-mix(in srgb, var(--c) 14%, transparent);
            font-size: clamp(15px, 2.5vh, 30px);
            font-weight: 900;
            text-align: center;
            overflow-wrap: anywhere;
            opacity: 0;
            transform: translateY(-30px) rotate(-3deg);
        }
        .caixa li.caiu { animation: cair .45s cubic-bezier(.3, 1.4, .5, 1) forwards; }
        @keyframes cair { to { opacity: 1; transform: none; } }

        /* Placar */
        .placar { list-style: none; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: clamp(5px, 1vh, 12px); }
        .placar li {
            --cor: #94a3b8;
            flex: 1 1 0;
            min-height: 0;
            max-height: 10vh;
            display: grid;
            grid-template-columns: 2.1em 2.4em minmax(0, 1fr) auto 4.6em;
            align-items: center;
            column-gap: clamp(8px, .8vw, 14px);
            padding: 0 clamp(10px, 1vw, 18px);
            border-radius: clamp(14px, 2vh, 22px);
            font-size: clamp(16px, 2.6vh, 31px);
            opacity: 0;
            transform: translateX(20px);
            transition: opacity .4s ease, transform .4s ease;
        }
        .placar li.visivel { opacity: 1; transform: none; }
        .placar .pos { font-weight: 900; color: var(--ink-soft); text-align: center; }
        .placar .pos.p1 { color: #e0a000; }
        .placar .av {
            width: 2.2em;
            height: 2.2em;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: color-mix(in srgb, var(--cor) 22%, white);
            border: 2px solid color-mix(in srgb, var(--cor) 50%, white);
            font-size: .9em;
        }
        .placar .av span { font-size: 1.3em; line-height: 1; }
        .placar .nome { font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .placar .ganho {
            padding: 3px 10px;
            border-radius: 100px;
            font-size: .72em;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transform: scale(0);
            transition: transform .4s cubic-bezier(.34, 1.8, .64, 1) .3s;
        }
        .placar li.visivel .ganho { transform: scale(1); }
        .placar .ganho.positivo { background: rgba(46, 213, 115, .18); color: var(--verde-escuro); }
        .placar .ganho.zero { background: rgba(15, 23, 42, .06); color: rgba(71, 85, 105, .6); }
        .placar .pontos { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .placar .pontos small { font-size: .55em; color: var(--ink-soft); margin-left: 2px; }

        /* Continuar */
        .continuar {
            justify-self: center;
            display: flex;
            align-items: center;
            gap: clamp(10px, 1.2vw, 20px);
            padding: clamp(8px, 1.2vh, 14px) clamp(16px, 1.8vw, 30px);
            border-radius: 100px;
            font-size: clamp(14px, 2.1vh, 24px);
            font-weight: 800;
            color: var(--ink-soft);
        }
        .bolinhas { display: flex; gap: clamp(6px, .6vw, 10px); }
        .bolinha {
            width: clamp(28px, 4.2vh, 46px);
            height: clamp(28px, 4.2vh, 46px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: clamp(15px, 2.4vh, 26px);
            font-weight: 900;
            color: transparent;
            background: rgba(15, 23, 42, .08);
            transition: all .35s cubic-bezier(.34, 1.56, .64, 1);
        }
        .bolinha.pronto { color: #fff; background: var(--verde); box-shadow: 0 4px 12px rgba(46, 213, 115, .4); transform: scale(1.1); }

        @media (max-width: 900px) {
            .pistas { grid-template-columns: minmax(0, 1fr); }
            .resultado-corpo { grid-template-columns: minmax(0, 1fr); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }

        /* ===== só deste protótipo, não existe no jogo ===== */
        .barra-prototipo {
            position: fixed; bottom: 10px; right: 10px; z-index: 500;
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; border-radius: 10px;
            background: rgba(15, 23, 42, 0.88); color: #fff;
            font-size: 12px; font-weight: 700;
        }
        .barra-prototipo button {
            padding: 4px 10px; border: 0; border-radius: 6px;
            background: #fff; color: #0f172a; font-weight: 800;
            font-family: inherit; font-size: 12px; cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>
    <div class="ambient-light light-3"></div>

    <!-- ===================== DURANTE ===================== -->
    <div id="tela-sorting" class="tela oculto">
        <header class="cabecalho">
            <div class="pill glass-panel"><span class="icone">🗂️</span>Classificação</div>
            <div class="centro">
                <p class="rotulo-centro">Separe cada item</p>
                <div class="duelo">
                    <span class="cat a" id="sorting-cat-a"></span>
                    <span class="vs">ou</span>
                    <span class="cat b" id="sorting-cat-b"></span>
                </div>
                <p class="centro-sub">Cada um separa no próprio celular</p>
            </div>
            <div class="timer glass-panel" id="sorting-timer">
                <svg viewBox="0 0 150 150">
                    <circle class="anel-fundo" cx="75" cy="75" r="65"></circle>
                    <circle class="anel" id="sorting-anel" cx="75" cy="75" r="65"></circle>
                </svg>
                <span class="timer-valor" id="sorting-tempo"></span>
            </div>
        </header>

        <div class="pistas" id="sorting-progresso"></div>

        <p class="rodape-dica"><b>25 pts</b> por item certo · cada item tem <b>uma chance</b>: errou, ficou errado</p>
    </div>

    <!-- ===================== RESULTADO ===================== -->
    <div id="tela-resultado-sorting" class="tela oculto">
        <header class="cabecalho">
            <div class="pill glass-panel"><span class="icone">🗂️</span>Resultado</div>
            <div class="centro">
                <p class="rotulo-centro">Gabarito</p>
                <div class="duelo">
                    <span class="cat a" id="res-cat-a"></span>
                    <span class="vs">ou</span>
                    <span class="cat b" id="res-cat-b"></span>
                </div>
            </div>
            <div></div>
        </header>

        <div class="resultado-corpo">
            <section class="coluna">
                <div class="secao-titulo">Onde cada item vai</div>
                <div class="caixas">
                    <div class="caixa a"><div class="caixa-titulo" id="caixa-titulo-a"></div><ul id="caixa-a"></ul></div>
                    <div class="caixa b"><div class="caixa-titulo" id="caixa-titulo-b"></div><ul id="caixa-b"></ul></div>
                </div>
            </section>
            <section class="coluna">
                <div class="secao-titulo">Placar</div>
                <ol class="placar" id="placar-sorting"></ol>
            </section>
        </div>

        <div class="continuar glass-panel">
            <span id="progresso-continuar-sorting">Aguardando jogadores confirmarem…</span>
            <span class="bolinhas" id="bolinhas-continuar"></span>
        </div>
    </div>

    <div class="barra-prototipo" id="barra-prototipo">
        <span>Protótipo:</span>
        <button id="botao-durante" type="button">Durante</button>
        <button id="botao-resultado" type="button">Resultado</button>
        <button id="botao-repetir" type="button">Repetir</button>
    </div>

    <script>
    (() => {
        'use strict';

        // ======== TV (substitui o trecho do public/tv/tv.js) ========
        const telaSorting = document.getElementById('tela-sorting');
        const telaResultadoSorting = document.getElementById('tela-resultado-sorting');
        const TODAS_AS_TELAS = [telaSorting, telaResultadoSorting];

        const $ = id => document.getElementById(id);
        const CIRCUNFERENCIA = 2 * Math.PI * 65;

        // A TV já conhece os jogadores pelo lobby; aqui um mapa nome → animal.
        const AVATARES = {};

        let intervaloSorting = null;
        let progressoContinuarAtivoEl = null;
        let categoriaANome = '';
        let categoriaBNome = '';
        let ordemConclusao = [];
        let pistas = new Map(); // nome → { el, segs, contagem, selo, feitos, completou }
        let ultimoPlacar = [];
        let timersTela = [];

        function mostrarTela(tela) {
            for (const t of TODAS_AS_TELAS) t.classList.toggle('oculto', t !== tela);
        }

        function criarEl(tag, classe, texto) {
            const el = document.createElement(tag);
            if (classe) el.className = classe;
            if (texto !== undefined) el.textContent = texto;
            return el;
        }

        const avatarDe = (nome, avatar) => avatar || AVATARES[nome] || { emoji: '🙂', cor: '#94a3b8' };

        function iniciarTimer(tempoLimiteMs) {
            clearInterval(intervaloSorting);
            const anel = $('sorting-anel'), valor = $('sorting-tempo'), modulo = $('sorting-timer');
            anel.style.strokeDasharray = String(CIRCUNFERENCIA);
            const inicio = Date.now();
            const atualizar = () => {
                const decorrido = Date.now() - inicio;
                const resta = Math.max(0, tempoLimiteMs - decorrido);
                anel.style.strokeDashoffset = String(CIRCUNFERENCIA * Math.min(1, decorrido / tempoLimiteMs));
                const s = Math.ceil(resta / 1000);
                valor.textContent = String(s);
                modulo.classList.toggle('urgente', s <= 5 && s > 0);
                if (resta <= 0) clearInterval(intervaloSorting);
            };
            atualizar();
            intervaloSorting = setInterval(atualizar, 200);
        }

        function preencherCategorias() {
            for (const id of ['sorting-cat-a', 'res-cat-a', 'caixa-titulo-a']) $(id).textContent = categoriaANome;
            for (const id of ['sorting-cat-b', 'res-cat-b', 'caixa-titulo-b']) $(id).textContent = categoriaBNome;
        }

        // ---------- Durante ----------
        function mostrarAguardando() {
            const aviso = criarEl('div', 'aguardando');
            aviso.append(criarEl('span', 'icone-grande', '🗂️'), 'Peguem o celular e separem os itens!');
            $('sorting-progresso').replaceChildren(aviso);
        }

        function criarPista(jogador) {
            const av = avatarDe(jogador.nome);
            const el = criarEl('div', 'pista glass-panel');
            el.style.setProperty('--cor', av.cor);
            el.style.animationDelay = `${pistas.size * 60}ms`;

            const meio = criarEl('div', 'meio');
            const linhaNome = criarEl('div', 'linha-nome');
            const selo = criarEl('span', 'selo', '');
            linhaNome.append(criarEl('span', 'nome', jogador.nome), selo);
            const barra = criarEl('div', 'segmentos');
            const segs = Array.from({ length: jogador.total }, () => criarEl('span', 'seg'));
            barra.append(...segs);
            meio.append(linhaNome, barra);

            const contagem = criarEl('div', 'contagem');
            const b = criarEl('b', '', '0');
            contagem.append(b, criarEl('small', '', `/${jogador.total}`));

            el.append(criarEl('div', 'avatar', av.emoji), meio, contagem);
            return { el, segs, contagem: b, selo, feitos: 0, completou: false };
        }

        function atualizarPistas(jogadores) {
            const cont = $('sorting-progresso');
            if (!pistas.size) cont.replaceChildren();
            cont.classList.toggle('uma-coluna', jogadores.length <= 4);

            for (const j of jogadores) {
                let p = pistas.get(j.nome);
                if (!p) { p = criarPista(j); pistas.set(j.nome, p); cont.append(p.el); }

                const n = Math.min(j.total, j.respondidos);
                for (let i = p.feitos; i < n; i++) p.segs[i].classList.add('feito');
                p.feitos = n;
                p.contagem.textContent = String(n);

                if (n >= j.total && !p.completou) {
                    p.completou = true;
                    if (!ordemConclusao.includes(j.nome)) ordemConclusao.push(j.nome);
                    p.selo.textContent = `✅ ${ordemConclusao.indexOf(j.nome) + 1}º a terminar`;
                    p.el.classList.add('completou');
                }
            }
        }

        // ---------- Resultado ----------
        function renderizarGabarito(gabarito) {
            const a = $('caixa-a'), b = $('caixa-b');
            a.replaceChildren();
            b.replaceChildren();
            gabarito.forEach((item, k) => {
                const li = criarEl('li', '', item.nome);
                (item.categoria === 'A' ? a : b).append(li);
                timersTela.push(setTimeout(() => li.classList.add('caiu'), 350 + k * 170));
            });
            return 350 + gabarito.length * 170;
        }

        function renderizarPlacar(lista, ol, atraso) {
            ol.replaceChildren();
            lista.forEach((jogador, k) => {
                const posicao = lista.filter(j => j.pontos > jogador.pontos).length + 1;
                const av = avatarDe(jogador.nome, jogador.avatar);
                const li = criarEl('li', 'glass-panel');
                li.style.setProperty('--cor', av.cor);
                const avEl = criarEl('span', 'av');
                avEl.append(criarEl('span', '', av.emoji));
                const ganho = jogador.ganho ?? 0;
                const pontos = criarEl('span', 'pontos');
                pontos.append(document.createTextNode(String(jogador.pontos)), criarEl('small', '', 'pts'));
                li.append(
                    criarEl('span', 'pos' + (posicao === 1 ? ' p1' : ''), `${posicao}º`),
                    avEl,
                    criarEl('span', 'nome', jogador.nome),
                    criarEl('span', 'ganho ' + (ganho > 0 ? 'positivo' : 'zero'), `+${ganho}`),
                    pontos
                );
                ol.append(li);
                timersTela.push(setTimeout(() => li.classList.add('visivel'), atraso + k * 110));
            });
        }

        // progressoContinuar só traz QUANTOS confirmaram (não quem): bolinhas neutras
        function renderizarBolinhas(total, confirmados) {
            const cont = $('bolinhas-continuar');
            if (cont.children.length !== total) cont.replaceChildren(...Array.from({ length: total }, () => criarEl('span', 'bolinha', '✓')));
            [...cont.children].forEach((b, i) => b.classList.toggle('pronto', i < confirmados));
        }

        function tratarMensagem(msg) {
            switch (msg.type) {
                case 'iniciarSorting': {
                    timersTela.forEach(clearTimeout); timersTela = [];
                    mostrarTela(telaSorting);
                    categoriaANome = msg.categoriaA;
                    categoriaBNome = msg.categoriaB;
                    preencherCategorias();
                    ordemConclusao = [];
                    pistas = new Map();
                    mostrarAguardando();
                    iniciarTimer(msg.tempoLimiteMs);
                    break;
                }
                case 'progressoSorting': {
                    atualizarPistas(msg.jogadores);
                    break;
                }
                case 'resultadoSorting': {
                    clearInterval(intervaloSorting);
                    mostrarTela(telaResultadoSorting);
                    if (msg.categoriaA) categoriaANome = msg.categoriaA;
                    if (msg.categoriaB) categoriaBNome = msg.categoriaB;
                    preencherCategorias();
                    const fim = renderizarGabarito(msg.gabarito);
                    renderizarPlacar(msg.placar, $('placar-sorting'), Math.min(fim, 1400));
                    ultimoPlacar = msg.placar;
                    renderizarBolinhas(msg.placar.length, 0);
                    $('progresso-continuar-sorting').textContent = 'Aguardando jogadores confirmarem…';
                    progressoContinuarAtivoEl = $('progresso-continuar-sorting');
                    break;
                }
                case 'progressoContinuar': {
                    if (progressoContinuarAtivoEl) {
                        progressoContinuarAtivoEl.textContent = `${msg.confirmados} de ${msg.total} prontos`;
                        renderizarBolinhas(msg.total, msg.confirmados);
                    }
                    break;
                }
            }
        }

        // ======== servidor de mentira (as mesmas mensagens do server/sala.js) ========
        const TEMPO_LIMITE_MS = 30000;
        const PONTOS_POR_ITEM = 25;

        const CONJUNTO = {
            categoriaA: 'Marvel',
            categoriaB: 'DC',
            itens: [
                { nome: 'Homem-Aranha', categoria: 'A' },
                { nome: 'Batman', categoria: 'B' },
                { nome: 'Homem de Ferro', categoria: 'A' },
                { nome: 'Superman', categoria: 'B' },
                { nome: 'Hulk', categoria: 'A' },
                { nome: 'Mulher-Maravilha', categoria: 'B' },
                { nome: 'Thor', categoria: 'A' },
                { nome: 'Flash', categoria: 'B' }
            ]
        };

        const JOGADORES = [
            { id: '1', nome: 'Ana',     pontos: 1480, avatar: { emoji: '🦊', cor: '#ff4757' }, ritmo: 1900, erro: 0.10 },
            { id: '2', nome: 'Rodrigo', pontos: 1355, avatar: { emoji: '🐼', cor: '#1e90ff' }, ritmo: 1500, erro: 0.20 },
            { id: '3', nome: 'Carla',   pontos: 1290, avatar: { emoji: '🐸', cor: '#2ed573' }, ritmo: 2600, erro: 0.15 },
            { id: '4', nome: 'Duda',    pontos: 1105, avatar: { emoji: '🦁', cor: '#ffa502' }, ritmo: 3100, erro: 0.25 },
            { id: '5', nome: 'Edu',     pontos:  980, avatar: { emoji: '🦄', cor: '#9b59b6' }, ritmo: 4200, erro: 0.35 },
            { id: '6', nome: 'Bruno',   pontos:  845, avatar: { emoji: '🐧', cor: '#00d2d3' }, ritmo: 2300, erro: 0.20 }
        ];
        JOGADORES.forEach(j => (AVATARES[j.nome] = j.avatar));

        let timers = [];
        const depois = (ms, fn) => timers.push(setTimeout(fn, ms));
        function pararTudo() {
            timers.forEach(clearTimeout);
            timers = [];
            clearInterval(intervaloSorting);
        }

        let estado = null;
        const total = CONJUNTO.itens.length;
        const progressoParaTv = () => estado.jogadores.map(j => ({ nome: j.nome, respondidos: j.respondidos, total }));

        function revelar() {
            if (estado.revelado) return;
            estado.revelado = true;
            pararTudo();
            const placar = estado.jogadores
                .map(j => { const ganho = j.corretos * PONTOS_POR_ITEM; return { id: j.id, nome: j.nome, avatar: j.avatar, pontos: j.pontos + ganho, ganho }; })
                .sort((a, b) => b.pontos - a.pontos);
            tratarMensagem({
                type: 'resultadoSorting',
                categoriaA: CONJUNTO.categoriaA,
                categoriaB: CONJUNTO.categoriaB,
                gabarito: CONJUNTO.itens.map(it => ({ nome: it.nome, categoria: it.categoria })),
                placar
            });
            let confirmados = 0;
            const n = estado.jogadores.length;
            const confirmar = () => {
                confirmados++;
                tratarMensagem({ type: 'progressoContinuar', confirmados, total: n });
                if (confirmados < n) depois(700 + Math.random() * 1800, confirmar);
            };
            depois(3500, confirmar);
        }

        function durante() {
            pararTudo();
            estado = { revelado: false, jogadores: JOGADORES.map(j => ({ ...j, respondidos: 0, corretos: 0 })) };
            tratarMensagem({ type: 'iniciarSorting', categoriaA: CONJUNTO.categoriaA, categoriaB: CONJUNTO.categoriaB, tempoLimiteMs: TEMPO_LIMITE_MS });
            for (const j of estado.jogadores) {
                const responder = () => {
                    if (estado.revelado || j.respondidos >= total) return;
                    j.respondidos++;
                    if (Math.random() >= j.erro) j.corretos++;
                    tratarMensagem({ type: 'progressoSorting', jogadores: progressoParaTv() });
                    if (estado.jogadores.every(o => o.respondidos >= total)) return revelar();
                    if (j.respondidos < total) depois(j.ritmo * (0.6 + Math.random() * 0.8), responder);
                };
                depois(1500 + Math.random() * 1500, responder);
            }
            depois(TEMPO_LIMITE_MS + 500, revelar);
        }

        function resultadoDireto() {
            durante();
            for (const j of estado.jogadores) {
                j.respondidos = total;
                j.corretos = Math.round(total * (1 - j.erro));
            }
            revelar();
        }

        $('botao-durante').addEventListener('click', durante);
        $('botao-resultado').addEventListener('click', resultadoDireto);
        $('botao-repetir').addEventListener('click', durante);
        const params = new URLSearchParams(location.search);
        if (params.has('limpo')) $('barra-prototipo').classList.add('oculto');
        if (params.get('tela') === 'resultado') resultadoDireto(); else durante();
    })();
    </script>
