<!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz TV - Tema Claro Glassmorphism Gamer</title>
        <!-- Fonte 'Outfit' - Super moderna, geométrica, com pegada forte de videogame / tech -->
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
        
        <style>
            :root {
                /* Textos (Alto contraste para TV) */
                --text-main: #0f172a;
                --text-muted: #475569;
                
                /* Cores dos 8 Jogadores (Tons Neon Vibrantes) */
                --p1-color: #ff4757; /* Vermelho Gamer */
                --p2-color: #1e90ff; /* Azul Elétrico */
                --p3-color: #2ed573; /* Verde Tóxico */
                --p4-color: #ffa502; /* Amarelo Mostarda */
                --p5-color: #9b59b6; /* Roxo Mágico */
                --p6-color: #00d2d3; /* Ciano Digital */
                --p7-color: #ff6b81; /* Rosa Chiclete */
                --p8-color: #ff7f50; /* Laranja Coral */

                /* Efeito de Vidro (Glassmorphism) */
                --glass-bg: rgba(255, 255, 255, 0.65);
                --glass-border: rgba(255, 255, 255, 0.9);
                --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Outfit', sans-serif;
                user-select: none;
            }

            body {
                /* Cor base clara e tech (Prata/Gelo) */
                background-color: #f8fafc;
                /* Pattern de Grid pontilhado típico de interfaces Gamer/Tech */
                background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
                background-size: 40px 40px;
                background-position: center;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow: hidden;
                position: relative;
            }

            /* Bolhas de luz no fundo (Tons de gelo, prata e azul bem suave) para não poluir */
            .ambient-light {
                position: absolute;
                border-radius: 50%;
                filter: blur(100px);
                z-index: -1;
                animation: fluidMotion 20s infinite alternate ease-in-out;
            }
            
            /* Paleta PS5 / Next-Gen: Foco no brilho e no aspecto limpo */
            .light-1 { top: -10%; left: -10%; width: 60vw; height: 60vw; background: rgba(226, 232, 240, 0.8); } /* Prata */
            .light-2 { bottom: -20%; right: -10%; width: 50vw; height: 50vw; background: rgba(186, 230, 253, 0.4); animation-delay: -5s; } /* Azul Gelo */
            .light-3 { top: 30%; left: 30%; width: 40vw; height: 40vw; background: rgba(255, 255, 255, 0.9); animation-delay: -10s; } /* Branco Brilhante */
            .light-4 { top: -20%; right: 10%; width: 45vw; height: 45vw; background: rgba(148, 163, 184, 0.25); animation-delay: -7s; } /* Cinza Frio */

            @keyframes fluidMotion {
                0% { transform: translate(0, 0) scale(1); }
                33% { transform: translate(5vw, 10vh) scale(1.1); }
                66% { transform: translate(-5vw, 5vh) scale(0.9); }
                100% { transform: translate(10vw, -5vh) scale(1.05); }
            }

            /* Classe utilitária para gerar o efeito de vidro em qualquer elemento */
            .glass-panel {
                background: var(--glass-bg);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border: 2px solid var(--glass-border);
                box-shadow: var(--glass-shadow);
            }

            .tv-screen {
                display: flex;
                flex-direction: column;
                align-items: center;
                height: 100%;
                padding: 40px 60px 50px;
                z-index: 10;
            }

            .header-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                max-width: 1600px;
                margin-bottom: 20px;
            }

            .info-pill {
                padding: 15px 35px;
                border-radius: 100px;
                display: flex;
                gap: 20px;
                align-items: center;
                animation: slideDown 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            }

            .round-text {
                font-size: 18px;
                font-weight: 800;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 2px;
            }

            .divider {
                width: 3px;
                height: 25px;
                background: rgba(0,0,0,0.1);
                border-radius: 5px;
            }

            .category-text {
                font-size: 24px;
                font-weight: 900;
                color: var(--p5-color); /* Roxo */
                text-transform: uppercase;
                letter-spacing: 3px;
            }

            /* Relógio Gamer de Vidro */
            .timer-module {
                position: relative;
                width: 130px;
                height: 130px;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                animation: slideDown 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s backwards;
            }

            .timer-svg {
                position: absolute;
                top: -10px; left: -10px; right: -10px; bottom: -10px;
                width: 150px; height: 150px;
                transform: rotate(-90deg);
            }

            .timer-bg {
                fill: none;
                stroke: rgba(255,255,255,0.8);
                stroke-width: 10;
            }

            .timer-ring {
                fill: none;
                stroke: var(--text-main);
                stroke-width: 10;
                stroke-linecap: round;
                stroke-dasharray: 408; /* 2 * PI * 65 = 408 */
                stroke-dashoffset: 0;
                transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
            }

            .timer-value {
                font-size: 55px;
                font-weight: 900;
                color: var(--text-main);
                line-height: 1;
                text-shadow: 0 4px 15px rgba(255,255,255,0.8);
            }

            .question-stage {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                max-width: 1400px;
            }

            .question-card {
                padding: 60px 80px;
                border-radius: 40px;
                text-align: center;
                width: 100%;
                /* Uma animação de flutuação suave para dar vida */
                animation: 
                    zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s backwards,
                    floating 6s ease-in-out infinite alternate;
            }

            .question-text {
                font-size: 65px;
                font-weight: 900;
                color: var(--text-main);
                line-height: 1.2;
                letter-spacing: -1px;
                text-wrap: balance;
            }

            @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
            @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
            @keyframes floating { 0% { transform: translateY(0px); } 100% { transform: translateY(-15px); } }

            .players-dock {
                display: flex;
                justify-content: center;
                gap: 20px;
                width: 100%;
                max-width: 1600px;
            }

            /* O "Squircle" (quadrado arredondado) estilo ícone de aplicativo/game */
            .player-pod {
                width: 130px;
                height: 140px;
                border-radius: 28px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 8px;
                position: relative;
                transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); /* Animação elástica */
                cursor: default;
            }

            /* Efeito visual enquanto o jogador Pensa (Pulso suave) */
            .player-pod.thinking {
                animation: pulse-wait 2s infinite ease-in-out;
            }

            @keyframes pulse-wait {
                0% { transform: scale(1); }
                50% { transform: scale(0.97); }
                100% { transform: scale(1); }
            }

            .player-avatar {
                font-size: 55px;
                line-height: 1;
                filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15));
                transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            }

            .player-name {
                font-size: 18px;
                font-weight: 800;
                color: var(--text-muted);
                transition: color 0.3s;
            }

            /* O checkmark estilo videogame que bate na tela quando o jogador vota */
            .ready-stamp {
                position: absolute;
                top: -15px;
                right: -15px;
                width: 45px;
                height: 45px;
                background: var(--text-main);
                color: white;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 24px;
                font-weight: 900;
                border: 4px solid white;
                box-shadow: 0 10px 20px rgba(0,0,0,0.2);
                opacity: 0;
                transform: scale(0) rotate(-45deg);
                transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.1s;
            }

            /* Quando o jogador trava a resposta, o vidro assume a cor dele brilhando */
            .player-pod.locked {
                animation: none; /* Para de pulsar */
                transform: translateY(-20px) scale(1.1); /* Pula pra cima e aumenta */
                border-width: 3px;
            }
            
            .player-pod.locked .player-avatar {
                transform: scale(1.15) rotate(5deg);
            }

            .player-pod.locked .ready-stamp {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }

            .player-pod.locked .player-name {
                color: var(--text-main); /* Escurece o nome para destacar */
            }

            /* Aplicando as cores de neon específicas por cima do vidro quando travado */
            .locked.p1 { background: rgba(255, 71, 87, 0.15); border-color: var(--p1-color); box-shadow: 0 15px 35px rgba(255, 71, 87, 0.3); }
            .locked.p2 { background: rgba(30, 144, 255, 0.15); border-color: var(--p2-color); box-shadow: 0 15px 35px rgba(30, 144, 255, 0.3); }
            .locked.p3 { background: rgba(46, 213, 115, 0.15); border-color: var(--p3-color); box-shadow: 0 15px 35px rgba(46, 213, 115, 0.3); }
            .locked.p4 { background: rgba(255, 165, 2, 0.15); border-color: var(--p4-color); box-shadow: 0 15px 35px rgba(255, 165, 2, 0.3); }
            .locked.p5 { background: rgba(155, 89, 182, 0.15); border-color: var(--p5-color); box-shadow: 0 15px 35px rgba(155, 89, 182, 0.3); }
            .locked.p6 { background: rgba(0, 210, 211, 0.15); border-color: var(--p6-color); box-shadow: 0 15px 35px rgba(0, 210, 211, 0.3); }
            .locked.p7 { background: rgba(255, 107, 129, 0.15); border-color: var(--p7-color); box-shadow: 0 15px 35px rgba(255, 107, 129, 0.3); }
            .locked.p8 { background: rgba(255, 127, 80, 0.15); border-color: var(--p8-color); box-shadow: 0 15px 35px rgba(255, 127, 80, 0.3); }

            /* A cor do selo "Pronto!" assume a cor do jogador */
            .locked.p1 .ready-stamp { background: var(--p1-color); }
            .locked.p2 .ready-stamp { background: var(--p2-color); }
            .locked.p3 .ready-stamp { background: var(--p3-color); }
            .locked.p4 .ready-stamp { background: var(--p4-color); }
            .locked.p5 .ready-stamp { background: var(--p5-color); }
            .locked.p6 .ready-stamp { background: var(--p6-color); }
            .locked.p7 .ready-stamp { background: var(--p7-color); }
            .locked.p8 .ready-stamp { background: var(--p8-color); }

        </style>
    </head>
    <body>

        <!-- Fundo de Luzes Vivas (Videogame Energy) -->
        <div class="ambient-light light-1"></div>
        <div class="ambient-light light-2"></div>
        <div class="ambient-light light-3"></div>
        <div class="ambient-light light-4"></div>

        <div class="tv-screen">
            
            <!-- Cabeçalho (Round e Timer) -->
            <div class="header-bar">
                <div class="info-pill glass-panel">
                    <span class="round-text">Rodada 2 / 3</span>
                    <div class="divider"></div>
                    <span class="category-text">🌍 Geografia</span>
                </div>

                <div class="timer-module glass-panel">
                    <svg class="timer-svg" viewBox="0 0 150 150">
                        <circle class="timer-bg" cx="75" cy="75" r="65"></circle>
                        <circle class="timer-ring" id="timer-ring" cx="75" cy="75" r="65"></circle>
                    </svg>
                    <span class="timer-value" id="timer-text">10</span>
                </div>
            </div>

            <!-- Área da Pergunta (Vidro Gigante) -->
            <div class="question-stage">
                <div class="question-card glass-panel">
                    <h1 class="question-text">Qual é o maior país do mundo em extensão territorial?</h1>
                </div>
            </div>

            <!-- Pódios dos 8 Jogadores -->
            <div class="players-dock">
                <!-- J1: Raposa (Vermelho) -->
                <div class="player-pod glass-panel thinking" id="p1">
                    <div class="ready-stamp">✓</div>
                    <div class="player-avatar">🦊</div>
                    <div class="player-name">Raposa</div>
                </div>
                <!-- J2: Panda (Azul) -->
                <div class="player-pod glass-panel thinking" id="p2">
                    <div class="ready-stamp">✓</div>
                    <div class="player-avatar">🐼</div>
                    <div class="player-name">Panda</div>
                </div>
                <!-- J3: Sapo (Verde) -->
                <div class="player-pod glass-panel thinking" id="p3">
                    <div class="ready-stamp">✓</div>
                    <div class="player-avatar">🐸</div>
                    <div class="player-name">Sapo</div>
                </div>
                <!-- J4: Leão (Amarelo) -->
                <div class="player-pod glass-panel thinking" id="p4">
                    <div class="ready-stamp">✓</div>
                    <div class="player-avatar">🦁</div>
                    <div class="player-name">Leão</div>
                </div>
                <!-- J5: Unicórnio (Roxo) -->
                <div class="player-pod glass-panel thinking" id="p5">
                    <div class="ready-stamp">✓</div>
                    <div class="player-avatar">🦄</div>
                    <div class="player-name">Unicórn.</div>
                </div>
                <!-- J6: Pinguim (Ciano) -->
                <div class="player-pod glass-panel thinking" id="p6">
                    <div class="ready-stamp">✓</div>
                    <div class="player-avatar">🐧</div>
                    <div class="player-name">Pinguim</div>
                </div>
                <!-- J7: Polvo (Rosa) -->
                <div class="player-pod glass-panel thinking" id="p7">
                    <div class="ready-stamp">✓</div>
                    <div class="player-avatar">🐙</div>
                    <div class="player-name">Polvo</div>
                </div>
                <!-- J8: Tigre (Laranja) -->
                <div class="player-pod glass-panel thinking" id="p8">
                    <div class="ready-stamp">✓</div>
                    <div class="player-avatar">🐯</div>
                    <div class="player-name">Tigre</div>
                </div>
            </div>

        </div>

        <script>
            // CONFIGURAÇÕES DO RELÓGIO
            const TOTAL_TIME = 10;
            let timeLeft = TOTAL_TIME;
            
            const timerText = document.getElementById('timer-text');
            const timerRing = document.getElementById('timer-ring');
            
            // Circunferência para a animação do anel SVG
            const radius = 65;
            const circumference = 2 * Math.PI * radius; // Aprox 408
            timerRing.style.strokeDasharray = circumference;
            timerRing.style.strokeDashoffset = 0;

            // Animação do Tempo
            const gameClock = setInterval(() => {
                timeLeft--;
                timerText.textContent = timeLeft;
                
                // Drenando o anel (stroke-dashoffset avança)
                const percent = timeLeft / TOTAL_TIME;
                timerRing.style.strokeDashoffset = circumference - (percent * circumference);

                // Aumento de tensão visual (Energy Boost!)
                if (timeLeft <= 3 && timeLeft > 0) {
                    // Fica vermelho e dá um pulso cardíaco no timer inteiro
                    timerRing.style.stroke = 'var(--p1-color)'; // Vermelho
                    timerText.style.color = 'var(--p1-color)';
                    
                    const module = document.querySelector('.timer-module');
                    module.style.transform = 'scale(1.15)';
                    module.style.borderColor = 'var(--p1-color)';
                    module.style.boxShadow = '0 0 40px rgba(255, 71, 87, 0.4)';
                    
                    setTimeout(() => {
                        module.style.transform = 'scale(1)';
                    }, 200);
                }

                // Tempo Esgotado
                if (timeLeft <= 0) {
                    clearInterval(gameClock);
                    timerText.textContent = "0";
                    
                    // Finaliza: pisca a pergunta para indicar fim do tempo
                    const qCard = document.querySelector('.question-card');
                    qCard.style.transform = 'scale(1.05)';
                    setTimeout(() => qCard.style.transform = 'scale(1)', 300);
                }
            }, 1000);

            // FUNÇÃO DE FEEDBACK DE VOTO
            // Recebe o ID (p1 a p8). Adiciona a classe 'locked' e a classe de cor ('p1', etc)
            function playerLockedAnswer(playerId) {
                const pod = document.getElementById(playerId);
                if(pod) {
                    pod.classList.remove('thinking');
                    pod.classList.add('locked', playerId);
                    // Um detalhe de game design: tocaria um efeito sonoro de "pop" aqui!
                }
            }

            // SIMULAÇÃO DA GALERA NO SOFÁ JOGANDO
            // Em um ambiente real, seu Raspberry Pi vai acionar a função playerLockedAnswer() 
            // sempre que receber um aviso via socket/API do celular do jogador.
            
            setTimeout(() => playerLockedAnswer('p2'), 1500); // Panda (Azul) é o mais rápido!
            setTimeout(() => playerLockedAnswer('p5'), 2800); // Unicórnio (Roxo)
            setTimeout(() => playerLockedAnswer('p7'), 4000); // Polvo (Rosa)
            setTimeout(() => playerLockedAnswer('p1'), 5500); // Raposa (Vermelho)
            setTimeout(() => playerLockedAnswer('p8'), 6200); // Tigre (Laranja)
            setTimeout(() => playerLockedAnswer('p4'), 7500); // Leão (Amarelo)
            setTimeout(() => playerLockedAnswer('p6'), 8500); // Pinguim (Ciano) - Quase no fim!
            
            // O jogador 3 (Sapo) vacilou e não respondeu a tempo nesta simulação!
        </script>
    </body>
    </html>
